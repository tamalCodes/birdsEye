<html lang="en">

    <style>
      :root {
        color-scheme: dark;

        /* Warm charcoal + clay: this is a structure map for an AI tool, not a
           dashboard, so surfaces run warm and the node hues are warm-shifted as
           far as they go while still reading as separate things. */
        --c-root: #e8d9c4;
        --c-zone: #b7a488;
        --c-feature: #d97757;
        --c-shared: #c68f66;
        --c-folder: #c9a56b;
        --c-file: #a9b764;

        --bg: #171512;
        --bg-panel: #201d19;
        --bg-raised: #2a2621;
        --sheet: #1c1a16;
        --line: #38332c;
        --line-soft: #2c2822;
        --line-strong: #6b6355;
        --dot: #221f1a;
        --hl: #faf9f5;
        --text: #dedacf;
        --text-dim: #918a7c;
        --accent: #d97757;
        --edge: #6b6355;
        --edge-out: #d97757;
        --edge-in: #a9b764;
        --row-hover: rgba(255, 246, 232, .05);
        --row-sel: rgba(217, 119, 87, .16);
        --shadow: 0 12px 34px rgba(10, 7, 3, .5);
        --header-h: 56px;
        --sidebar-w: 300px;

        --font: "Outfit", "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Arial, sans-serif;
        --font-hand: "Patrick Hand", "Comic Sans MS", var(--font);
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }

      [data-theme="light"] {
        color-scheme: light;
        --c-root: #4a3f30;
        --c-zone: #8a7860;
        --c-feature: #bf5b36;
        --c-shared: #a86b45;
        --c-folder: #9a6a12;
        --c-file: #5e7524;

        --bg: #faf9f5;
        --bg-panel: #f2f0e8;
        --bg-raised: #e9e6db;
        --sheet: #fffdf8;
        --line: #e0dcd0;
        --line-soft: #ebe8de;
        --line-strong: #beb8a8;
        --dot: #e7e4d9;
        --hl: #171512;
        --text: #211e19;
        --text-dim: #706a5e;
        --accent: #bf5b36;
        --edge: #b0a892;
        --edge-out: #bf5b36;
        --edge-in: #5e7524;
        --row-hover: rgba(60, 48, 32, .05);
        --row-sel: rgba(191, 91, 54, .12);
        --shadow: 0 12px 34px rgba(70, 55, 35, .14);
      }

      @font-face {
        font-family: "Outfit";
        src: url("__FONT_OUTFIT__") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      /* The canvas diagram (node/edge labels) reads in a hand-lettered
         face to match the sketchy rough.js overlay; the surrounding UI
         chrome (header, tree, panel) stays in Outfit for legibility of
         dense prose. */
      @font-face {
        font-family: "Patrick Hand";
        src: url("__FONT_HAND__") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 var(--font);
        overflow: hidden;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

      header {
        position: fixed; inset: 0 0 auto 0; z-index: 40;
        display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
        height: var(--header-h); padding: 0 12px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; min-width: 0; }
      .brand svg { width: 20px; height: 20px; flex: none; }
      .brand b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      .brand span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; }
      .spacer { flex: 1; }

      .search { position: relative; display: flex; align-items: center; min-width: 0; }
      .search input {
        width: 230px; height: 32px; padding: 0 10px 0 30px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; outline: none;
      }
      .search input:focus { border-color: var(--accent); }
      .search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--text-dim); pointer-events: none; }

      button.tool {
        height: 32px; padding: 0 11px;
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; cursor: pointer; white-space: nowrap;
      }
      button.tool:hover { border-color: var(--line-strong); }
      button.tool svg { width: 14px; height: 14px; }
      .icon-only { width: 32px; padding: 0; justify-content: center; }
      [data-theme="light"] .ico-moon, :root:not([data-theme="light"]) .ico-sun { display: none; }

      main { position: absolute; inset: var(--header-h) 0 0 0; display: flex; }

      /* ---- sidebar tree ---------------------------------------------- */
      #sidebar {
        width: var(--sidebar-w); flex: none;
        display: flex; flex-direction: column;
        background: var(--bg-panel); border-right: 1px solid var(--line);
        overflow: hidden; transition: width .18s ease, opacity .15s ease;
      }
      main.nav-collapsed #sidebar {
        width: 0; opacity: 0; border-right-color: transparent; pointer-events: none;
      }
      /* Only ever a thing on narrow screens (see the media block); off the
         layout entirely otherwise. */
      #scrim { display: none; }
      .side-head {
        display: flex; align-items: center; gap: 6px;
        padding: 8px 10px; border-bottom: 1px solid var(--line-soft);
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim);
      }
      .side-head .spacer { flex: 1; }
      .mini {
        height: 24px; padding: 0 8px; border-radius: 6px;
        background: transparent; color: var(--text-dim);
        border: 1px solid var(--line); font: inherit; font-size: 11px; cursor: pointer;
      }
      .mini:hover { color: var(--text); border-color: var(--line-strong); }
      #tree { flex: 1; overflow: auto; padding: 6px 0 40px; }

      .row {
        display: flex; align-items: center; gap: 6px;
        height: 26px; padding-right: 10px;
        cursor: pointer; user-select: none; white-space: nowrap;
        border-left: 2px solid transparent;
      }
      .row:hover { background: var(--row-hover); }
      .row.sel { background: var(--row-sel); border-left-color: var(--accent); }
      .row .tw {
        width: 14px; height: 14px; flex: none;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-dim);
      }
      .row .tw svg { width: 9px; height: 9px; transition: transform .12s; }
      .row.open .tw svg { transform: rotate(90deg); }
      .row .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--k, var(--text-dim)); }
      .row .lbl { overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
      .row .lbl.mod { font-weight: 600; }
      .row .cnt { margin-left: auto; font-size: 10.5px; color: var(--text-dim); flex: none; padding-left: 8px; }
      .row.hit .lbl { color: var(--accent); }
      .tree-empty { padding: 20px 14px; color: var(--text-dim); font-size: 12px; }

      /* ---- stage / canvas ------------------------------------------- */
      #stage { position: relative; flex: 1; min-width: 0; }
      #cy { position: absolute; inset: 0; }
      #cy::before {
        content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 26px 26px;
      }
      /* Hand-sketched overlay: rough.js redraws every node border and edge
         here, in sync with cytoscape's own layout, on top of cytoscape's
         (otherwise invisible-stroked) canvas beneath it. Never intercepts
         input - cytoscape's canvas still owns every click/drag/hover. */
      #sketch { position: absolute; inset: 0; z-index: 1; pointer-events: none; }

      .crumb {
        position: absolute; left: 12px; top: 12px; z-index: 20;
        display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
        max-width: calc(100% - 360px);
        padding: 6px 10px; border-radius: 9px;
        background: var(--bg-panel); border: 1px solid var(--line);
        font-size: 12px; box-shadow: var(--shadow);
      }
      .crumb a { color: var(--text-dim); cursor: pointer; text-decoration: none; padding: 1px 4px; border-radius: 5px; }
      .crumb a:hover { color: var(--text); background: var(--row-hover); }
      .crumb a:last-child { color: var(--text); font-weight: 600; }
      .crumb i { color: var(--line-strong); font-style: normal; }

      .legend {
        position: absolute; left: 12px; bottom: 12px; z-index: 20;
        background: var(--bg-panel); border: 1px solid var(--line);
        border-radius: 999px; box-shadow: var(--shadow);
        font-size: 11px; color: var(--text-dim);
        overflow: hidden; transition: border-radius .15s;
      }
      .legend > .legend-key {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 5px 10px; cursor: default; user-select: none; color: var(--text-dim);
      }
      .legend > .legend-key svg { width: 12px; height: 12px; opacity: .7; }
      .legend .legend-items {
        display: none; flex-wrap: wrap; gap: 4px 12px; max-width: 320px;
        padding: 4px 11px 9px;
      }
      .legend:hover { border-radius: 12px; }
      .legend:hover .legend-key { display: none; }
      .legend:hover .legend-items { display: flex; }
      .legend i { display: inline-flex; align-items: center; gap: 5px; font-style: normal; }
      .legend i::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--k, var(--text-dim)); }
      .legend .arrow::before { width: 14px; height: 2px; border-radius: 0; }

      /* ---- detail panel -------------------------------------------- */
      #panel {
        position: absolute; top: 12px; right: 12px; bottom: 12px; z-index: 30;
        width: 330px; max-width: calc(100vw - 24px);
        display: none; flex-direction: column;
        background: var(--sheet); border: 1px solid var(--line);
        border-radius: 14px; box-shadow: var(--shadow);
        overflow: hidden;
      }
      #panel.open { display: flex; }
      .p-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--line-soft); }
      .p-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
      .p-title { font-size: 16px; font-weight: 600; margin: 3px 0 0; word-break: break-word; }
      .p-path { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); margin-top: 4px; word-break: break-all; }
      .p-body { padding: 12px 16px 16px; overflow-y: auto; flex: 1; min-height: 0; -webkit-overflow-scrolling: touch; }
      .p-close {
        position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
        border: none; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 17px; line-height: 1;
      }
      .p-close:hover { color: var(--text); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 14px; }
      .stat { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 9px; padding: 8px 10px; }
      .stat b { display: block; font-size: 17px; font-weight: 600; }
      .stat span { font-size: 11px; color: var(--text-dim); }
      .p-sec { margin-top: 14px; }
      .p-sec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 0 0 6px; }
      .dep { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
      .dep:hover { color: var(--accent); }
      .dep .n { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dep .w { font-size: 11px; color: var(--text-dim); flex: none; }
      .dep .w.expandable { cursor: pointer; padding: 2px 6px; border-radius: 5px; }
      .dep .w.expandable:hover { background: var(--bg-panel); color: var(--accent); }
      .dep-files { padding: 2px 0 6px 10px; border-bottom: 1px solid var(--line-soft); }
      .dep-file { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-family: var(--mono); font-size: 11px; }
      .dep-file .fp { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
      .dep-file .fp:hover { color: var(--accent); text-decoration: underline; }
      .dep-file .arrow { color: var(--text-dim); flex: none; }
      .dep-file-empty { font-size: 11px; color: var(--text-dim); padding: 3px 0; }
      .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--bg-raised); color: var(--text-dim); margin: 0 4px 4px 0; }
      .btn-open {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
        height: 30px; padding: 0 12px; border-radius: 8px;
        background: var(--accent); color: #fff; border: none; font: inherit; cursor: pointer; text-decoration: none;
      }

      .hint {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 15;
        padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--text-dim);
        background: var(--bg-panel); border: 1px solid var(--line);
        pointer-events: none; opacity: 0; transition: opacity .3s;
      }
      .hint.show { opacity: 1; }

      .node-tip {
        position: fixed; z-index: 50;
        max-width: 320px; padding: 5px 9px; border-radius: 7px;
        background: var(--sheet); border: 1px solid var(--line);
        box-shadow: var(--shadow);
        font-size: 12px; font-family: var(--mono); color: var(--text);
        word-break: break-all; pointer-events: none;
        display: none;
      }
      .node-tip.show { display: block; }
      .node-tip.help { font-family: var(--font); word-break: normal; line-height: 1.4; max-width: 240px; }

      /* ---- responsive ---------------------------------------------------
         The map is a flowchart people open wherever the link lands - a 4K
         monitor, a 13" laptop, a phone. Three progressive steps: tighten the
         header, then float the structure list over the canvas instead of
         squeezing it, then drop the detail panel to a bottom sheet so it
         never buries the diagram it describes. */
      @media (max-width: 1040px) {
        :root { --sidebar-w: 260px; }
        .crumb { max-width: calc(100% - 340px); }
      }

      @media (max-width: 760px) {
        header { gap: 8px; padding: 0 10px; }
        .brand span { display: none; }
        .brand b { max-width: 34vw; white-space: nowrap; }
        .spacer { display: none; }
        .search { flex: 1 1 auto; }
        .search input { width: 100%; }

        #sidebar {
          position: absolute; inset: 0 auto 0 0; z-index: 45;
          width: min(82vw, 300px);
          border-right: 1px solid var(--line); box-shadow: var(--shadow);
          transform: translateX(0);
          transition: transform .2s ease;
        }
        main.nav-collapsed #sidebar {
          width: min(82vw, 300px); opacity: 1; pointer-events: none;
          border-right-color: var(--line);
          transform: translateX(-101%);
        }
        #scrim {
          display: block; position: absolute; inset: 0; z-index: 44;
          background: rgba(0, 0, 0, .45);
          opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        main:not(.nav-collapsed) #scrim { opacity: 1; pointer-events: auto; }

        .crumb { left: 8px; top: 8px; max-width: calc(100% - 16px); padding: 5px 9px; font-size: 11px; }

        #panel {
          top: auto; left: 8px; right: 8px; bottom: 8px;
          width: auto; max-width: none; max-height: 68vh;
        }
        .legend { display: none; }
        .hint { bottom: auto; top: calc(var(--header-h) + 44px); }
      }

      @media (max-width: 420px) {
        :root { --header-h: 52px; }
        .brand b { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="tool icon-only" id="navToggle" title="Show or hide the structure list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="brand">
        <svg viewBox="16 19 208 208" aria-hidden="true"><path transform="translate(0 8)" d="M120 52C129 54 133 66 134 82C150 92 186 116 210 146C213 150 211 154 206 153C176 150 150 140 133 128C132 145 128 164 120 178C112 164 108 145 107 128C90 140 64 150 34 153C29 154 27 150 30 146C54 116 90 92 106 82C107 66 111 54 120 52Z" fill="var(--accent)"/></svg>
        <b id="repoName"></b><span id="sub"></span>
      </span>
      <span class="spacer"></span>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Find a module or file" autocomplete="off" spellcheck="false" />
      </label>
      <button class="tool icon-only" id="fit" title="Re-centre the diagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
      <button class="tool icon-only" id="theme" title="Toggle theme">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </header>

    <main>
      <aside id="sidebar">
        <div class="side-head">
          <span>Structure</span>
          <span class="spacer"></span>
          <button class="mini" id="expandAll" title="Open every folder">Expand</button>
          <button class="mini" id="collapseAll" title="Close everything">Collapse</button>
        </div>
        <div id="tree"></div>
      </aside>
      <div id="scrim"></div>

      <section id="stage">
        <div id="cy"></div>
        <canvas id="sketch"></canvas>
        <div class="crumb" id="crumb"></div>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint"></div>
        <div class="node-tip" id="nodeTip"></div>
        <aside id="panel">
          <button class="p-close" title="Close">&times;</button>
          <div class="p-head">
            <div class="p-kind" id="pKind"></div>
            <div class="p-title" id="pTitle"></div>
            <div class="p-path" id="pPath"></div>
          </div>
          <div class="p-body" id="pBody"></div>
        </aside>
      </section>
    </main>

    <script>__VENDOR__</script>
    <script id="graph-data" type="application/json">__GRAPH__</script>
    <script>
      (function () {
        'use strict';
        var GRAPH = JSON.parse(document.getElementById('graph-data').textContent);
        var STORE = '__STORAGE_KEY__';
        var save = function (k, v) { try { localStorage.setItem(STORE + ':' + k, v); } catch (e) {} };
        var load = function (k) { try { return localStorage.getItem(STORE + ':' + k); } catch (e) { return null; } };

        // Below this width the sidebar floats over the canvas as a drawer and
        // the panel is a bottom sheet, so the diagram needs far less breathing
        // room around it when it fits.
        var isNarrow = function () { return window.matchMedia('(max-width: 760px)').matches; };
        var fitPad = function () { return isNarrow() ? 22 : 60; };

        (function initTheme() {
          if (load('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();

        // Structure list is hidden by default; the header button brings it back.
        (function initNav() {
          if (load('nav') !== 'open') document.querySelector('main').classList.add('nav-collapsed');
        })();

        // ---- indexes -------------------------------------------------
        var nodeById = {};
        GRAPH.nodes.forEach(function (n) { nodeById[n.id] = n; });
        var parentOf = {}, childrenOf = {};
        GRAPH.nodes.forEach(function (n) { childrenOf[n.id] = []; });
        GRAPH.edges.forEach(function (e) {
          if (e.type !== 'contains') return;
          parentOf[e.to] = e.from;
          (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to);
        });
        var depEdges = GRAPH.edges.filter(function (e) { return e.type === 'depends'; });
        var ROOT = GRAPH.nodes.find(function (n) { return n.type === 'root'; });
        var ROOT_ID = ROOT ? ROOT.id : GRAPH.nodes[0].id;

        var TYPE_COLOR = { root: '--c-root', zone: '--c-zone', folder: '--c-folder', file: '--c-file' };
        function colorVar(n) {
          if (n.type === 'module') return n.meta && n.meta.kind === 'shared' ? '--c-shared' : '--c-feature';
          return TYPE_COLOR[n.type] || '--c-file';
        }
        function cssVal(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

              // instead of a filled triangle.
              var ang = Math.atan2(tB.y - cy2, tB.x - cx);
              var ah = 11 * Math.min(1.4, Math.max(0.7, zoom));
              [ang + Math.PI - 0.4, ang + Math.PI + 0.4].forEach(function (a, i) {
                rc.line(tB.x, tB.y, tB.x + ah * Math.cos(a), tB.y + ah * Math.sin(a),
                  { stroke: col, strokeWidth: 2, roughness: 1.3, seed: seedFor(e.id() + ':a' + i) });
              });
            }
          });
          cy.nodes().forEach(function (n) {
            if (!n.visible()) return;
            var nOp = n.numericStyle('opacity');
            if (nOp === 0) return;
            skCtx.globalAlpha = isNaN(nOp) ? 1 : nOp;
            var role = n.data('role');
            var pos = n.renderedPosition();
            var w = n.renderedOuterWidth(), h = n.renderedOuterHeight();
            var isFrame = role === 'box' || role === 'colframe';
            // Real nodes get a neutral "ink" outline (--hl flips light/dark
            // with the theme, so it always contrasts against the coloured
            // fill underneath) rather than matching their own hue, which
            // would nearly disappear into an already-saturated fill.
            // Frames and folder-children stay dashed, same meaning as
            // before ("a boundary, not a hard edge").
            var dashed = isFrame || role === 'child';
            var opts = {
              stroke: isFrame ? frameStroke(n) : cssVal('--hl'),
              strokeWidth: role === 'focus' ? 2.6 : 1.6,
              roughness: role === 'focus' ? 1.1 : 1.6,
              bowing: 1.2,
              seed: seedFor(n.id()),
            };
            if (dashed) opts.strokeLineDash = isFrame ? [7, 6] : [5, 4];
            rc.rectangle(pos.x - w / 2, pos.y - h / 2, w, h, opts);
          });
        }
        var skPending = false;
        function scheduleSketch() {
          if (skPending) return;
          skPending = true;
          requestAnimationFrame(function () { skPending = false; drawSketch(); });
        }
        resizeSketch();
        cy.on('render', scheduleSketch);

        // A dependency-column pill ("used by" / "depends on") opens the file
        // list behind its count on tap rather than jumping the whole canvas
        // to that node - jumping away is what buried the detail before,
        // since the "used by transform" framing was lost the moment you
        // landed on transform's own neighbourhood. Double-tap still jumps,
        // for anyone who does want to explore from there.
        cy.on('tap', 'node[role="in"], node[role="out"]', function (ev) {
          showDepDetail(ev.target.id(), ev.target.data('role'));
        });
        cy.on('tap', 'edge[kind="in"], edge[kind="out"]', function (ev) {
          showDepDetail(ev.target.data('other'), ev.target.data('kind'));
        });
        cy.on('dbltap', 'node[role="in"], node[role="out"]', function (ev) {
          focus(ev.target.id());
        });
        cy.on('tap', 'node', function (ev) {
          var id = ev.target.id();
          if (id.indexOf('e:') === 0) return;
          var role = ev.target.data('role');
          if (role === 'in' || role === 'out') return; // handled above
          if (id !== focusId) focus(id);
        });
        cy.on('dbltap', 'node[type="file"]', function (ev) {
          var href = editorHref(nodeById[ev.target.id()]);
          if (href) window.location.href = href;
        });
        cy.on('mouseover', 'node[role="in"], node[role="out"], edge[kind="in"], edge[kind="out"]', function () {
          document.getElementById('cy').style.cursor = 'pointer';
        });
        cy.on('mouseout', 'node[role="in"], node[role="out"], edge[kind="in"], edge[kind="out"]', function () {
          document.getElementById('cy').style.cursor = '';
        });
        // Every node is freely draggable (cytoscape's default - nothing
        // here turns it off). A frame is only a hint that its contents
        // are grouped; the moment you drag one of them out of place
        // that hint is no longer true, so the frame fades away rather
        // than sit there making a now-false claim.
        cy.on('grab', 'node[role="in"], node[role="out"], node[role="child"]', function (ev) {
          var fid = ev.target.data('frame');
          if (!fid) return;
          var fr = cy.getElementById(fid);
          if (fr.empty() || fr.data('fading')) return;
          fr.data('fading', true);
          fr.animate({ style: { opacity: 0 } }, { duration: 320, easing: 'ease-out', complete: function () { fr.remove(); } });
        });
        // Node labels ellipsize in the fixed-width boxes; a hover tooltip is
        // the only way to read the full name (or a file's full relative path)
        // without leaving the canvas.
        var nodeTip = document.getElementById('nodeTip');
        var pointerX = 0, pointerY = 0;
        document.getElementById('cy').addEventListener('mousemove', function (e) { pointerX = e.clientX; pointerY = e.clientY; });
        function placeTip() {
          var pad = 14, w = nodeTip.offsetWidth || 0, h = nodeTip.offsetHeight || 0;
          var x = pointerX + pad, y = pointerY + pad;
          if (x + w > window.innerWidth - 8) x = pointerX - w - pad;
          if (y + h > window.innerHeight - 8) y = pointerY - h - pad;
          nodeTip.style.left = x + 'px'; nodeTip.style.top = y + 'px';
        }
        // Frame backdrops (role box/colframe) have events:'no' and never
        // reach here - a tooltip only ever describes one specific node,
        // never a generic explainer for a whole grouping.
        var noHover = window.matchMedia('(hover: none)').matches;
        cy.on('mouseover', 'node', function (ev) {
          ev.target.addClass('hover');
          var id = ev.target.id();
          if (id.indexOf('e:') === 0) return;
          // On touch devices a tap emits a synthetic mouseover with no
          // matching mouseout - the tooltip would stick. Tap handlers cover
          // the same ground there anyway.
          if (noHover) return;
          var n = nodeById[id];
          if (!n) return;
          var tip = n.path || n.label;
          var isDep = ev.target.data('role') === 'in' || ev.target.data('role') === 'out';
          if (isDep) tip += ' - click to see the specific files, double-click to jump here';
          nodeTip.classList.toggle('help', isDep);
          nodeTip.textContent = tip;
          nodeTip.classList.add('show');
          placeTip();
        });
        cy.on('mouseout', 'node', function (ev) { ev.target.removeClass('hover'); nodeTip.classList.remove('show', 'help'); });
        cy.on('mousemove', 'node', function () { if (nodeTip.classList.contains('show')) placeTip(); });
        cy.on('pan zoom', function () { nodeTip.classList.remove('show'); });

        // ---- focus: the one function that moves the whole view -----
        var focusId = null;
        var lastHiddenKids = 0;
        function focus(id) {
          if (!nodeById[id]) return;
          focusId = id;
          ancestry(id).forEach(function (a) { openTree[a] = 1; });
          persistOpen();
          renderTree();

          var nb = neighbourhood(id);
          lastHiddenKids = nb.hiddenKids;
          cy.elements().remove();
          cy.add(nb.els);
          cy.layout({ name: 'preset' }).run();
          cy.animate({ fit: { eles: cy.elements(), padding: fitPad() }, duration: 260, easing: 'ease-out-cubic' });

          drawCrumb(id);
          showPanel(id, nb.hiddenKids);
        }

        // Open the side panel for the current focus node and jump straight
        // to the file-level detail for one dependency pill/arrow, without
        // moving the canvas - clicking "transform" while looking at
        // "integrate" should show what transform actually imports from
        // integrate, not abandon that context to go look at transform's
        // own neighbourhood instead.
        function showDepDetail(otherId, dir) {
          showPanel(focusId, lastHiddenKids);
          var w = panel.querySelector('.w.expandable[data-other="' + otherId + '"][data-dir="' + dir + '"]');
          if (w) { toggleDepFiles(w, focusId); w.scrollIntoView({ block: 'center' }); return; }
          var row = panel.querySelector('.dep[data-id="' + otherId + '"]');
          if (row) row.scrollIntoView({ block: 'center' });
        }

        function drawCrumb(id) {
          var chain = ancestry(id).concat([id]);
          document.getElementById('crumb').innerHTML = chain.map(function (cid, i) {
            return (i ? '<i>›</i>' : '') + '<a data-id="' + esc(cid) + '">' + esc(nodeById[cid].label) + '</a>';
          }).join('');
        }
        document.getElementById('crumb').addEventListener('click', function (ev) {
          var a = ev.target.closest('a'); if (a) focus(a.dataset.id);
        });

        // ---- detail panel ---------------------------------------
        var panel = document.getElementById('panel');
        var KIND_LABEL = { root: 'Code root', zone: 'Group', module: 'Module', folder: 'Folder', file: 'File' };
        function showPanel(id, hiddenKids) {
          var n = nodeById[id], m = n.meta || {};
          document.getElementById('pKind').textContent =
            (n.type === 'module' && m.kind === 'shared') ? 'General-purpose module' :
            (n.type === 'module' && m.ambiguous) ? 'Module (best guess)' : (KIND_LABEL[n.type] || n.type);
          document.getElementById('pTitle').textContent = n.label;
          document.getElementById('pPath').textContent = n.path || '';
          var b = document.getElementById('pBody');
          var h = '';

          var stats = [];
          if (n.type === 'file') {
            if (m.symbolCount != null) stats.push([m.symbolCount, 'functions / classes']);
            if (m.loc) stats.push([m.loc, 'lines']);
            if (m.lang) stats.push([m.lang, 'language']);
          } else {
            stats.push([m.descendantFiles || 0, 'code files']);
            if (m.fileCount != null) stats.push([m.fileCount, 'files total']);
            if (m.codeFileCount != null) stats.push([m.codeFileCount, 'direct code files']);
            if (m.symbolCount) stats.push([m.symbolCount, 'symbols']);
          }
          if (stats.length) {
            h += '<div class="stats">' + stats.map(function (s) {
              return '<div class="stat"><b>' + esc(String(s[0])) + '</b><span>' + esc(s[1]) + '</span></div>';
            }).join('') + '</div>';
          }
          if (m.entry) h += '<span class="tag">entry point</span>';
          if (n.type === 'module' && m.sharedKind) h += '<span class="tag">' + esc(m.sharedKind) + '</span>';
          if (n.type === 'module' && m.ambiguous) h += '<div style="font-size:12px;color:var(--text-dim);margin:6px 0">No screens or clear infrastructure name - birdsEye guessed this is a feature. Correct it in <code>structure.json</code> if wrong.</div>';
          if (hiddenKids > 0) h += '<div style="font-size:12px;color:var(--text-dim);margin:6px 0">' + hiddenKids + ' more item' + (hiddenKids > 1 ? 's' : '') + ' not drawn - open this folder in the sidebar to see them all.</div>';

          var out = rollDepsLabelled(id, 'out'), inc = rollDepsLabelled(id, 'in');
          // Rows only aggregate several files into one when the focused
          // node itself isn't a single file - that's the only case where
          // there's anything underneath a weight to drill into.
          var expandable = n.type !== 'file';
          if (out.length) h += depSection('Depends on', out, id, 'out', expandable);
          if (inc.length) h += depSection('Used by', inc, id, 'in', expandable);
          if (!out.length && !inc.length) h += '<div class="p-sec" style="color:var(--text-dim);font-size:12px">No tracked dependencies at this level.</div>';

          if (n.type === 'file') {
            var href = editorHref(n);
            if (href) h += '<a class="btn-open" href="' + esc(href) + '">Open in editor</a>';
          }
          b.innerHTML = h;
          b.querySelectorAll('.dep').forEach(function (el) {
            el.addEventListener('click', function () {
              var t = el.getAttribute('data-id');
              if (t && nodeById[t]) focus(t);
            });
          });
          b.querySelectorAll('.w.expandable').forEach(function (el) {
            el.addEventListener('click', function (ev) {
              ev.stopPropagation();
              toggleDepFiles(el, id);
            });
          });
          panel.classList.add('open');
        }
        function toggleDepFiles(el, id) {
          var otherId = el.getAttribute('data-other'), dir = el.getAttribute('data-dir');
          var box = el.closest('.dep-row').querySelector('.dep-files');
          if (!box.hidden) { box.hidden = true; return; }
          if (!box.dataset.filled) {
            var files = rollDepsFileList(id, otherId, dir).slice(0, 60);
            box.innerHTML = files.length ? files.map(function (f) {
              var fromN = nodeById[f.from], toN = nodeById[f.to];
              return '<div class="dep-file"><span class="fp" data-id="' + esc(f.from) + '">' + esc(fromN ? fromN.path : f.from) + '</span>' +
                '<span class="arrow">imports &rarr;</span>' +
                '<span class="fp" data-id="' + esc(f.to) + '">' + esc(toN ? toN.path : f.to) + '</span></div>';
            }).join('') : '<div class="dep-file-empty">No file-level detail available.</div>';
            box.dataset.filled = '1';
            box.querySelectorAll('.fp').forEach(function (fp) {
              fp.addEventListener('click', function (ev) {
                ev.stopPropagation();
                var t = fp.getAttribute('data-id');
                if (t && nodeById[t]) focus(t);
              });
            });
          }
          box.hidden = false;
        }
        function rollDepsLabelled(id, dir) {
          return rollDeps(id, dir).slice(0, 40).map(function (d) {
            var n = nodeById[d.id];
            return { id: d.id, label: n ? (n.type === 'file' ? n.path : n.label) : d.id, weight: d.weight };
          });
        }
        function depSection(title, list, id, dir, expandable) {
          return '<div class="p-sec"><h4>' + esc(title) + '</h4>' + list.map(function (d) {
            return '<div class="dep-row">' +
              '<div class="dep" data-id="' + esc(d.id) + '"><span class="n">' + esc(d.label) +
              '</span><span class="w' + (expandable ? ' expandable' : '') + '"' +
              (expandable ? ' data-other="' + esc(d.id) + '" data-dir="' + esc(dir) + '" title="Click to see the specific files"' : '') +
              '>' + d.weight + '</span></div>' +
              (expandable ? '<div class="dep-files" hidden></div>' : '') +
              '</div>';
          }).join('') + '</div>';
        }
        document.querySelector('.p-close').addEventListener('click', function () { panel.classList.remove('open'); });

        // ---- editor links --------------------------------------
        function editorHref(n) {
          if (!n || !n.path || !GRAPH.repo || !GRAPH.repo.root) return null;
          var abs = GRAPH.repo.root.replace(/\/$/, '') + '/' + n.path;
          var ed = (GRAPH.config && GRAPH.config.editor) || 'vscode';
          if (ed === 'cursor') return 'cursor://file/' + abs;
          if (ed === 'webstorm' || ed === 'idea') return 'jetbrains://open?file=' + encodeURIComponent(abs);
          if (ed === 'zed') return 'zed://file/' + abs;
          return 'vscode://file/' + abs;
        }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }
        function debounce(fn, ms) { var t; return function () { var a = arguments, x = this; clearTimeout(t); t = setTimeout(function () { fn.apply(x, a); }, ms); }; }

        // ---- toolbar ------------------------------------------
        var mainEl = document.querySelector('main');
        function setNav(open) {
          mainEl.classList.toggle('nav-collapsed', !open);
          save('nav', open ? 'open' : 'closed');
          // On narrow screens the drawer floats over the canvas, so its size
          // never changes - only refit/resize when it actually reflows.
          if (!isNarrow()) {
            setTimeout(function () { cy.resize(); resizeSketch(); cy.fit(cy.elements(), fitPad()); }, 200);
          }
        }
        document.getElementById('navToggle').addEventListener('click', function () {
          setNav(mainEl.classList.contains('nav-collapsed'));
        });
        document.getElementById('scrim').addEventListener('click', function () { setNav(false); });
        document.getElementById('fit').addEventListener('click', function () {
          cy.animate({ fit: { eles: cy.elements(), padding: fitPad() }, duration: 220 });
        });
        document.getElementById('theme').addEventListener('click', function () {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          if (light) { document.documentElement.removeAttribute('data-theme'); save('theme', 'dark'); }
          else { document.documentElement.setAttribute('data-theme', 'light'); save('theme', 'light'); }
          cy.style().resetToDefault().fromJson(styleArr()).update();
          renderTree(); buildLegend(); scheduleSketch();
          if (focusId) { drawCrumb(focusId); }
        });

        var q = document.getElementById('q');
        q.addEventListener('input', debounce(runSearch, 140));
        q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; runSearch(); q.blur(); } });
        function runSearch() {
          var term = q.value.trim().toLowerCase();
          if (!term) { filterSet = null; renderTree(); return; }
          filterSet = new Set();
          var hits = 0;
          GRAPH.nodes.forEach(function (n) {
            if ((n.label && n.label.toLowerCase().indexOf(term) >= 0) ||
                (n.path && n.path.toLowerCase().indexOf(term) >= 0)) {
              hits++;
              filterSet.add(n.id); filterSet.add('hit:' + n.id);
              ancestry(n.id).forEach(function (a) { filterSet.add(a); openTree[a] = 1; });
              (childrenOf[n.id] || []).forEach(function (c) { filterSet.add(c); });
            }
          });
          renderTree();
          hint(hits ? hits + ' match' + (hits > 1 ? 'es' : '') : 'No matches');
        }

        // ---- legend + subtitle -------------------------------
        function buildLegend() {
          var L = [['feature', 'module'], ['shared', 'shared'], ['folder', 'folder'], ['file', 'file']];
          document.getElementById('legend').innerHTML =
            '<span class="legend-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Legend</span>' +
            '<span class="legend-items">' +
            L.map(function (x) { return '<i style="--k:' + cssVal('--c-' + x[0]) + '">' + x[1] + '</i>'; }).join('') +
            '<i class="arrow" style="--k:' + cssVal('--edge-out') + '">depends on</i>' +
            '<i class="arrow" style="--k:' + cssVal('--edge-in') + '">used by</i>' +
            '</span>';
        }
        (function () {
          var s = GRAPH.stats || {};
          document.getElementById('repoName').textContent = (GRAPH.repo && GRAPH.repo.name) || 'repo';
          document.title = ((GRAPH.repo && GRAPH.repo.name) || 'repo') + ' - birdsEye';
          document.getElementById('sub').textContent =
            (s.modules || 0) + ' modules · ' + (s.files || 0) + ' files · ' +
            (s.languages || []).slice(0, 6).join(', ');
          buildLegend();
        })();

        var hintEl = document.getElementById('hint'), hintT;
        function hint(msg) {
          hintEl.textContent = msg; hintEl.classList.add('show');
          clearTimeout(hintT); hintT = setTimeout(function () { hintEl.classList.remove('show'); }, 1600);
        }

        renderTree();
        focus(ROOT_ID);
        hint('Pick anything on the left to see how it connects');
        // A flowchart that doesn't re-centre when its window changes size
        // reads as broken - refit on every resize / orientation change once
        // things settle.
        window.addEventListener('resize', debounce(function () {
          cy.resize(); resizeSketch();
          cy.fit(cy.elements(), fitPad());
          scheduleSketch();
        }, 160));
        // The hand-lettered font is a data: URI so it's available near-
        // instantly, but canvas text painted before the browser finishes
        // parsing it silently falls back to a generic font for that one
        // paint - it won't repaint itself later. Force one more style
        // pass once the font is confirmed ready so that never sticks.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { cy.style().update(); scheduleSketch(); });
        }
      })();
    </script>
  </body>
</html>
