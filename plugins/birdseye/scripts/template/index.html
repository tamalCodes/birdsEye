    <style>
      :root {
        color-scheme: dark;

        /* Warm charcoal + clay: this is a structure map for an AI tool, not a
           dashboard, so surfaces run warm and the node hues are warm-shifted as
           far as they go while still reading as separate things. */
        --c-root: #e8d9c4;
        --c-zone: #b7a488;
        --c-feature: #d97757;
        --c-shared: #c68f66;
        --c-folder: #c9a56b;
        --c-file: #a9b764;

        --bg: #171512;
        --bg-panel: #201d19;
        --bg-raised: #2a2621;
        --glass: rgba(32, 29, 25, .66);
        --glass-line: rgba(255, 246, 232, .09);
        --glass-shadow: 0 10px 30px rgba(12, 9, 5, .45);
        --line: #38332c;
        --line-soft: #2c2822;
        --line-strong: #6b6355;
        --dot: #221f1a;
        --hl: #faf9f5;
        --text: #dedacf;
        --text-dim: #918a7c;
        --accent: #d97757;
        --edge: #6b6355;
        --edge-out: #d97757;
        --edge-in: #a9b764;
        --header-h: 56px;

        --font: "Outfit", "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Arial, sans-serif;
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }

      [data-theme="light"] {
        color-scheme: light;
        --c-root: #4a3f30;
        --c-zone: #8a7860;
        --c-feature: #bf5b36;
        --c-shared: #a86b45;
        --c-folder: #9a6a12;
        --c-file: #5e7524;

        --bg: #faf9f5;
        --bg-panel: #f2f0e8;
        --bg-raised: #e9e6db;
        --glass: rgba(250, 249, 245, .72);
        --glass-line: rgba(60, 48, 32, .12);
        --glass-shadow: 0 10px 30px rgba(70, 55, 35, .12);
        --line: #e0dcd0;
        --line-soft: #ebe8de;
        --line-strong: #beb8a8;
        --dot: #efede4;
        --hl: #171512;
        --text: #211e19;
        --text-dim: #706a5e;
        --accent: #bf5b36;
        --edge: #b0a892;
        --edge-out: #bf5b36;
        --edge-in: #5e7524;
      }

      @font-face {
        font-family: "Outfit";
        src: url(__FONT_OUTFIT__) format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 var(--font);
        overflow: hidden;
      }

      header {
        position: fixed; inset: 0 0 auto 0; z-index: 40;
        display: flex; align-items: center; gap: 10px;
        height: var(--header-h); padding: 0 12px;
        background: var(--glass);
        -webkit-backdrop-filter: blur(20px) saturate(180%);
        backdrop-filter: blur(20px) saturate(180%);
        border-bottom: 1px solid var(--glass-line);
        box-shadow: var(--glass-shadow);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; }
      .brand svg { width: 20px; height: 20px; flex: none; }
      .brand b { font-weight: 600; }
      .brand span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
      .spacer { flex: 1; }

      .search {
        position: relative; display: flex; align-items: center;
      }
      .search input {
        width: 210px; height: 32px; padding: 0 10px 0 30px;
        background: var(--bg-panel); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; outline: none;
      }
      .search input:focus { border-color: var(--accent); }
      .search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--text-dim); pointer-events: none; }

      button.tool {
        height: 32px; padding: 0 11px;
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--bg-panel); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; cursor: pointer; white-space: nowrap;
      }
      button.tool:hover { border-color: var(--line-strong); }
      button.tool svg { width: 14px; height: 14px; }
      .icon-only { width: 32px; padding: 0; justify-content: center; }
      [data-theme="light"] .ico-moon, :root:not([data-theme="light"]) .ico-sun { display: none; }

      main { position: absolute; inset: var(--header-h) 0 0 0; }
      #cy { position: absolute; inset: 0; }
      #cy::before {
        content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 26px 26px;
      }

      /* legend */
      .legend {
        position: absolute; left: 12px; bottom: 12px; z-index: 20;
        display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: 340px;
        padding: 9px 11px;
        background: var(--glass); border: 1px solid var(--glass-line);
        border-radius: 10px; box-shadow: var(--glass-shadow);
        -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
        font-size: 11.5px; color: var(--text-dim);
      }
      .legend i { display: inline-flex; align-items: center; gap: 5px; }
      .legend i::before {
        content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--k, var(--text-dim));
      }
      .legend .arrow { gap: 6px; }
      .legend .arrow::before { width: 14px; height: 2px; border-radius: 0; }

      /* detail panel */
      #panel {
        position: absolute; top: 12px; right: 12px; bottom: 12px; z-index: 30;
        width: 330px; max-width: calc(100vw - 24px);
        display: none; flex-direction: column;
        background: var(--glass); border: 1px solid var(--glass-line);
        border-radius: 14px; box-shadow: var(--glass-shadow);
        -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
        overflow: hidden;
      }
      #panel.open { display: flex; }
      .p-head { padding: 14px 16px 12px; border-bottom: 1px solid var(--glass-line); }
      .p-kind { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
      .p-title { font-size: 16px; font-weight: 600; margin: 3px 0 0; word-break: break-word; }
      .p-path { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); margin-top: 4px; word-break: break-all; }
      .p-body { padding: 12px 16px 16px; overflow-y: auto; }
      .p-close {
        position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
        border: none; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 17px; line-height: 1;
      }
      .p-close:hover { color: var(--text); }
      .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 2px 0 14px; }
      .stat { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: 9px; padding: 8px 10px; }
      .stat b { display: block; font-size: 17px; font-weight: 600; }
      .stat span { font-size: 11px; color: var(--text-dim); }
      .p-sec { margin-top: 14px; }
      .p-sec h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin: 0 0 6px; }
      .dep { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 4px 0; cursor: pointer; border-bottom: 1px solid var(--line-soft); }
      .dep:hover { color: var(--accent); }
      .dep .n { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dep .w { font-size: 11px; color: var(--text-dim); flex: none; }
      .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--bg-raised); color: var(--text-dim); margin: 0 4px 4px 0; }
      .btn-open {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
        height: 30px; padding: 0 12px; border-radius: 8px;
        background: var(--accent); color: #fff; border: none; font: inherit; cursor: pointer; text-decoration: none;
      }
      [data-theme="light"] .btn-open { color: #fff; }

      .hint {
        position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 15;
        padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--text-dim);
        background: var(--glass); border: 1px solid var(--glass-line);
        -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
        pointer-events: none; opacity: 0; transition: opacity .3s;
      }
      .hint.show { opacity: 1; }
    </style>
  </head>
  <body>
    <header>
      <span class="brand">
        <svg viewBox="16 19 208 208" aria-hidden="true"><path transform="translate(0 8)" d="M120 52C129 54 133 66 134 82C150 92 186 116 210 146C213 150 211 154 206 153C176 150 150 140 133 128C132 145 128 164 120 178C112 164 108 145 107 128C90 140 64 150 34 153C29 154 27 150 30 146C54 116 90 92 106 82C107 66 111 54 120 52Z" fill="var(--accent)"/></svg>
        <b id="repoName"></b><span id="sub"></span>
      </span>
      <span class="spacer"></span>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Find a module or file" autocomplete="off" spellcheck="false" />
      </label>
      <button class="tool" id="expandAll" title="Expand everything">Expand all</button>
      <button class="tool" id="collapseAll" title="Collapse to modules">Collapse</button>
      <button class="tool icon-only" id="fit" title="Fit to screen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
      <button class="tool icon-only" id="theme" title="Toggle theme">

        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>

    <main>
      <div id="cy"></div>
      <div class="hint" id="hint"></div>
      <div class="legend" id="legend"></div>
      <aside id="panel">
        <button class="p-close" title="Close">&times;</button>
        <div class="p-head">
          <div class="p-kind" id="pKind"></div>
          <div class="p-title" id="pTitle"></div>
          <div class="p-path" id="pPath"></div>
        </div>
        <div class="p-body" id="pBody"></div>
      </aside>
    </main>

    <script>__VENDOR__</script>
    <script id="graph-data" type="application/json">__GRAPH__</script>
    <script>
      (function () {
        'use strict';
        var GRAPH = JSON.parse(document.getElementById('graph-data').textContent);
        var STORE = '__STORAGE_KEY__';
        var save = function (k, v) { try { localStorage.setItem(STORE + ':' + k, v); } catch (e) {} };
        var load = function (k) { try { return localStorage.getItem(STORE + ':' + k); } catch (e) { return null; } };

        (function initTheme() {
          if (load('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
          else if (load('theme') === 'dark') document.documentElement.removeAttribute('data-theme');
        })();

        if (typeof cytoscapeFcose !== 'undefined') cytoscape.use(cytoscapeFcose);

        // ---- indexes -------------------------------------------------
        var nodeById = {};
        GRAPH.nodes.forEach(function (n) { nodeById[n.id] = n; });
        var parentOf = {}, childrenOf = {};
        GRAPH.nodes.forEach(function (n) { childrenOf[n.id] = []; });
        GRAPH.edges.forEach(function (e) {
          if (e.type !== 'contains') return;
          parentOf[e.to] = e.from;
          (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to);
        });
        var depEdges = GRAPH.edges.filter(function (e) { return e.type === 'depends'; });
        var ROOT = GRAPH.nodes.find(function (n) { return n.type === 'root'; });
        var ROOT_ID = ROOT ? ROOT.id : GRAPH.nodes[0].id;

        var TYPE_COLOR = {
          root: '--c-root', zone: '--c-zone', folder: '--c-folder', file: '--c-file',
        };
        function colorVar(n) {
          if (n.type === 'module') return n.meta && n.meta.kind === 'shared' ? '--c-shared' : '--c-feature';
          return TYPE_COLOR[n.type] || '--c-file';
        }
        function cssVal(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

        function hasKids(id) { return (childrenOf[id] || []).length > 0; }
        function isAncestor(a, b) { for (var c = parentOf[b]; c; c = parentOf[c]) if (c === a) return true; return false; }

        // ---- expansion state ---------------------------------------
        var expanded = {};
        (function initExpanded() {
          var saved = load('expanded');
          if (saved) { try { JSON.parse(saved).forEach(function (id) { if (nodeById[id]) expanded[id] = 1; }); } catch (e) {} }
          expanded[ROOT_ID] = 1;
          // On a first visit, open every top-level module so the whole spine is
          // visible at a glance; deeper folders stay closed.
          if (!saved) {
            (childrenOf[ROOT_ID] || []).forEach(function (id) {
              if (nodeById[id].type === 'zone') { expanded[id] = 1; (childrenOf[id] || []).forEach(function (m) { expanded[m] = 0; }); }
            });
          }
        })();
        function persistExpanded() {
          save('expanded', JSON.stringify(Object.keys(expanded).filter(function (id) { return expanded[id]; })));
        }

        function visible(id) {
          for (var c = parentOf[id]; c; c = parentOf[c]) if (!expanded[c]) return false;
          return true;
        }
        // deepest visible node that is `id` or one of its ancestors
        function rep(id) {
          var chain = [], c = id;
          while (c) { chain.push(c); c = parentOf[c]; }
          for (var i = 0; i < chain.length; i++) if (visible(chain[i])) return chain[i];
          return ROOT_ID;
        }

        // ---- build cytoscape elements from current state -----------
        function elements() {
          var els = [];
          var shown = {};
          GRAPH.nodes.forEach(function (n) {
            if (!visible(n.id)) return;
            shown[n.id] = 1;
            var open = !!expanded[n.id] && hasKids(n.id);
            var kidCount = (childrenOf[n.id] || []).length;
            var m = n.meta || {};
            els.push({
              data: {
                id: n.id, type: n.type, label: n.label,
                open: open, closed: hasKids(n.id) && !open, kids: kidCount,
                df: m.descendantFiles || 0,
                parent: (parentOf[n.id] && expanded[parentOf[n.id]] && visible(parentOf[n.id])) ? parentOf[n.id] : undefined,
                col: cssVal(colorVar(n)),
                w: sizeFor(n),
              },
            });
          });
          // roll dependency edges up to the visible level
          var agg = {};
          depEdges.forEach(function (e) {
            var a = rep(e.from), b = rep(e.to);
            if (a === b || !shown[a] || !shown[b]) return;
            if (isAncestor(a, b) || isAncestor(b, a)) return;
            var k = a + '␀' + b;
            agg[k] = (agg[k] || 0) + (e.weight || 1);
          });
          Object.keys(agg).forEach(function (k) {
            var p = k.split('␀');
            els.push({ data: { id: 'd␀' + k, source: p[0], target: p[1], weight: agg[k], ew: edgeW(agg[k]) } });
          });
          return els;
        }
        function sizeFor(n) {
          if (n.type === 'file') return Math.max(26, Math.min(64, 26 + (n.meta.symbolCount || 0) * 2));
          var df = (n.meta && n.meta.descendantFiles) || 1;
          return Math.max(48, Math.min(120, 40 + Math.sqrt(df) * 12));
        }
        function edgeW(w) { return Math.max(1, Math.min(8, 1 + Math.log2(w + 1))); }

        // ---- cytoscape --------------------------------------------
        function styleArr() {
          return [
            {
              selector: 'node', style: {
                'background-color': 'data(col)',
                'background-opacity': 0.9,
                label: 'data(label)',
                color: cssVal('--text'),
                'font-size': 12, 'font-family': cssVal('--font'),
                'text-valign': 'center', 'text-halign': 'center',
                width: 'data(w)', height: 'data(w)',
                'border-width': 0,
                'text-wrap': 'ellipsis', 'text-max-width': 90,
                'transition-property': 'background-opacity, border-width', 'transition-duration': '120ms',
              },
            },
            { selector: 'node[type="file"]', style: { shape: 'ellipse' } },
            { selector: 'node[type="folder"]', style: { shape: 'round-rectangle' } },
            { selector: 'node[type="module"]', style: { shape: 'round-rectangle', 'font-size': 13, 'font-weight': 600 } },
            { selector: 'node[type="zone"]', style: { shape: 'round-rectangle', 'font-size': 12 } },
            { selector: 'node[type="root"]', style: { shape: 'round-rectangle', 'font-weight': 700 } },
            {
              selector: 'node:parent', style: {
                'background-opacity': 0.10, 'background-color': 'data(col)',
                'border-width': 1.5, 'border-color': 'data(col)', 'border-opacity': 0.5,
                'text-valign': 'top', 'text-halign': 'center',
                'text-margin-y': -4, 'font-weight': 600,
                padding: 18, shape: 'round-rectangle',
                color: cssVal('--text-dim'),
              },
            },
            {
              selector: 'node[?closed]', style: {
                'border-width': 2, 'border-color': 'data(col)', 'border-opacity': 0.55, 'border-style': 'double',
              },
            },
            {
              selector: 'edge', style: {
                'curve-style': 'bezier',
                width: 'data(ew)',
                'line-color': cssVal('--edge'), 'line-opacity': 0.45,
                'target-arrow-color': cssVal('--edge'), 'target-arrow-shape': 'triangle', 'arrow-scale': 0.9,
                'transition-property': 'line-opacity, line-color', 'transition-duration': '120ms',
              },
            },
            { selector: 'edge.out', style: { 'line-color': cssVal('--edge-out'), 'target-arrow-color': cssVal('--edge-out'), 'line-opacity': 0.95, 'z-index': 20 } },
            { selector: 'edge.in', style: { 'line-color': cssVal('--edge-in'), 'target-arrow-color': cssVal('--edge-in'), 'line-opacity': 0.95, 'z-index': 20 } },
            { selector: 'edge.dim', style: { 'line-opacity': 0.06 } },
            { selector: 'node.dim', style: { 'background-opacity': 0.18, 'text-opacity': 0.25 } },
            { selector: 'node.sel', style: { 'border-width': 3, 'border-color': cssVal('--hl'), 'border-opacity': 1 } },
            { selector: 'node.match', style: { 'border-width': 3, 'border-color': cssVal('--accent'), 'border-opacity': 1 } },
          ];
        }
        var cy = cytoscape({
          container: document.getElementById('cy'),
          elements: elements(),
          minZoom: 0.08, maxZoom: 2.5,
          wheelSensitivity: 0.25,
          style: styleArr(),
          layout: layoutOpts(),
        });

        function layoutOpts() {
          return {
            name: 'fcose', quality: 'default', animate: true, animationDuration: 320,
            randomize: false, packComponents: true, nodeSeparation: 90,
            idealEdgeLength: function (e) { return 90 + (e.data('weight') || 1) * 2; },
            nodeRepulsion: function () { return 9000; },
            gravity: 0.25, gravityRange: 3.0,
            padding: 40, tile: true,
          };
        }
        function relayout() {
          cy.layout(layoutOpts()).run();
        }

        function refresh(fit) {
          var sel = cy.$('node.sel').map(function (n) { return n.id(); });
          cy.elements().remove();
          cy.add(elements());
          sel.forEach(function (id) { var n = cy.getElementById(id); if (n.nonempty()) n.addClass('sel'); });
          relayout();
          if (fit) cy.once('layoutstop', function () { cy.animate({ fit: { padding: 50 }, duration: 250 }); });
        }

        // ---- interaction -----------------------------------------
        var hintEl = document.getElementById('hint'), hintT;
        function hint(msg) {
          hintEl.textContent = msg; hintEl.classList.add('show');
          clearTimeout(hintT); hintT = setTimeout(function () { hintEl.classList.remove('show'); }, 1800);
        }

        cy.on('tap', 'node', function (ev) {
          var id = ev.target.id(), n = nodeById[id];
          if (hasKids(id)) {
            expanded[id] = expanded[id] ? 0 : 1;
            if (!expanded[id]) collapseDesc(id);
            persistExpanded();
            select(id);
            refresh(false);
          } else {
            select(id);
          }
        });
        cy.on('dbltap', 'node[type="file"]', function (ev) {
          var href = editorHref(nodeById[ev.target.id()]);
          if (href) window.location.href = href;
        });
        cy.on('tap', function (ev) { if (ev.target === cy) deselect(); });

        function collapseDesc(id) {
          (childrenOf[id] || []).forEach(function (c) { if (expanded[c]) { expanded[c] = 0; collapseDesc(c); } });
        }

        var panel = document.getElementById('panel');
        function deselect() {
          cy.$('.sel').removeClass('sel'); cy.$('.dim').removeClass('dim');
          cy.$('.out').removeClass('out'); cy.$('.in').removeClass('in');
          panel.classList.remove('open');
        }
        function select(id) {
          cy.$('.sel').removeClass('sel'); cy.$('.dim').removeClass('dim');
          cy.$('.out').removeClass('out'); cy.$('.in').removeClass('in');
          var node = cy.getElementById(id);
          if (node.nonempty()) {
            node.addClass('sel');
            var conn = node.connectedEdges();
            cy.edges().addClass('dim'); cy.nodes().addClass('dim');
            node.removeClass('dim');
            conn.forEach(function (e) {
              e.removeClass('dim');
              if (e.source().id() === id) { e.addClass('out'); e.target().removeClass('dim'); }
              else { e.addClass('in'); e.source().removeClass('dim'); }
            });
          }
          showPanel(id);
        }

        // ---- detail panel ---------------------------------------
        var KIND_LABEL = { root: 'Code root', zone: 'Group', module: 'Module', folder: 'Folder', file: 'File' };
        function showPanel(id) {
          var n = nodeById[id], m = n.meta || {};
          document.getElementById('pKind').textContent =
            (n.type === 'module' && m.kind === 'shared') ? 'General-purpose module' :
            (n.type === 'module' && m.ambiguous) ? 'Module (best guess)' : (KIND_LABEL[n.type] || n.type);
          document.getElementById('pTitle').textContent = n.label;
          document.getElementById('pPath').textContent = n.path || '';
          var b = document.getElementById('pBody');
          var h = '';

          var stats = [];
          if (n.type === 'file') {
            if (m.symbolCount != null) stats.push([m.symbolCount, 'functions / classes']);
            if (m.loc) stats.push([m.loc, 'lines']);
            if (m.lang) stats.push([m.lang, 'language']);
          } else {
            stats.push([m.descendantFiles || 0, 'code files']);
            if (m.fileCount != null) stats.push([m.fileCount, 'files total']);
            if (m.codeFileCount != null) stats.push([m.codeFileCount, 'direct code files']);
            if (m.symbolCount) stats.push([m.symbolCount, 'symbols']);
          }
          if (stats.length) {
            h += '<div class="stats">' + stats.map(function (s) {
              return '<div class="stat"><b>' + esc(String(s[0])) + '</b><span>' + esc(s[1]) + '</span></div>';
            }).join('') + '</div>';
          }

          if (m.entry) h += '<span class="tag">entry point</span>';
          if (n.type === 'module' && m.sharedKind) h += '<span class="tag">' + esc(m.sharedKind) + '</span>';
          if (n.type === 'module' && m.ambiguous) h += '<div style="font-size:12px;color:var(--text-dim);margin:6px 0">No screens or clear infrastructure name - birdsEye guessed this is a feature. Correct it in <code>structure.json</code> if wrong.</div>';

          var out = rollDeps(id, 'out'), inc = rollDeps(id, 'in');
          if (out.length) h += depSection('Depends on', out);
          if (inc.length) h += depSection('Used by', inc);
          if (!out.length && !inc.length) h += '<div class="p-sec" style="color:var(--text-dim);font-size:12px">No tracked dependencies at this level.</div>';

          if (n.type === 'file') {
            var href = editorHref(n);
            if (href) h += '<a class="btn-open" href="' + esc(href) + '">Open in editor</a>';
          } else if (hasKids(id)) {
            h += '<button class="btn-open" id="pToggle">' + (expanded[id] ? 'Collapse' : 'Expand') + ' ' + esc(n.label) + '</button>';
          }
          b.innerHTML = h;
          b.querySelectorAll('.dep').forEach(function (el) {
            el.addEventListener('click', function () {
              var t = el.getAttribute('data-id');
              if (t && nodeById[t]) { revealTo(t); select(t); }
            });
          });
          var pToggleBtn = document.getElementById('pToggle');
          if (pToggleBtn) pToggleBtn.addEventListener('click', function () {
            expanded[id] = expanded[id] ? 0 : 1; if (!expanded[id]) collapseDesc(id);
            persistExpanded(); refresh(false); showPanel(id);
          });
          panel.classList.add('open');
        }
        function depSection(title, list) {
          return '<div class="p-sec"><h4>' + esc(title) + '</h4>' + list.map(function (d) {
            return '<div class="dep" data-id="' + esc(d.id) + '"><span class="n">' + esc(d.label) +
              '</span><span class="w">' + d.weight + '</span></div>';
          }).join('') + '</div>';
        }
        // Every file-level dependency that crosses the boundary of `id`, grouped
        // by the module the other end lives in (so a module panel lists modules,
        // a file panel still lists the files it actually imports).
        function rollDeps(id, dir) {
          var self = nodeById[id];
          var groupByModule = self.type !== 'file';
          var agg = {};
          depEdges.forEach(function (e) {
            var inside = (dir === 'out') ? e.from : e.to;
            var other = (dir === 'out') ? e.to : e.from;
            var insideScope = inside === id || isAncestor(id, inside);
            if (!insideScope) return;
            if (other === id || isAncestor(id, other)) return;
            var key = other;
            if (groupByModule) {
              var mod = nodeById[other] && nodeById[other].module;
              key = mod ? 'module:' + mod : other;
            }
            agg[key] = (agg[key] || 0) + (e.weight || 1);
          });
          return Object.keys(agg).map(function (k) {
            var n = nodeById[k];
            return { id: k, label: n ? (n.type === 'file' ? n.path : n.label) : k, weight: agg[k] };
          }).sort(function (a, b) { return b.weight - a.weight; }).slice(0, 40);
        }
        function revealTo(id) {
          for (var c = parentOf[id]; c; c = parentOf[c]) expanded[c] = 1;
          persistExpanded(); refresh(false);
        }

        document.querySelector('.p-close').addEventListener('click', deselect);

        // ---- editor links --------------------------------------
        function editorHref(n) {
          if (!n || !n.path || !GRAPH.repo || !GRAPH.repo.root) return null;
          var abs = GRAPH.repo.root.replace(/\/$/, '') + '/' + n.path;
          var ed = (GRAPH.config && GRAPH.config.editor) || 'vscode';
          if (ed === 'cursor') return 'cursor://file/' + abs;
          if (ed === 'webstorm' || ed === 'idea') return 'jetbrains://open?file=' + encodeURIComponent(abs);
          if (ed === 'zed') return 'zed://file/' + abs;
          return 'vscode://file/' + abs;
        }
        function esc(s) {
          return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
          });
        }

        // ---- toolbar ------------------------------------------
        document.getElementById('expandAll').addEventListener('click', function () {
          GRAPH.nodes.forEach(function (n) { if (hasKids(n.id)) expanded[n.id] = 1; });
          persistExpanded(); refresh(true); hint('Everything expanded');
        });
        document.getElementById('collapseAll').addEventListener('click', function () {
          expanded = {}; expanded[ROOT_ID] = 1;
          (childrenOf[ROOT_ID] || []).forEach(function (id) { if (nodeById[id].type === 'zone') expanded[id] = 1; });
          persistExpanded(); deselect(); refresh(true); hint('Collapsed to modules');
        });
        document.getElementById('fit').addEventListener('click', function () { cy.animate({ fit: { padding: 50 }, duration: 250 }); });
        document.getElementById('theme').addEventListener('click', function () {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          if (light) { document.documentElement.removeAttribute('data-theme'); save('theme', 'dark'); }
          else { document.documentElement.setAttribute('data-theme', 'light'); save('theme', 'light'); }
          cy.style().resetToDefault().fromJson(styleArr()).update();
          refresh(false);
        });

        var q = document.getElementById('q'), qTimer;
        q.addEventListener('input', function () {
          clearTimeout(qTimer); qTimer = setTimeout(runSearch, 160);
        });
        function runSearch() {
          var term = q.value.trim().toLowerCase();
          cy.$('.match').removeClass('match');
          if (!term) { cy.$('.dim').removeClass('dim'); return; }
          var hits = GRAPH.nodes.filter(function (n) {
            return (n.label && n.label.toLowerCase().indexOf(term) >= 0) ||
                   (n.path && n.path.toLowerCase().indexOf(term) >= 0);
          });
          hits.slice(0, 60).forEach(function (n) {
            for (var c = parentOf[n.id]; c; c = parentOf[c]) expanded[c] = 1;
          });
          persistExpanded(); refresh(false);
          var ids = {};
          hits.forEach(function (n) { ids[n.id] = 1; });
          cy.nodes().forEach(function (el) {
            if (ids[el.id()]) el.addClass('match');
          });
          if (hits.length) {
            var first = cy.getElementById(hits[0].id);
            if (first.nonempty()) cy.animate({ center: { eles: first }, zoom: Math.min(1.2, cy.zoom()) , duration: 250 });
            hint(hits.length + ' match' + (hits.length > 1 ? 'es' : ''));
          } else hint('No matches');
        }
        q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; runSearch(); q.blur(); } });

        // ---- legend + subtitle -------------------------------
        (function () {
          var s = GRAPH.stats || {};
          document.getElementById('repoName').textContent = (GRAPH.repo && GRAPH.repo.name) || 'repo';
          document.title = ((GRAPH.repo && GRAPH.repo.name) || 'repo') + ' - birdsEye';
          document.getElementById('sub').textContent =
            (s.modules || 0) + ' modules · ' + (s.files || 0) + ' files · ' +
            (s.languages || []).slice(0, 6).join(', ');
          var L = [
            ['feature', 'module'], ['shared', 'shared'], ['folder', 'folder'], ['file', 'file'],
          ];
          document.getElementById('legend').innerHTML =
            L.map(function (x) { return '<i style="--k:' + cssVal('--c-' + x[0]) + '">' + x[1] + '</i>'; }).join('') +
            '<i class="arrow" style="--k:' + cssVal('--edge-out') + '">depends on</i>' +
            '<i class="arrow" style="--k:' + cssVal('--edge-in') + '">used by</i>';
        })();

        cy.ready(function () {
          cy.once('layoutstop', function () { cy.fit(undefined, 60); });
          hint('Click a module to expand it');
        });
        window.addEventListener('resize', function () { cy.resize(); });
      })();
    </script>
  </body>
</html>
