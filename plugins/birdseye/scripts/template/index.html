    <style>
      :root {
        color-scheme: dark;

        /* Warm charcoal + clay: this is a structure map for an AI tool, not a
           dashboard, so surfaces run warm and the node hues are warm-shifted as
           far as they go while still reading as separate things. */
        --c-root: #e8d9c4;
        --c-zone: #b7a488;
        --c-feature: #d97757;
        --c-shared: #c68f66;
        --c-folder: #c9a56b;
        --c-file: #a9b764;

        --bg: #171512;
        --bg-panel: #201d19;
        --bg-raised: #2a2621;
        --sheet: #1c1a16;
        --line: #38332c;
        --line-soft: #2c2822;
        --line-strong: #6b6355;
        --dot: #221f1a;
        --hl: #faf9f5;
        --text: #dedacf;
        --text-dim: #918a7c;
        --accent: #d97757;
        --edge: #6b6355;
        --edge-out: #d97757;
        --edge-in: #a9b764;
        --row-hover: rgba(255, 246, 232, .05);
        --row-sel: rgba(217, 119, 87, .16);
        --shadow: 0 12px 34px rgba(10, 7, 3, .5);
        --header-h: 56px;
        --sidebar-w: 300px;

        --font: "Outfit", "Anthropic Sans", ui-sans-serif, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, Arial, sans-serif;
        --font-hand: "Patrick Hand", "Comic Sans MS", var(--font);
        --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
      }

      [data-theme="light"] {
        color-scheme: light;
        --c-root: #4a3f30;
        --c-zone: #8a7860;
        --c-feature: #bf5b36;
        --c-shared: #a86b45;
        --c-folder: #9a6a12;
        --c-file: #5e7524;

        --bg: #faf9f5;
        --bg-panel: #f2f0e8;
        --bg-raised: #e9e6db;
        --sheet: #fffdf8;
        --line: #e0dcd0;
        --line-soft: #ebe8de;
        --line-strong: #beb8a8;
        --dot: #e7e4d9;
        --hl: #171512;
        --text: #211e19;
        --text-dim: #706a5e;
        --accent: #bf5b36;
        --edge: #b0a892;
        --edge-out: #bf5b36;
        --edge-in: #5e7524;
        --row-hover: rgba(60, 48, 32, .05);
        --row-sel: rgba(191, 91, 54, .12);
        --shadow: 0 12px 34px rgba(70, 55, 35, .14);
      }

      @font-face {
        font-family: "Outfit";
        src: url("__FONT_OUTFIT__") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
      /* Diagram labels use a hand-lettered face while surrounding UI chrome
         stays in Outfit for dense prose. */
      @font-face {
        font-family: "Patrick Hand";
        src: url("__FONT_HAND__") format("woff2");
        font-weight: 400;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--text);
        font: 14px/1.55 var(--font);
        overflow: hidden;
      }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; border: 2px solid var(--bg); }
      ::-webkit-scrollbar-thumb:hover { background: var(--line-strong); }

      header {
        position: absolute; inset: 0 0 auto 0; z-index: 40;
        display: flex; align-items: center; gap: 10px; flex-wrap: nowrap;
        height: var(--header-h); padding: 0 12px;
        background: var(--bg-panel);
        border-bottom: 1px solid var(--line);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; white-space: nowrap; min-width: 0; }
      .brand svg { width: 20px; height: 20px; flex: none; }
      .brand b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
      .brand span { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; overflow: hidden; text-overflow: ellipsis; }
      .spacer { flex: 1; }

      .search { position: relative; display: flex; align-items: center; min-width: 0; }
      .search input {
        width: 230px; height: 32px; padding: 0 10px 0 30px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; outline: none;
      }
      .search input:focus { border-color: var(--accent); }
      .search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--text-dim); pointer-events: none; }

      button.tool {
        height: 32px; padding: 0 11px;
        display: inline-flex; align-items: center; gap: 6px;
        background: var(--bg); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        font: inherit; cursor: pointer; white-space: nowrap;
      }
      button.tool:hover { border-color: var(--line-strong); }
      button.tool svg { width: 14px; height: 14px; }
      .icon-only { width: 32px; padding: 0; justify-content: center; }
      [data-theme="light"] .ico-moon, :root:not([data-theme="light"]) .ico-sun { display: none; }

      main { position: absolute; inset: var(--header-h) 0 0 0; display: flex; }

      /* ---- sidebar tree ---------------------------------------------- */
      #sidebar {
        width: var(--sidebar-w); flex: none;
        display: flex; flex-direction: column;
        background: var(--bg-panel); border-right: 1px solid var(--line);
        overflow: hidden; transition: width .18s ease, opacity .15s ease;
      }
      main.nav-collapsed #sidebar {
        width: 0; opacity: 0; border-right-color: transparent; pointer-events: none;
      }
      /* Only ever a thing on narrow screens (see the media block); off the
         layout entirely otherwise. */
      #scrim { display: none; }
      .side-head {
        display: flex; align-items: center; gap: 6px;
        padding: 8px 10px; border-bottom: 1px solid var(--line-soft);
        font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim);
      }
      .side-head .spacer { flex: 1; }
      .mini {
        height: 24px; padding: 0 8px; border-radius: 6px;
        background: transparent; color: var(--text-dim);
        border: 1px solid var(--line); font: inherit; font-size: 11px; cursor: pointer;
      }
      .mini:hover { color: var(--text); border-color: var(--line-strong); }
      #tree { flex: 1; overflow: auto; padding: 6px 0 40px; }

      .row {
        display: flex; align-items: center; gap: 6px;
        height: 26px; padding-right: 10px;
        cursor: pointer; user-select: none; white-space: nowrap;
        border-left: 2px solid transparent;
      }
      .row:hover { background: var(--row-hover); }
      .row.sel { background: var(--row-sel); border-left-color: var(--accent); }
      .row .tw {
        width: 14px; height: 14px; flex: none;
        display: flex; align-items: center; justify-content: center;
        color: var(--text-dim);
      }
      .row .tw svg { width: 9px; height: 9px; transition: transform .12s; }
      .row.open .tw svg { transform: rotate(90deg); }
      .row .dot { width: 8px; height: 8px; border-radius: 2px; flex: none; background: var(--k, var(--text-dim)); }
      .row .lbl { overflow: hidden; text-overflow: ellipsis; font-size: 13px; }
      .row .lbl.mod { font-weight: 600; }
      .row .cnt { margin-left: auto; font-size: 10.5px; color: var(--text-dim); flex: none; padding-left: 8px; }
      .row.hit .lbl { color: var(--accent); }
      .tree-empty { padding: 20px 14px; color: var(--text-dim); font-size: 12px; }

      /* ---- stage / canvas ------------------------------------------- */
      #stage { position: relative; flex: 1; min-width: 0; }
      #cy { position: absolute; inset: 0; }
      #cy::before {
        content: ""; position: absolute; inset: 0; z-index: 0; pointer-events: none;
        background-image: radial-gradient(var(--dot) 1px, transparent 1px);
        background-size: 26px 26px;
      }
      /* Cytoscape owns nodes and hit-testing. This SVG only paints the
         directed import flow above its transparent canvas, so every curve,
         arrow, and moving dash stays in the same coordinate system as a
         pan or zoom. */
      #flowLines { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
      .flow-route { fill: none; stroke-width: 1.35; stroke-linecap: round; opacity: .34; }
      .flow-route.depends { stroke: var(--edge-out); }
      .flow-route.used { stroke: var(--edge-in); }
      .flow-pulse { fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-dasharray: 2 12; opacity: .95; animation: flow-forward 1.35s linear infinite; }
      .flow-pulse.depends { stroke: var(--edge-out); }
      .flow-pulse.used { stroke: var(--edge-in); }
      .flow-arrow.depends { fill: var(--edge-out); }
      .flow-arrow.used { fill: var(--edge-in); }
      @keyframes flow-forward { to { stroke-dashoffset: -28px; } }
      @media (prefers-reduced-motion: reduce) { .flow-pulse { animation: none; stroke-dasharray: none; } }
      .crumb {
        position: absolute; left: 12px; top: 12px; z-index: 20;
        display: flex; align-items: center; gap: 2px; flex-wrap: wrap;
        max-width: calc(100% - 360px);
        padding: 6px 10px; border-radius: 9px;
        background: var(--bg-panel); border: 1px solid var(--line);
        font-size: 12px; box-shadow: var(--shadow);
      }
      .crumb a { color: var(--text-dim); cursor: pointer; text-decoration: none; padding: 1px 4px; border-radius: 5px; }
      .crumb a:hover { color: var(--text); background: var(--row-hover); }
      .crumb a:last-child { color: var(--text); font-weight: 600; }
      .crumb i { color: var(--line-strong); font-style: normal; }

      .legend {
        position: absolute; left: 12px; bottom: 12px; z-index: 20;
        background: var(--bg-panel); border: 1px solid var(--line);
        border-radius: 999px; box-shadow: var(--shadow);
        font-size: 11px; color: var(--text-dim);
        overflow: hidden; transition: border-radius .15s;
      }
      .legend > .legend-key {
        display: inline-flex; align-items: center; gap: 5px;
        padding: 5px 10px; cursor: default; user-select: none; color: var(--text-dim);
      }
      .legend > .legend-key svg { width: 12px; height: 12px; opacity: .7; }
      .legend .legend-items {
        display: none; flex-wrap: wrap; gap: 4px 12px; max-width: 320px;
        padding: 4px 11px 9px;
      }
      .legend:hover { border-radius: 12px; }
      .legend:hover .legend-key { display: none; }
      .legend:hover .legend-items { display: flex; }
      .legend i { display: inline-flex; align-items: center; gap: 5px; font-style: normal; }
      .legend i::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--k, var(--text-dim)); }
      .legend .arrow::before { width: 14px; height: 2px; border-radius: 0; }

      /* ---- detail panel -------------------------------------------- */
      #panel {
        position: absolute; top: 12px; right: 12px; bottom: auto; z-index: 30;
        width: 420px; max-width: calc(100vw - 24px); max-height: calc(100% - 24px);
        display: none; flex-direction: column;
        background: var(--sheet); border: 1px solid var(--line);
        border-radius: 14px; box-shadow: var(--shadow);
        overflow: hidden;
      }
      #panel.open { display: flex; }
      .panel-toggle {
        position: absolute; top: 12px; right: 12px; z-index: 26;
        display: inline-flex; align-items: center; gap: 6px;
        height: 32px; padding: 0 11px;
        background: var(--bg-panel); color: var(--text);
        border: 1px solid var(--line); border-radius: 8px;
        box-shadow: var(--shadow); font: 600 12px var(--font); cursor: pointer;
      }
      .panel-toggle:hover { border-color: var(--line-strong); }
      .panel-toggle svg { width: 14px; height: 14px; color: var(--text-dim); }
      .p-head { padding: 15px 16px 13px; border-bottom: 1px solid var(--line-soft); }
      .p-kind { font-size: 11px; letter-spacing: .01em; color: var(--text-dim); }
      .p-title-row { display: flex; align-items: flex-start; gap: 8px; margin: 4px 0 0; }
      .p-title { flex: 1; min-width: 0; font-size: 18px; font-weight: 700; word-break: break-word; }
      /* Opening the file is the commonest thing to do from here, so it sits
         next to the name rather than at the far end of a scrolling list. */
      .p-open {
        flex: none; display: inline-flex; align-items: center; justify-content: center;
        width: 28px; height: 28px; margin-top: 1px; border-radius: 7px;
        border: 1px solid var(--line); color: var(--text-dim); text-decoration: none;
      }
      .p-open svg { width: 14px; height: 14px; }
      .p-open:hover { color: var(--text); border-color: var(--line-strong); background: var(--bg-raised); }
      .p-path { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); margin-top: 4px; word-break: break-all; }
      .p-body { padding: 20px 16px 24px; overflow-y: auto; flex: 0 1 auto; min-height: 0; max-height: min(54vh, 560px); -webkit-overflow-scrolling: touch; }
      .p-close {
        position: absolute; top: 10px; right: 10px; width: 26px; height: 26px;
        border: none; background: transparent; color: var(--text-dim); cursor: pointer; font-size: 17px; line-height: 1;
      }
      .p-close:hover { color: var(--text); }
      .p-summary { margin: 0 0 20px; font-size: 12px; line-height: 1.55; color: var(--text-dim); }
      .p-sec { margin-top: 22px; }
      .p-sec h4 { font-size: 12px; font-weight: 700; letter-spacing: .01em; color: var(--text-dim); margin: 0 0 12px; }
      .dep-row { border-bottom: 1px solid var(--line-soft); }
      .dep { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 37px; }
      .dep-target { display: block; min-width: 0; padding: 7px 0; border: 0; background: transparent; color: var(--text); cursor: pointer; font: 600 13px var(--font); text-align: left; }
      /* Name only - a file is recognised by its name, and a folder path on
         every row turned the list into a wall of grey. The full path is still
         one hover away on the row's title. */
      .dep-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dep-target:hover .dep-name { color: var(--accent); }
      .dep-files-toggle { flex: none; padding: 4px 0 4px 8px; border: 0; background: transparent; color: var(--text-dim); font: 11px var(--font); cursor: pointer; }
      .dep-files-toggle:hover { color: var(--accent); }
      .dep-files { padding: 2px 0 8px; }
      .dep-folder { margin: 16px 0 4px; padding-top: 4px; font-size: 11px; font-weight: 700; color: var(--text-dim); }
      .dep-file { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: baseline; gap: 7px; padding: 8px 0 2px; font-size: 12px; }
      .dep-file .file-ref { min-width: 0; padding: 0; border: 0; background: transparent; color: var(--text); cursor: pointer; font: 600 12px var(--font); text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .dep-file .file-ref:last-child { text-align: right; }
      .dep-file .file-ref:hover { color: var(--accent); text-decoration: underline; }
      .dep-file .verb { color: var(--text-dim); font-size: 14px; line-height: 1; }
      .dep-file-empty, .dep-more { font-size: 11px; color: var(--text-dim); padding: 7px 0 0; }
      /* A file's own imports are already drawn on the canvas beside it, so the
         panel keeps them folded away: a count you can open when you want the
         names, not a wall of rows shouting at every selection. */
      .dep-accs { margin-top: 20px; border-top: 1px solid var(--line-soft); }
      .dep-acc { border-bottom: 1px solid var(--line-soft); }
      .dep-acc > summary {
        display: flex; align-items: center; gap: 8px; list-style: none; cursor: pointer;
        padding: 11px 0; font: 700 12px var(--font); color: var(--text-dim);
      }
      .dep-acc > summary::-webkit-details-marker { display: none; }
      .dep-acc > summary::before {
        content: ''; flex: none; width: 6px; height: 6px; margin-left: 1px;
        border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
        transform: rotate(-45deg); transition: transform .15s ease;
      }
      .dep-acc[open] > summary::before { transform: rotate(45deg) translate(-1px, -1px); }
      .dep-acc > summary:hover { color: var(--text); }
      .dep-list { padding: 2px 0 10px; }
      .file-jump {
        display: block; width: 100%; padding: 6px 0; border: 0; background: transparent;
        color: var(--text); cursor: pointer; font: 600 13px var(--font); text-align: left;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      }
      .file-jump:hover { color: var(--accent); }
      .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11px; background: var(--bg-raised); color: var(--text-dim); margin: 0 4px 4px 0; }
      .btn-open {
        display: inline-flex; align-items: center; gap: 6px; margin-top: 22px;
        height: 30px; padding: 0 12px; border-radius: 8px;
        background: var(--accent); color: #fff; border: none; font: inherit; cursor: pointer; text-decoration: none;
      }

      .hint {
        position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 15;
        padding: 5px 12px; border-radius: 999px; font-size: 12px; color: var(--text-dim);
        background: var(--bg-panel); border: 1px solid var(--line);
        pointer-events: none; opacity: 0; transition: opacity .3s;
      }
      .hint.show { opacity: 1; }

      .node-tip {
        position: fixed; z-index: 50;
        width: max-content; max-width: min(260px, calc(100vw - 24px));
        padding: 6px 9px; border-radius: 7px;
        background: var(--sheet); border: 1px solid var(--line);
        box-shadow: var(--shadow);
        font-size: 12px; font-family: var(--font); color: var(--text);
        overflow-wrap: anywhere; pointer-events: none;
        display: none;
      }
      .node-tip.show { display: block; }
      .tip-name { font-weight: 700; }
      .tip-dir { display: block; margin-top: 2px; font: 400 11px var(--mono); color: var(--text-dim); }
      .tip-hint { display: block; margin-top: 4px; font-size: 11px; line-height: 1.35; color: var(--text-dim); }

      /* ---- responsive ---------------------------------------------------
         The map is a flowchart people open wherever the link lands - a 4K
         monitor, a 13" laptop, a phone. Three progressive steps: tighten the
         header, then float the structure list over the canvas instead of
         squeezing it, then drop the detail panel to a bottom sheet so it
         never buries the diagram it describes. */
      @media (max-width: 1040px) {
        :root { --sidebar-w: 260px; }
        .crumb { max-width: calc(100% - 340px); }
      }

      @media (max-width: 760px) {
        header { gap: 8px; padding: 0 10px; }
        .brand span { display: none; }
        .brand b { max-width: 34vw; white-space: nowrap; }
        .spacer { display: none; }
        .search { flex: 1 1 0; min-width: 0; }
        .search input { width: 100%; min-width: 0; }

        #sidebar {
          position: absolute; inset: 0 auto 0 0; z-index: 45;
          width: min(82vw, 300px);
          border-right: 1px solid var(--line); box-shadow: var(--shadow);
          transform: translateX(0);
          transition: transform .2s ease;
        }
        main.nav-collapsed #sidebar {
          width: min(82vw, 300px); opacity: 1; pointer-events: none;
          border-right-color: var(--line);
          transform: translateX(-101%);
        }
        #scrim {
          display: block; position: absolute; inset: 0; z-index: 44;
          background: rgba(0, 0, 0, .45);
          opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        main:not(.nav-collapsed) #scrim { opacity: 1; pointer-events: auto; }

        .crumb { left: 8px; top: 8px; max-width: calc(100% - 16px); padding: 5px 9px; font-size: 11px; }

        #panel {
          top: auto; left: 8px; right: 8px; bottom: 8px;
          width: auto; max-width: none; max-height: 68vh;
        }
        .panel-toggle { top: 52px; right: 8px; }
        .legend { display: none; }
        .hint { bottom: auto; top: calc(var(--header-h) + 44px); }
      }

      @media (max-width: 420px) {
        :root { --header-h: 52px; }
        .brand b { display: none; }
      }
    </style>
  </head>
  <body>
    <header>
      <button class="tool icon-only" id="navToggle" title="Show or hide the structure list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      </button>
      <span class="brand">
        <svg viewBox="16 19 208 208" aria-hidden="true"><path transform="translate(0 8)" d="M120 52C129 54 133 66 134 82C150 92 186 116 210 146C213 150 211 154 206 153C176 150 150 140 133 128C132 145 128 164 120 178C112 164 108 145 107 128C90 140 64 150 34 153C29 154 27 150 30 146C54 116 90 92 106 82C107 66 111 54 120 52Z" fill="var(--accent)"/></svg>
        <b id="repoName"></b><span id="sub"></span>
      </span>
      <span class="spacer"></span>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" placeholder="Find a module or file" autocomplete="off" spellcheck="false" />
      </label>
      <button class="tool icon-only" id="fit" title="Re-centre the diagram">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3m13-5v3a2 2 0 0 1-2 2h-3"/></svg>
      </button>
      <button class="tool icon-only" id="theme" title="Toggle theme">
        <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>

    <main>
      <aside id="sidebar">
        <div class="side-head">
          <span>Structure</span>
          <span class="spacer"></span>
          <button class="mini" id="expandAll" title="Open every folder">Expand</button>
          <button class="mini" id="collapseAll" title="Close everything">Collapse</button>
        </div>
        <div id="tree"></div>
      </aside>
      <div id="scrim"></div>

      <section id="stage">
        <div id="cy"></div>
        <svg id="flowLines" aria-hidden="true"></svg>
        <div class="crumb" id="crumb"></div>
        <button class="panel-toggle" id="panelToggle" type="button" aria-expanded="false" title="Show details for selected item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7h.01"/></svg>
          Details
        </button>
        <div class="legend" id="legend"></div>
        <div class="hint" id="hint"></div>
        <div class="node-tip" id="nodeTip"></div>
        <aside id="panel">
          <button class="p-close" title="Close">&times;</button>
          <div class="p-head">
            <div class="p-kind" id="pKind"></div>
            <div class="p-title-row">
              <div class="p-title" id="pTitle"></div>
              <a class="p-open" id="pOpen" hidden title="Open in editor" aria-label="Open in editor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
              </a>
            </div>
            <div class="p-path" id="pPath"></div>
          </div>
          <div class="p-body" id="pBody"></div>
        </aside>
      </section>

    <script>__VENDOR__</script>
    <script id="graph-data" type="application/json">__GRAPH__</script>
    <script>
      (function () {
        'use strict';
        var GRAPH = JSON.parse(document.getElementById('graph-data').textContent);
        var STORE = '__STORAGE_KEY__';
        var save = function (k, v) { try { localStorage.setItem(STORE + ':' + k, v); } catch (e) {} };
        var load = function (k) { try { return localStorage.getItem(STORE + ':' + k); } catch (e) { return null; } };

        // Below this width the sidebar floats over the canvas as a drawer and
        // the panel is a bottom sheet, so the diagram needs far less breathing
        // room around it when it fits.
        var isNarrow = function () { return window.matchMedia('(max-width: 760px)').matches; };
        var fitPad = function () { return isNarrow() ? 22 : 60; };
        // Full-fit made normal desktop maps too small to read. Begin closer
        // than fit, but well below the reference's roughly 2x enlargement.
        // Pan and wheel zoom remain available for every map.
        var DEFAULT_ZOOM_MULTIPLIER = 1.35;

        (function initTheme() {
          if (load('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();

        // Structure list is hidden by default; the header button brings it back.
        (function initNav() {
          if (load('nav') !== 'open') document.querySelector('main').classList.add('nav-collapsed');
        })();

        // ---- indexes -------------------------------------------------
        var nodeById = {};
        GRAPH.nodes.forEach(function (n) { nodeById[n.id] = n; });
        var parentOf = {}, childrenOf = {};
        GRAPH.nodes.forEach(function (n) { childrenOf[n.id] = []; });
        GRAPH.edges.forEach(function (e) {
          if (e.type !== 'contains') return;
          parentOf[e.to] = e.from;
          (childrenOf[e.from] = childrenOf[e.from] || []).push(e.to);
        });
        var depEdges = GRAPH.edges.filter(function (e) { return e.type === 'depends'; });
        var ROOT = GRAPH.nodes.find(function (n) { return n.type === 'root'; });
        var ROOT_ID = ROOT ? ROOT.id : GRAPH.nodes[0].id;

        var TYPE_COLOR = { root: '--c-root', zone: '--c-zone', folder: '--c-folder', file: '--c-file' };
        function colorVar(n) {
          if (n.type === 'module') return n.meta && n.meta.kind === 'shared' ? '--c-shared' : '--c-feature';
          return TYPE_COLOR[n.type] || '--c-file';
        }
        function cssVal(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
        // Node fills run from pale cream to clay; pick a label colour that
        // actually contrasts with the fill rather than a single global one.
        function idealText(hex) {
          var c = String(hex || '').replace('#', '');
          if (c.length === 3) c = c[0] + c[0] + c[1] + c[1] + c[2] + c[2];
          if (c.length < 6) return '#faf9f5';
          var r = parseInt(c.substr(0, 2), 16),
              g = parseInt(c.substr(2, 2), 16),
              b = parseInt(c.substr(4, 2), 16);
          return (r * 299 + g * 587 + b * 114) / 1000 >= 150 ? '#211e19' : '#faf9f5';
        }
        function hasKids(id) { return (childrenOf[id] || []).length > 0; }
        function isAncestor(a, b) { for (var c = parentOf[b]; c; c = parentOf[c]) if (c === a) return true; return false; }
        function ancestry(id) { var out = []; for (var c = parentOf[id]; c; c = parentOf[c]) out.unshift(c); return out; }
        function sortKids(ids) {
          return ids.slice().sort(function (a, b) {
            var na = nodeById[a], nb = nodeById[b];
            var ra = na.type === 'file' ? 1 : 0, rb = nb.type === 'file' ? 1 : 0;
            if (ra !== rb) return ra - rb; // folders/modules before files
            var da = (na.meta && na.meta.descendantFiles) || 0, db = (nb.meta && nb.meta.descendantFiles) || 0;
            if (da !== db) return db - da;
            return na.label < nb.label ? -1 : na.label > nb.label ? 1 : 0;
          });
        }

        // Every cross-boundary dependency of `id`, grouped to the module the
        // other end lives in when `id` is not itself a file.
        function rollDeps(id, dir) {
          var self = nodeById[id];
          var groupByModule = self.type !== 'file';
          var agg = {};
          depEdges.forEach(function (e) {
            var inside = (dir === 'out') ? e.from : e.to;
            var other = (dir === 'out') ? e.to : e.from;
            if (!(inside === id || isAncestor(id, inside))) return;
            if (other === id || isAncestor(id, other)) return;
            var key = other;
            if (groupByModule) {
              var mod = nodeById[other] && nodeById[other].module;
              if (mod && nodeById['module:' + mod]) key = 'module:' + mod;
            }
            agg[key] = (agg[key] || 0) + (e.weight || 1);
          });
          return Object.keys(agg).map(function (k) {
            return { id: k, weight: agg[k] };
          }).sort(function (a, b) { return b.weight - a.weight; });
        }

        // The actual file-to-file import edges behind one rolled-up entry
        // from rollDeps - e.g. which specific files inside `id` are
        // imported by which specific files inside `otherId`.
        function rollDepsFileList(id, otherId, dir) {
          var list = [];
          depEdges.forEach(function (e) {
            var inside = (dir === 'out') ? e.from : e.to;
            var other = (dir === 'out') ? e.to : e.from;
            if (!(inside === id || isAncestor(id, inside))) return;
            if (!(other === otherId || isAncestor(otherId, other))) return;
            list.push({ from: e.from, to: e.to, weight: e.weight || 1 });
          });
          return list.sort(function (a, b) { return b.weight - a.weight; });
        }

        // ---- sidebar tree ------------------------------------------
        var treeEl = document.getElementById('tree');
        var openTree = {};
        (function initOpen() {
          // Default: fully collapsed - just the root row. The canvas already
          // shows the top-level spine, so the tree opens only where asked.
          var saved = load('open');
          if (saved) { try { JSON.parse(saved).forEach(function (id) { if (nodeById[id]) openTree[id] = 1; }); } catch (e) {} }
        })();
        var persistOpen = debounce(function () {
          save('open', JSON.stringify(Object.keys(openTree).filter(function (id) { return openTree[id]; })));
        }, 200);

        var CHEV = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m9 6 6 6-6 6"/></svg>';
        var filterSet = null; // Set of ids to show, or null for "show all"

        function rowEl(id, depth) {
          var n = nodeById[id];
          var kids = hasKids(id);
          var row = document.createElement('div');
          row.className = 'row' + (openTree[id] ? ' open' : '') + (id === focusId ? ' sel' : '');
          if (filterSet && filterSet.has('hit:' + id)) row.className += ' hit';
          row.dataset.id = id;
          row.style.paddingLeft = (6 + depth * 14) + 'px';
          var df = (n.meta && n.meta.descendantFiles) || 0;
          row.innerHTML =
            '<span class="tw">' + (kids ? CHEV : '') + '</span>' +
            '<span class="dot" style="--k:' + cssVal(colorVar(n)) + '"></span>' +
            '<span class="lbl' + (n.type === 'module' ? ' mod' : '') + '">' + esc(n.label) + '</span>' +
            (kids && df ? '<span class="cnt">' + df + '</span>' : '');
          return row;
        }

        // Render the subtree rooted at `id` into `host`. Children render only
        // when their parent is open, so the DOM stays small on big repos.
        function renderInto(host, id, depth) {
          (filterSet ? sortKids(childrenOf[id] || []).filter(inFilter) : sortKids(childrenOf[id] || [])).forEach(function (cid) {
            host.appendChild(rowEl(cid, depth));
            if (openTree[cid] && hasKids(cid)) renderInto(host, cid, depth + 1);
          });
        }
        function inFilter(id) { return !filterSet || filterSet.has(id); }

        function renderTree() {
          var frag = document.createDocumentFragment();
          frag.appendChild(rowEl(ROOT_ID, 0));
          if (openTree[ROOT_ID]) renderInto(frag, ROOT_ID, 1);
          treeEl.innerHTML = '';
          if (filterSet && !filterSet.size) {
            var e = document.createElement('div');
            e.className = 'tree-empty';
            e.textContent = 'Nothing matches that search.';
            treeEl.appendChild(e);
            return;
          }
          treeEl.appendChild(frag);
          var sel = treeEl.querySelector('.row.sel');
          if (sel) sel.scrollIntoView({ block: 'nearest' });
        }

        treeEl.addEventListener('click', function (ev) {
          var row = ev.target.closest('.row');
          if (!row) return;
          var id = row.dataset.id;
          if (ev.target.closest('.tw') && hasKids(id)) {
            openTree[id] = openTree[id] ? 0 : 1;
            persistOpen();
            renderTree();
          } else {
            focus(id);
            if (isNarrow()) setNav(false);
          }
        });

        document.getElementById('expandAll').addEventListener('click', function () {
          GRAPH.nodes.forEach(function (n) { if (hasKids(n.id)) openTree[n.id] = 1; });
          persistOpen(); renderTree(); hint('Every folder open');
        });
        document.getElementById('collapseAll').addEventListener('click', function () {
          openTree = {};
          persistOpen(); renderTree(); hint('Collapsed');
        });

        // ---- canvas: the selected node and its immediate neighbourhood ----
        var COLX = 500, ROWY = 96, CHILD_CAP = 40, NODE_H = 36, FRAME_PAD = 34;
        // A box wide enough for its name. Truncating every label to a uniform
        // width made the map unreadable on the large screens it usually opens
        // on, so each box is measured against the text it actually carries.
        // The cap is a backstop for pathological names; the ellipsis style
        // still applies past it.
        var LABEL_CAP = 260, LABEL_PAD = 30;
        // Extensions are noise here - a map is about which piece of the code
        // this is, not what the file is written in. Only strip a known code
        // extension so a name like `v1.2` keeps its tail.
        var CODE_EXT = /\.(jsx?|tsx?|mjs|cjs|mts|cts|vue|svelte|py|rb|go|rs|java|kt|kts|swift|php|cs|scala|c|h|cc|cpp|hpp|css|scss|sass|less|json|ya?ml|md|sql|sh)$/i;
        function mapLabel(n, role) {
          var name = n.type === 'file' ? n.label.replace(CODE_EXT, '') : n.label;
          // A child folder can share its name with an unrelated sibling
          // module (both called "utils", say) - the trailing slash marks
          // it as "a folder living in here", not "the same thing again".
          return name + (role === 'child' && n.type !== 'file' ? '/' : '');
        }
        var measurer = document.createElement('canvas').getContext('2d');
        function sizeFor(n, role, label) {
          var focus = role === 'focus';
          measurer.font = (focus ? '700 15.5px ' : '600 14px ') + cssVal('--font');
          var text = measurer.measureText(label == null ? mapLabel(n, role) : label).width;
          var min = focus ? (n.type === 'file' ? 96 : 118) : (n.type === 'file' ? 78 : 90);
          return Math.round(Math.max(min, Math.min(LABEL_CAP, text + LABEL_PAD)));
        }
        // Small deterministic "noise" keyed off an id, not Math.random() -
        // the same node always lands in the same spot on re-render, but the
        // grid stops looking machine-ruled. Kept tiny on purpose: it should
        // read as hand-placed, not chaotic.
        function noise(seed) {
          var h = 0;
          for (var i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) | 0;
          return ((h >>> 0) % 1000) / 1000;
        }
        function jitter(seed, amp) { return noise(seed) * amp * 2 - amp; }

        function neighbourhood(id) {
          var self = nodeById[id];
          var els = [];
          var placed = {};
          function put(nid, x, y, role, extra) {
            if (placed[nid]) return;
            placed[nid] = 1;
            var n = nodeById[nid];
            var col = cssVal(colorVar(n));
            var label = mapLabel(n, role);
            var data = {
              id: nid, role: role, type: n.type, label: label,
              col: col, txt: idealText(col), w: sizeFor(n, role, label),
            };
            if (extra) for (var k in extra) data[k] = extra[k];
            els.push({ data: data, position: { x: x, y: y } });
          }
          // A frame is a plain backdrop rectangle sized from its members'
          // actual bounding box, not a real cytoscape compound parent - so
          // dragging a member is a normal free drag (nothing auto-resizes
          // around it) and the frame can simply be told to disappear later.
          function frame(fid, kind, label, rows) {
            var minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            rows.forEach(function (r) {
              minX = Math.min(minX, r.x - r.w / 2); maxX = Math.max(maxX, r.x + r.w / 2);
              minY = Math.min(minY, r.y - NODE_H / 2); maxY = Math.max(maxY, r.y + NODE_H / 2);
            });
            var left = minX - FRAME_PAD, right = maxX + FRAME_PAD, top = minY - FRAME_PAD, bottom = maxY + FRAME_PAD;
            var isBox = kind === 'box';
            els.push({ data: {
              id: fid, role: isBox ? 'box' : 'colframe', kind: isBox ? 'contains' : kind,
              label: label, w: right - left, h: bottom - top,
            }, position: { x: (left + right) / 2, y: (top + bottom) / 2 } });
          }

          put(id, 0, 0, 'focus');

          // Import flow reads left to right: modules this selection imports
          // feed it from the left, then modules that import this selection
          // continue on the right. The graph direction stays factual - only
          // its staging changes, so a dense neighbourhood reads as a flow
          // rather than a spider around a centre node.
          var inc = rollDeps(id, 'in');
          var out = rollDeps(id, 'out').filter(function (d) { return !inc.some(function (i) { return i.id === d.id; }); });
          var maxSpreadRows = 0;
          spread(out, -COLX, 'out', 'DEPENDS ON');
          spread(inc, COLX, 'in', 'USED BY');
          function spread(list, x, role, headLabel) {
            var m = Math.min(list.length, 14);
            if (!m) return;
            maxSpreadRows = Math.max(maxSpreadRows, m);
            var frameId = 'h:' + role;
            var rows = list.slice(0, m).map(function (d, i) {
              var y = (i - (m - 1) / 2) * ROWY + jitter(d.id, ROWY * 0.1);
              return { id: d.id, x: x, y: y, w: sizeFor(nodeById[d.id], role), weight: d.weight };
            });
            frame(frameId, role, headLabel, rows);
            rows.forEach(function (r, i) {
              put(r.id, r.x, r.y, role, { frame: frameId });
              var isIn = role === 'in';
              // Arrows always travel left to right. A dependency is imported
              // into the focus node; a consumer imports the focus node. This
              // says "data/context flows through here" without changing what
              // any import edge means.
              els.push({ data: {
                id: (isIn ? 'e:in:' : 'e:out:') + r.id,
                source: isIn ? id : r.id,
                target: isIn ? r.id : id,
                otherEnd: isIn ? 'target' : 'source',
                kind: role, other: r.id, label: r.weight + ' import' + (r.weight === 1 ? '' : 's'),
              } });
            });
          }

          // Containment children sit in their own labelled, dashed-border
          // frame below the focus - wrapped into a grid, not a single row,
          // now that a shared edge no longer needs to route past them.
          // The frame is placed clear of the tallest dependency column so
          // no in/out edge ever cuts through a child node.
          var kids = sortKids(childrenOf[id] || []);
          var shown = kids.slice(0, CHILD_CAP);
          if (shown.length) {
            var perRow = Math.min(5, Math.max(3, Math.ceil(Math.sqrt(shown.length))));
            var depClear = (Math.max(maxSpreadRows, 1) - 1) / 2 * ROWY + ROWY * 0.9;
            var boxTop = Math.max(ROWY * 1.3, depClear);
            var boxId = 'box:' + id;
            // Boxes are now as wide as their names, so the column pitch has
            // to follow the widest child rather than a fixed guess - a
            // constant gap would let long names overlap their neighbours.
            var widths = shown.map(function (cid) { return sizeFor(nodeById[cid], 'child'); });
            var gapX = Math.max.apply(null, widths) + 44;
            var rows = shown.map(function (cid, i) {
              var r = Math.floor(i / perRow), c = i - r * perRow;
              var rowCount = Math.min(perRow, shown.length - r * perRow);
              var x = (c - (rowCount - 1) / 2) * gapX + jitter(cid + ':x', gapX * 0.06);
              var y = boxTop + r * ROWY + jitter(cid + ':y', ROWY * 0.1);
              return { id: cid, x: x, y: y, w: widths[i] };
            });
            frame(boxId, 'box', 'INSIDE · ' + self.label, rows);
            rows.forEach(function (r) { put(r.id, r.x, r.y, 'child', { frame: boxId }); });
            els.push({ data: { id: 'e:box:' + id, source: id, target: boxId, kind: 'contains' } });
          }

          return { els: els, hiddenKids: kids.length - shown.length };
        }

        function styleArr() {
          return [
            // Scoped to node[type] (real graph nodes) so the frame
            // backdrops below are left alone - they have no `type` and
            // size themselves from an explicit data(w)/data(h), not this.
            // One renderer draws fills, labels, borders, and edges. Keeping
            // every map mark inside Cytoscape prevents a second canvas from
            // drifting when browser display scale changes.
            { selector: 'node[type]', style: {
              'background-color': 'data(col)', 'background-opacity': 0.92,
              label: 'data(label)', color: 'data(txt)',
              'font-size': 14, 'font-family': cssVal('--font'), 'font-weight': 600,
              'text-valign': 'center', 'text-halign': 'center',
              'text-wrap': 'ellipsis', 'text-max-width': 'data(w)',
              width: 'data(w)', height: 34,
              shape: 'round-rectangle',
              'border-width': 1.4, 'border-color': cssVal('--hl'), 'border-opacity': 0.82,
              'transition-property': 'opacity',
              'transition-duration': 120,
            } },
            { selector: 'node[role="focus"]', style: {
              height: 44, 'font-size': 15.5, 'font-weight': 700, 'border-width': 2.2,
              'background-opacity': 1,
            } },
            { selector: 'node[type="file"]', style: { shape: 'round-rectangle' } },
            { selector: 'node[role="child"]', style: { 'border-style': 'dashed' } },
            { selector: 'node[role="in"], node[role="out"]', style: { 'background-opacity': 0.8 } },
            // Frame backdrops - plain sized rectangles (not compound
            // parents), sized in JS from their members' actual bounding
            // box. Purely decorative: no hover, no click, no tooltip - a
            // faint hint of grouping, not another interactive thing to
            // explain. They fade away entirely the moment you drag a
            // member out of place (see the 'grab' handler below), since
            // once you're rearranging things by hand the training-wheel
            // outline has served its purpose.
            { selector: 'node[role="box"], node[role="colframe"]', style: {
              shape: 'round-rectangle',
              width: 'data(w)', height: 'data(h)',
              'border-width': 1.2, 'border-style': 'dashed', 'border-color': cssVal('--line-strong'),
              label: 'data(label)', 'text-valign': 'top', 'text-halign': 'center', 'text-margin-y': -14,
              'font-size': 12, 'font-weight': 700, 'font-family': cssVal('--font'),
              events: 'no',
              'transition-property': 'opacity', 'transition-duration': 260,
            } },
            { selector: 'node[role="box"]', style: {
              'background-color': cssVal('--bg-raised'), 'background-opacity': 0.4, color: cssVal('--text-dim'),
            } },
            { selector: 'node[role="colframe"]', style: { 'background-opacity': 0.05 } },
            { selector: 'node[role="colframe"][kind="in"]', style: { 'background-color': cssVal('--edge-in'), 'border-color': cssVal('--edge-in'), color: cssVal('--edge-in') } },
            { selector: 'node[role="colframe"][kind="out"]', style: { 'background-color': cssVal('--edge-out'), 'border-color': cssVal('--edge-out'), color: cssVal('--edge-out') } },
            { selector: 'node.hover', style: { 'border-width': 2, 'border-color': cssVal('--accent'), 'border-opacity': 1 } },
            { selector: 'edge', style: {
              'curve-style': 'bezier', width: 1.5,
              'line-color': cssVal('--edge'), 'line-opacity': 0.78,
              'target-arrow-shape': 'triangle', 'target-arrow-color': cssVal('--edge'), 'arrow-scale': 0.8,
            } },
            { selector: 'edge[kind="contains"]', style: {
              'curve-style': 'taxi', 'taxi-direction': 'downward', 'taxi-turn': '30px', width: 1.2,
              'line-style': 'dashed', 'target-arrow-shape': 'none',
            } },
            // Cytoscape keeps a generous invisible hit target for each
            // dependency. The SVG flow layer above paints its visible route,
            // arrowhead, and moving dashes in one left-to-right lane.
            { selector: 'edge[kind="out"], edge[kind="in"]', style: {
              width: 18, 'line-opacity': 0, 'target-arrow-opacity': 0, 'target-arrow-shape': 'none',
              'text-opacity': 0,
            } },
          ];
        }

        var cy = cytoscape({
          container: document.getElementById('cy'),
          minZoom: 0.15, maxZoom: 2.2, wheelSensitivity: 0.25,
          // Do not set Cytoscape's pixelRatio here. A supplied value becomes
          // its permanent forced backing scale, so moving a browser window
          // between displays leaves its canvas in the old coordinate system.
          // With the default, cy.resize() reads the display's current scale.
          style: styleArr(),

        // ---- visible import flow -----------------------------------
        // The lane geometry deliberately uses model positions instead of

        // arrow on each wheel tick, while node dragging only redraws paths.
        var flowEl = document.getElementById('flowLines');
        var SVG_NS = 'http://www.w3.org/2000/svg';
        var flowGroup = document.createElementNS(SVG_NS, 'g');
        var flowPaths = [];
        var flowTransformRaf = 0, flowGeometryRaf = 0;
        var flowWidth = 0, flowHeight = 0;
        var FLOW_DEFS =
          '<defs>' +
            '<marker id="flowArrowDepends" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="flow-arrow depends" d="M0 0L8 4L0 8Z"/></marker>' +
            '<marker id="flowArrowUsed" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="flow-arrow used" d="M0 0L8 4L0 8Z"/></marker>' +

          var tx = tp.x + (rightward ? -targetWidth / 2 : targetWidth / 2);

            ' C' + c1x.toFixed(1) + ' ' + sp.y.toFixed(1) +
            ' ' + c2x.toFixed(1) + ' ' + tp.y.toFixed(1) +

          ancestry(id).forEach(function (a) { openTree[a] = 1; });

        function applyFit(dur) {

        // A dependency pill keeps the current subject in place and turns the

          var isOutgoing = dir === 'out';

          document.getElementById('pTitle').textContent = current.label + ' & ' + other.label;
          document.getElementById('pPath').textContent = '';

          h += '<button class="btn-open relationship-jump" type="button" data-id="' + esc(otherId) + '">Explore ' + esc(other.label) + '</button>';

          el.textContent = 'Hide file links';
        }
        function countPhrase(count, noun) {

        function fileLinkGroups(files) {

        function fileLinkRows(files) {
          return files.map(function (f) {

              '<div class="dep"><button class="dep-target" data-id="' + esc(d.id) + '" data-dir="' + esc(dir) + '" title="' + esc(d.full) + ' - show how this connects">' +
              '<span class="dep-name">' + esc(d.label) + '</span>' +
              '</button><button class="dep-files-toggle" data-other="' + esc(d.id) + '" data-dir="' + esc(dir) + '">Show files</button></div>' +

        document.querySelector('.p-close').addEventListener('click', function () {

        });

        // ---- editor links --------------------------------------
        function editorHref(n) {
          if (!n || !n.path || !GRAPH.repo || !GRAPH.repo.root) return null;
          var abs = GRAPH.repo.root.replace(/\/$/, '') + '/' + n.path;
          var ed = (GRAPH.config && GRAPH.config.editor) || 'vscode';
          if (ed === 'cursor') return 'cursor://file/' + abs;
          if (ed === 'webstorm' || ed === 'idea') return 'jetbrains://open?file=' + encodeURIComponent(abs);

        function setNav(open) {

          // never changes - only refit/resize when it actually reflows.

        document.getElementById('navToggle').addEventListener('click', function () {

        });
        document.getElementById('scrim').addEventListener('click', function () { setNav(false); });
        document.getElementById('fit').addEventListener('click', function () { applyFit(220); });
        document.getElementById('theme').addEventListener('click', function () {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          if (light) { document.documentElement.removeAttribute('data-theme'); save('theme', 'dark'); }
          else { document.documentElement.setAttribute('data-theme', 'light'); save('theme', 'light'); }
          cy.style().resetToDefault().fromJson(styleArr()).update();
          renderTree(); buildLegend();
          if (focusId) { drawCrumb(focusId); }
        });

        var q = document.getElementById('q');
        q.addEventListener('input', debounce(runSearch, 140));
        q.addEventListener('keydown', function (e) { if (e.key === 'Escape') { q.value = ''; runSearch(); q.blur(); } });
        function runSearch() {
          var term = q.value.trim().toLowerCase();
          if (!term) { filterSet = null; renderTree(); return; }
          filterSet = new Set();
          var hits = 0;
          GRAPH.nodes.forEach(function (n) {
            if ((n.label && n.label.toLowerCase().indexOf(term) >= 0) ||
                (n.path && n.path.toLowerCase().indexOf(term) >= 0)) {
              hits++;
              filterSet.add(n.id); filterSet.add('hit:' + n.id);
              ancestry(n.id).forEach(function (a) { filterSet.add(a); openTree[a] = 1; });
              (childrenOf[n.id] || []).forEach(function (c) { filterSet.add(c); });
            }
          });
          renderTree();
          hint(hits ? hits + ' match' + (hits > 1 ? 'es' : '') : 'No matches');
        }

        // ---- legend + subtitle -------------------------------
        function buildLegend() {
          var L = [['feature', 'module'], ['shared', 'shared'], ['folder', 'folder'], ['file', 'file']];
          document.getElementById('legend').innerHTML =
            '<span class="legend-key"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>Legend</span>' +
            '<span class="legend-items">' +
            L.map(function (x) { return '<i style="--k:' + cssVal('--c-' + x[0]) + '">' + x[1] + '</i>'; }).join('') +
            '<i class="arrow" style="--k:' + cssVal('--edge-out') + '">depends on</i>' +
            '<i class="arrow" style="--k:' + cssVal('--edge-in') + '">used by</i>' +
            '</span>';
        }
        (function () {
          var s = GRAPH.stats || {};
          document.getElementById('repoName').textContent = (GRAPH.repo && GRAPH.repo.name) || 'repo';
          document.title = ((GRAPH.repo && GRAPH.repo.name) || 'repo') + ' - birdsEye';
          document.getElementById('sub').textContent =
            (s.modules || 0) + ' modules · ' + (s.files || 0) + ' files · ' +
            (s.languages || []).slice(0, 6).join(', ');
          buildLegend();
        })();

        var hintEl = document.getElementById('hint'), hintT;
        function hint(msg) {
          hintEl.textContent = msg; hintEl.classList.add('show');
          clearTimeout(hintT); hintT = setTimeout(function () { hintEl.classList.remove('show'); }, 1600);
        }

        renderTree();
        focus(ROOT_ID);
        // Box widths are measured with the real map font. If the vendored
        // face is still decoding at first paint the measurement falls back to
        // a system metric, so re-lay the map out once it is actually ready.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { if (focusId) focus(focusId); });
        }
        // Details begin collapsed everywhere so the diagram, not a side rail,
        // owns the first view. The small top-right control opens them on demand.
        setPanelOpen(false);
        hint(isNarrow() ? 'Tap a box, or open the list up top, to see how it connects'
                        : 'Pick anything on the left to see how it connects');
        // One renderer owns all viewport changes. Window resize alone is not
        // enough: macOS can move a window to another display without a size
        // event, while devicePixelRatio changes underneath its canvas.
        var viewSyncPending = false, viewSyncRefit = false, viewSyncForce = false;
        function syncViewport(refit, force) {
          if (!force) return;
          // Cytoscape reads current DPR here and recreates its own backing
          // canvas. No second renderer has to be kept in sync.
          cy.resize();
          if (refit) applyFit(0);
        }
        function scheduleViewportSync(refit, force) {
          viewSyncRefit = viewSyncRefit || !!refit;
          viewSyncForce = viewSyncForce || !!force;
          if (viewSyncPending) return;
          viewSyncPending = true;
          var run = function () {
            var shouldRefit = viewSyncRefit, shouldForce = viewSyncForce;
            viewSyncPending = false; viewSyncRefit = false; viewSyncForce = false;
            syncViewport(shouldRefit, shouldForce);
          };
          if (document.hidden) setTimeout(run, 32);
          else requestAnimationFrame(run);
        }
        var scheduleSettledViewportSync = debounce(function () {
          scheduleViewportSync(true, true);
        }, 160);
        window.addEventListener('resize', scheduleSettledViewportSync);
        if (window.visualViewport) window.visualViewport.addEventListener('resize', scheduleSettledViewportSync);
        if (window.ResizeObserver) {
          new ResizeObserver(scheduleSettledViewportSync).observe(document.getElementById('stage'));
        }
        // A resolution media query fires when a window crosses displays even
        // if the browser keeps the same CSS viewport dimensions. Replace its
        // query after every change so the next display swap is also observed.
        var dprQuery = null;
        function displayPixelRatio() { return window.devicePixelRatio || 1; }
        function removeDprListener(q) {
          if (!q) return;
          if (q.removeEventListener) q.removeEventListener('change', onDprChange);
          else q.removeListener(onDprChange);
        }
        function watchDisplayPixelRatio() {
          removeDprListener(dprQuery);
          dprQuery = window.matchMedia('(resolution: ' + displayPixelRatio() + 'dppx)');
          if (dprQuery.addEventListener) dprQuery.addEventListener('change', onDprChange);
          else dprQuery.addListener(onDprChange);
        }
        function onDprChange() {
          watchDisplayPixelRatio();
          scheduleViewportSync(true, true);
        }
        watchDisplayPixelRatio();
        // If map opened behind another tab or display changes while hidden,
        // settle it only when it first becomes visible. Later tab switches
        // still repair a changed backing store, but preserve manual pan/zoom
        // when dimensions and display scale stayed the same.
        var loadedHidden = document.hidden, settledOnce = false;
        function resettle() {
          if (settledOnce) return;
          settledOnce = true;
          scheduleViewportSync(true, true);
        }
        if (loadedHidden) {
          document.addEventListener('visibilitychange', function () {
            if (!document.hidden) resettle();
          });
          setTimeout(function () { if (!document.hidden) resettle(); }, 800);
        }
        document.addEventListener('visibilitychange', function () {
          if (!document.hidden) scheduleViewportSync(false, false);
        });
        // The hand-lettered font is a data: URI so it's available near-
        // instantly, but canvas text painted before the browser finishes
        // parsing it silently falls back to a generic font for that one
        // paint - it won't repaint itself later. Force one more style
        // pass once the font is confirmed ready so that never sticks.
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(function () { cy.style().update(); });
        }
      })();
    </script>
  </body>
</html>
