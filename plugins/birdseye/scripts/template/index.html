            var head = '<div class="gone-dir"><span class="path">' + esc(dir) + '</span>'
              + (shared
                ? '<span class="gone-when">' + removedWhen(shared) + '</span>'
                : '<span class="gone-count">' + pluralize(items.length, 'file') + '</span>')
              + '</div>';

            var rows = items.map(function (it) {
              var d = it.rec;
              // When the whole folder went in one commit, that commit is on the
              // folder line already - each file is just a name, nothing to open.
              if (shared) {
                return '<li class="gone-file plain">'
                  + '<span class="gone-name">' + esc(it.name) + '</span></li>';
              }
              // The row shows the one fact worth a glance - when it went. The
              // only thing worth folding open is the aliased path: the exact
              // text to search the doc for, which the resolved name above hides.
              // The commit sha rides along inside. No alias -> nothing to open.
              var alias = d.wrote && d.wrote !== d.path ? d.wrote : null;
              var when = d.date ? esc(d.date) : 'earlier in history';
              var nameCell = '<span class="gone-name">' + esc(it.name) + '</span>';
              var whenCell = '<span class="gone-when">removed ' + when + '</span>';
              if (!alias) {
                return '<li class="gone-file plain">' + nameCell + whenCell + '</li>';
              }
              var more = 'This doc refers to it as <span class="path">' + esc(alias)
                + '</span> - search the doc for that to fix the reference.';
              if (d.sha) {
                more += ' Removed in commit <code>' + esc(String(d.sha).slice(0, 7)) + '</code>.';
              }
              return '<li class="gone-file"><details><summary>'
                + nameCell + whenCell
                + '</summary><div class="gone-more">' + more + '</div></details></li>';
            }).join('');

            return '<div class="gone-group">' + head + '<ul class="gone-files">' + rows + '</ul></div>';
          }).join('');
        }

        function brokenRefsHtml(n) {
          var refs = (n.meta && n.meta.refs) || null;
          if (!refs) return '';
          var gone = refs.deleted || [], never = refs.unknown || [], out = refs.external || [];
          var total = gone.length + never.length + out.length;
          if (!total) return '';

          var html = '<section><h3>Broken references <span class="muted">' + total + '</span></h3>'
            + '<p class="lead">Paths this doc names that point at nothing. Every path listed'
            + ' above this section was checked and does resolve.</p>';

          if (gone.length) {
            html += groupHead('Removed from the repo', pluralize(gone.length, 'path'))
              + '<p class="lead">Git has the commit that took each of these out, so the doc is'
              + ' out of date and worth fixing.</p>' + deletedRefsList(gone);
          }
          if (never.length) {
            html += groupHead('Never in this repo', pluralize(never.length, 'path'))
              + '<p class="lead">Nothing by these names is here now, and nothing ever was. Usually'
              + ' another repo\'s tree, or files a plan described and nobody built.</p>'
              + '<ul class="entries">' + never.map(function (p) { return refPath(p); }).join('') + '</ul>';
          }
          if (out.length) {
            html += groupHead('Outside this repo', pluralize(out.length, 'path'))
              + '<p class="lead">Home directories, absolute paths and wildcards. There is nothing'
              + ' here to check them against, so they are listed, not judged.</p>'
              + '<ul class="entries">' + out.map(function (p) { return refPath(p); }).join('') + '</ul>';
          }
          return html + '</section>';
        }

        // ---- module detail ----
        // One place that tells a module's whole story in plain words: what is
        // inside, which screens it owns, what documents it, and what would be
        // affected by a change. Built entirely from the graph, so same graph
        // in, same panel out.

        function pluralize(count, word) { return count + ' ' + word + (count === 1 ? '' : 's'); }

        /**
         * Two-level folder tree over an arbitrary base path and file list - a
         * whole module, or just one of its areas. Nesting instead of repeated
         * path prefixes: each top folder appears once with its subfolders
         * indented under it, and anything deeper folds into its second-level
         * folder.
         */
        function buildFolderTree(basePath, srcFiles) {
          var baseLen = basePath.length + 1;
          var files = srcFiles.slice()
            .sort(function (a, b) { return a.path < b.path ? -1 : 1; });
          var rootFiles = [], top = {};
          files.forEach(function (f) {
            var rest = f.path.slice(baseLen);
            var slash = rest.indexOf('/');
            if (slash === -1) { rootFiles.push(f); return; }
            var key = rest.slice(0, slash);
            var g = top[key] || (top[key] = { files: [], sub: {} });
            var rest2 = rest.slice(slash + 1);
            var slash2 = rest2.indexOf('/');
            if (slash2 === -1) { g.files.push(f); return; }
            var k2 = rest2.slice(0, slash2);
            (g.sub[k2] || (g.sub[k2] = [])).push(f);
          });
          var groups = Object.keys(top).sort().map(function (key) {
            var g = top[key];
            var subs = Object.keys(g.sub).sort().map(function (k2) {
              return { label: k2, files: g.sub[k2] };
            });
            var total = g.files.length;
            subs.forEach(function (s) { total += s.files.length; });
            return { label: key, files: g.files, subs: subs, total: total };
          });
          return { rootFiles: rootFiles, groups: groups, total: files.length };
        }

        /** A file's path relative to a base path - what actually names it. */
        function relIn(basePath, f) { return f.path.slice(basePath.length + 1); }

        /**
         * Deeper files fold up into their second-level folder, so a folder can
         * hold two files called index.ts from different sub-folders. Show the
         * remaining path for those; a plain name for the ones directly inside.
         */
        function fileList(files, base) {
          return '<ul>' + files.map(function (f) {
            var label = null;
            if (base && f.path.indexOf(base + '/') === 0) {
              var rest = f.path.slice(base.length + 1);
              if (rest.indexOf('/') !== -1) label = rest;
            }
            return '<li>' + nodeLink(f, '', label) + '</li>';
          }).join('') + '</ul>';
        }
        function folderDetails(label, count, inner, open) {
          return '<details' + (open ? ' open' : '') + '><summary><span class="folder">' + esc(label)
            + '</span> <span class="muted">' + pluralize(count, 'file') + '</span></summary>' + inner + '</details>';
        }

        /** Every doc about this module: owned by it, describing it, or describing a file inside it. */
        function moduleDocs(mod) {
          var seen = {}, out = [];
          function add(d) { if (d && d.type === 'doc' && !seen[d.id]) { seen[d.id] = 1; out.push(d); } }
          GRAPH.nodes.forEach(function (x) { if (x.type === 'doc' && x.module === mod.module) add(x); });
          related(mod.id, 'documents', 'in').forEach(function (r) { add(r.node); });
          (moduleFiles[mod.module] || []).forEach(function (f) {
            related(f.id, 'documents', 'in').forEach(function (r) { add(r.node); });
          });
          return out.sort(function (a, b) {
            return a.label < b.label ? -1 : a.label > b.label ? 1 : (a.id < b.id ? -1 : 1);
          });
        }

        /**
         * Step screens in the order the user walks them. The extractor writes
         * the sequence down as navigates edges between siblings; following
         * that chain recovers the order the sorted graph file loses.
         */
        function flowOrder(steps) {
          var inSet = {}, next = {}, hasPrev = {};
          steps.forEach(function (s) { inSet[s.id] = s; });
          steps.forEach(function (s) {
            (outgoing[s.id] || []).forEach(function (e) {
              if (e.type === 'navigates' && !e.hierarchy && inSet[e.to]) { next[s.id] = e.to; hasPrev[e.to] = 1; }
            });
          });
          var ordered = [], seen = {};
          function walk(id) {
            while (id && inSet[id] && !seen[id]) { seen[id] = 1; ordered.push(inSet[id]); id = next[id]; }
          }
          steps.forEach(function (s) { if (!hasPrev[s.id]) walk(s.id); });
          steps.forEach(function (s) { walk(s.id); });
          return ordered;
        }

        /**
         * File-level edges crossing an area's own boundary - the "in"/"out"
         * equivalent of a module's related() lookup, but there is no graph node
         * for an area to look up. Built straight from the file-level imports
         * indexes, excluding edges that stay inside the area (that's the area's
         * own internal wiring, not its blast radius).
         */
        function areaEdges(area, dir) {
          var inSet = Object.create(null);
          area.files.forEach(function (f) { inSet[f.id] = 1; });
          var rows = Object.create(null);
          area.files.forEach(function (f) {
            ((dir === 'in' ? incoming[f.id] : outgoing[f.id]) || []).forEach(function (e) {
              if (e.type !== 'imports') return;
              var otherId = dir === 'in' ? e.from : e.to;
              if (inSet[otherId]) return;
              var other = nodeById[otherId];
              if (!other) return;
              var r = rows[otherId] || (rows[otherId] = { node: other, weight: 0 });
              r.weight += e.weight || 1;
            });
          });
          return Object.keys(rows).map(function (k) { return rows[k]; });
        }

        /** Collapse file-level rows into one row per module, summing weight - the
         * same {node, weight} shape related() returns, so the module-level row
         * renderer needs no changes to draw either. */
        function groupFilesByModule(rows) {
          var byMod = Object.create(null), order = [];
          rows.forEach(function (r) {
            var m = r.node.module;
            if (!byMod[m]) { byMod[m] = { node: nodeById['module:' + m], weight: 0 }; order.push(m); }
            byMod[m].weight += r.weight;
          });
          return order.map(function (m) { return byMod[m]; }).filter(function (r) { return r.node; })
            .sort(function (a, b) { return b.weight - a.weight || (a.node.label < b.node.label ? -1 : 1); });
        }

        /** Whether an imported file is the kind of thing "shared components &
         * hooks" is asking about - its own folder name, or the whole module
         * it lives in, says so. Anything else (utils, config, store...) is
         * still a real dependency, just not what that section is naming. */
        function sharedFileKind(node) {
          var p = '/' + (node.path || '') + '/';
          if (p.indexOf('/hooks/') !== -1 || node.module === 'hooks') return 'hook';
          if (p.indexOf('/components/') !== -1 || node.module === 'components') return 'component';
          return null;
        }

        /** File-level cross-boundary rows (from areaEdges), rolled up one
         * group per source module - same shape groupFilesByModule produces,
         * but keeping the individual files instead of collapsing them, since
         * "which components" is the whole point of this section. */
        function groupSharedFiles(rows) {
          var byMod = Object.create(null), order = [];
          rows.forEach(function (r) {
            var m = r.node.module;
            if (!byMod[m]) { byMod[m] = { mod: m, node: nodeById['module:' + m], files: [], weight: 0 }; order.push(m); }
            byMod[m].files.push(r);
            byMod[m].weight += r.weight;
          });
          order.forEach(function (m) {
            byMod[m].files.sort(function (a, b) {
              return (b.weight - a.weight) || (a.node.label < b.node.label ? -1 : 1);
            });
          });
          return order.map(function (m) { return byMod[m]; })
            .sort(function (a, b) { return b.weight - a.weight || (a.mod < b.mod ? -1 : 1); });
        }

        /** Everything detailHtml needs, gathered up front so the same builder
         * can describe a whole module or just one of its areas. */
        function moduleDetailScope(n) {
          var slug = n.module;
          return {
            slug: slug, areaKey: null, basePath: n.path, modPath: n.path,
            files: moduleFiles[slug] || [],
            screens: GRAPH.nodes.filter(function (x) { return x.type === 'screen' && x.module === slug; }),
            docs: moduleDocs(n),
            areas: subAreas(slug),
            fanIn: related(n.id, 'imports', 'in'),
            fanOut: related(n.id, 'imports', 'out'),
            inModuleIn: [], inModuleOut: [],
          };
        }
        function areaDetailScope(mod, area) {
          var slug = mod.module;
          var edgesIn = areaEdges(area, 'in');
          var edgesOut = areaEdges(area, 'out');
          var pool = moduleDocs(mod);
          return {
            slug: slug, areaKey: area.key, basePath: area.prefix.slice(0, -1), modPath: mod.path,
            files: area.files,
            screens: GRAPH.nodes.filter(function (x) { return x.type === 'screen' && areaOf(slug, x.path) === area; }),
            docs: pool.filter(function (d) { return areaOf(slug, d.path) === area; }),
            areas: [],
            fanIn: groupFilesByModule(edgesIn.filter(function (r) { return r.node.module !== slug; })),
            fanOut: groupFilesByModule(edgesOut.filter(function (r) { return r.node.module !== slug; })),
            inModuleIn: edgesIn.filter(function (r) { return r.node.module === slug; }),
            inModuleOut: edgesOut.filter(function (r) { return r.node.module === slug; }),
          };
        }

        /** One concern per tab instead of a stack of collapsed rows: the reader
         * picks a question at the top and the full width below answers it. The
         * first tab is the one that is open on arrival. Tabs with no body are
         * dropped, so a module with no screens never shows an empty Screens.
         *
         * Safe to nest: selectTab scopes its lookups to one .tabs level, so a
         * tab bar inside a tab pane (the Docs list groups) works on its own. */
        function tabsHtml(tabs) {
          var live = tabs.filter(function (t) { return t && t.body; });
          if (!live.length) return '';
          var bar = live.map(function (t, i) {
            return '<button type="button" class="tab' + (t.cls ? ' ' + t.cls : '') + '" role="tab"'
              + ' data-tab="' + esc(t.id) + '" aria-selected="' + (i === 0 ? 'true' : 'false') + '">' + t.label
              + (t.count != null ? ' <span class="muted">' + t.count + '</span>' : '') + '</button>';
          }).join('');
          var panes = live.map(function (t, i) {
            return '<div class="tab-pane" role="tabpanel" data-tab-pane="' + esc(t.id) + '"'
              + (i === 0 ? '' : ' hidden') + '>' + t.body + '</div>';
          }).join('');
          return '<div class="tabs"><div class="tab-bar" role="tablist">' + bar + '</div>' + panes + '</div>';
        }

        /** A titled block inside a tab - what a collapsible row looked like
         * once it was open, minus the opening. */
        function paneSection(title, count, bodyHtml) {
          return '<section><h3>' + title
            + (count != null ? ' <span class="muted">' + count + '</span>' : '') + '</h3>'
            + bodyHtml + '</section>';
        }

        /** Open a module's full page with a named tab already showing - what
         * a cross-link from elsewhere in the map wants, rather than dropping
         * the reader on Overview to hunt for the tab themselves. */
        function openModuleTab(slug, tabId) {
          if (!nodeById['module:' + slug]) return;
          openPanel('module:' + slug);
          var btn = detailPage.querySelector('.tab-bar [data-tab="' + tabId + '"]');
          if (btn) selectTab(btn);
          detailPage.scrollTop = 0;
        }

        function selectTab(btn) {
          var wrap = btn.closest('.tabs');
          if (!wrap) return;
          var id = btn.getAttribute('data-tab');
          // `:scope >` keeps a nested tab bar from touching its parent's tabs
          // (or the other way round) - each .tabs owns only its direct children.
          var i, btns = wrap.querySelectorAll(':scope > .tab-bar > .tab');
          for (i = 0; i < btns.length; i++) {
            btns[i].setAttribute('aria-selected', btns[i] === btn ? 'true' : 'false');
          }
          var panes = wrap.querySelectorAll(':scope > [data-tab-pane]');
          for (i = 0; i < panes.length; i++) {
            panes[i].hidden = panes[i].getAttribute('data-tab-pane') !== id;
          }
          mountAgentMaps(wrap);
        }

        /** How many of a doc list are stale - one function so the glance chip
         * and the Docs section prose can never disagree about the count. */
        function docStats(docs) {
          var stale = 0;
          docs.forEach(function (d) { if (d.meta && d.meta.stale) stale++; });
          return { total: docs.length, stale: stale };
        }

        /** Same fan-in number changeSentence() below turns into a sentence -
         * three plain tiers rather than a raw import count. */
        function riskTier(fanInCount) {
          if (!fanInCount) return { label: 'None', cls: 'good' };
          if (fanInCount <= 5) return { label: 'Low', cls: 'good' };
          if (fanInCount <= 15) return { label: 'Medium', cls: 'warn' };
          return { label: 'High', cls: 'bad' };
        }

        /** The plain-English version of the same tiers, free and instant -
         * shown in the Risk modal before anyone hits the AI generate button. */
        function riskTierMeaning(fanInCount) {
          if (!fanInCount) {
            return 'No other module imports code from here, so a change is very unlikely to affect anything outside it.';
          }
          if (fanInCount <= 5) {
            return 'A handful of other modules import from here. A change could ripple into a few places - worth a '
              + 'quick check of who calls in before editing.';
          }
          if (fanInCount <= 15) {
            return 'A good number of other modules import from here. Changes are fairly likely to affect other parts '
              + 'of the app, so review call sites before editing.';
          }
          return 'This is one of the more heavily depended-on parts of the app. A change here can ripple widely, so '
            + 'treat edits with extra care.';
        }

        /** Keyed by module slug (or "slug/area" for an area scope) so the Risk
         * modal can look up the numbers behind whichever chip was clicked,
         * without threading node objects through HTML data attributes. */
        var riskContexts = Object.create(null);

        /** The 3-second answer, before any section below is opened: how big,
         * how risky to touch, how documented. */
        function chipsHtml(scope) {
          var tier = riskTier(scope.fanIn.length);
          var docs = docStats(scope.docs);
          var riskKey = scope.areaKey ? scope.slug + '/' + scope.areaKey : scope.slug;
          riskContexts[riskKey] = {
            label: scope.areaKey ? scope.areaKey + '/ area of ' + scope.slug : scope.slug,
            tier: tier,
            fanInCount: scope.fanIn.length,
            fanInNames: scope.fanIn.map(function (r) { return r.node.label; }),
            fileCount: scope.files.length,
          };
          var chips = [];
          chips.push('<div class="chip"><span class="dot"></span><span class="muted">Size</span> <b>'
            + pluralize(scope.files.length, 'file') + '</b>'
            + (scope.screens.length ? ' <span class="muted">&middot; ' + pluralize(scope.screens.length, 'screen') + '</span>' : '')
            + '</div>');
          chips.push('<button type="button" class="chip ' + tier.cls + ' explainable" data-explain-risk="' + esc(riskKey) + '" '
            + 'title="Click for what this means"><span class="dot"></span><span class="muted">Risk</span> <b>'
            + tier.label + '</b>'
            + (scope.fanIn.length
              ? ' <span class="muted">&middot; ' + pluralize(scope.fanIn.length, 'module')
                + ' depend' + (scope.fanIn.length === 1 ? 's' : '') + ' on this</span>'
              : '')
            + '</button>');
          // The doc count is already on the Docs tab; a chip here only earns its
          // place when it is flagging something wrong - docs that have gone stale.
          if (docs.stale) {
            chips.push('<div class="chip bad"><span class="dot"></span><span class="muted">Docs</span> <b>'
              + pluralize(docs.stale, 'doc') + ' stale</b></div>');
          }
          return '<div class="chips">' + chips.join('') + '</div>';
        }

        function detailHtml(scope) {
          var slug = scope.slug, isArea = !!scope.areaKey;
          var boundary = isArea ? esc(scope.areaKey) + '/' : 'this module';
          var tree = buildFolderTree(scope.basePath, scope.files);
          var risky = scope.files.filter(function (f) { return f.meta && f.meta.fanIn > 0; })
            .sort(function (a, b) { return (b.meta.fanIn || 0) - (a.meta.fanIn || 0) || (a.path < b.path ? -1 : 1); })
            .slice(0, 5);

          // Screens split by sub-area first, then by flow versus standalone
          // inside each. Without the first split, an onboarding flow and the
          // KYC pages read as one undifferentiated pile of 14 screens.
          function bucketScreens(list) {
            var flows = {}, plain = [];
            list.forEach(function (s) {
              if (s.meta && s.meta.navigatorType === 'flow' && s.meta.parent) {
                (flows[s.meta.parent] || (flows[s.meta.parent] = [])).push(s);
              } else plain.push(s);
            });
            var keys = Object.keys(flows).sort();
            var steps = 0, owner = {};
            keys.forEach(function (k) {
              steps += flows[k].length;
              owner['screen:' + k] = owner['route:' + k] = 1;
            });
            // The screen that runs a flow already heads its own step list; it is
            // not also a standalone page sitting next to it.
            plain = plain.filter(function (s) { return !owner[s.id]; });
            return { flows: flows, flowKeys: keys, plain: plain, stepTotal: steps };
          }

          var screenGroups = [];
          if (scope.areas.length) {
            scope.areas.forEach(function (a) {
              var inArea = scope.screens.filter(function (x) { return areaOf(slug, x.path) === a; });
              if (inArea.length) screenGroups.push({ label: a.key + '/', screens: inArea });
            });
            var rest = scope.screens.filter(function (x) { return !areaOf(slug, x.path); });
            if (rest.length) screenGroups.push({ label: 'elsewhere in the module', screens: rest });
          } else if (scope.screens.length) {
            screenGroups.push({ label: null, screens: scope.screens });
          }

          var all = bucketScreens(scope.screens);

          function itemWithSummary(node2, chip) {
            return '<li><div class="entry-head">' + nodeLink(node2) + tag(chip) + '</div>'
              + (node2.summary ? '<div class="sub">' + mdInline(node2.summary) + '</div>' : '') + '</li>';
          }

          /** The "does a change here ripple out" sentence - shared by the top
           * summary and the blast-radius section below, so the two never drift
           * apart into two different numbers for the same question. */
          function changeSentence() {
            if (!isArea) {
              return scope.fanIn.length
                ? pluralize(scope.fanIn.length, 'other module') + ' use' + (scope.fanIn.length === 1 ? 's' : '')
                  + ' code from here, so a change can ripple beyond this module.'
                : 'No other module uses code from here, so changes stay local.';
            }
            if (scope.fanIn.length) {
              return pluralize(scope.fanIn.length, 'other module') + ' use' + (scope.fanIn.length === 1 ? 's' : '')
                + ' code from ' + boundary + ' directly.';
            }
            if (scope.inModuleIn.length) {
              return 'No module outside ' + esc(slug) + ' imports from ' + boundary + ' directly, though '
                + pluralize(scope.inModuleIn.length, 'file') + ' elsewhere in the module '
                + (scope.inModuleIn.length === 1 ? 'does' : 'do') + '.';
            }
            return 'Nothing outside ' + boundary + ' imports from it, so changes stay local.';
          }

          // The glance chips just above already carry size and how many modules
          // depend on this; the summary adds only what they leave out - which
          // way this module leans on others, and the one file to be careful with.
          // The full "who feels a change" picture lives in the Overview tab.
          var story = [];
          if (scope.fanOut.length) {
            story.push('It relies on code from ' + pluralize(scope.fanOut.length, 'other module') + '.');
          }
          if (risky.length) {
            story.push('The riskiest file to touch is ' + nodeLink(risky[0]) + ', used by '
              + pluralize(risky[0].meta.fanIn, 'file') + '.');
          }
          var html = story.length ? '<p class="summary">' + story.join(' ') + '</p>' : '';

          var mod = nodeById['module:' + slug];
          var tabs = [];

          // ---- Overview: the framing that is true no matter which tab you
          // came for - what the module is split into, and who feels a change.
          var overview = moduleAiCta(isArea ? scope.areaKey + '/ area of ' + slug : slug, scope);

          // The folders on disk already name the sub-journeys inside a module.
          // Say them out loud rather than flattening everything into one bag.
          if (scope.areas.length) {
            var areaBody = '<p class="lead">This module is split into ' + pluralize(scope.areas.length, 'area')
              + ' that sit side by side on disk. Each is its own little module, with its own'
              + ' components, pages and services:</p>';
            areaBody += rowList(scope.areas.map(function (a) {
              var aScreens = scope.screens.filter(function (x) { return areaOf(slug, x.path) === a; });
              var bits = [pluralize(a.files.length, 'file')];
              if (aScreens.length) bits.push(pluralize(aScreens.length, 'screen'));
              return row('<button class="node-link" data-area="' + esc(slug) + '/' + esc(a.key)
                + '"><span class="folder">' + esc(a.key) + '/</span></button>', andList(bits));
            }));
            overview += paneSection('Areas', scope.areas.length, areaBody);
          }

          // Three different questions - who feels a change, what can break this,
          // what is fragile inside - so three headed blocks, not one long run.
          function importRows(list) {
            return rowList(list.map(function (r) {
              return row(nodeLink(r.node), pluralize(r.weight || 1, 'import'));
            }));
          }
          function fileRows(list) {
            return rowList(list.map(function (r) {
              return row(nodeLink(r.node, '', relIn(scope.modPath, r.node)), pluralize(r.weight || 1, 'import'));
            }));
          }
          var changeBody = groupHead('Modules that would feel it',
            scope.fanIn.length ? pluralize(scope.fanIn.length, 'module') : '');
          changeBody += '<p class="lead">' + changeSentence() + '</p>';
          if (scope.fanIn.length) changeBody += importRows(scope.fanIn);
          if (isArea && scope.inModuleIn.length) {
            changeBody += groupHead('Files elsewhere in the module that lean on this', pluralize(scope.inModuleIn.length, 'file'))
              + fileRows(scope.inModuleIn);
          }
          if (scope.fanOut.length) {
            changeBody += groupHead('What ' + boundary + ' leans on', pluralize(scope.fanOut.length, 'module'))
              + '<p class="lead">A change over there can break things here:</p>'
              + importRows(scope.fanOut);
          }
          if (isArea && scope.inModuleOut.length) {
            changeBody += groupHead('Files elsewhere in the module it leans on', pluralize(scope.inModuleOut.length, 'file'))
              + fileRows(scope.inModuleOut);
          }
          if (risky.length) {
            changeBody += groupHead('Riskiest files inside', pluralize(risky.length, 'file'))
              + '<p class="lead">The most leaned-on files - touch these with extra care:</p>'
              + rowList(risky.map(function (f) {
                  // Bare filenames repeat (three index.ts tell you nothing);
                  // the path inside identifies the file.
                  return row(nodeLink(f, '', relIn(scope.basePath, f)), 'used by ' + pluralize(f.meta.fanIn, 'file'));
                }));
          }
          overview += paneSection('If you change ' + boundary, null, changeBody);
          tabs.push({ id: 'overview', label: 'Overview', body: overview });

          // ---- Screens: the part of the module a person can actually see, so
          // it is the first tab after the framing. Name, then what it is for.
          function screenShape(b) {
            var parts = [];
            if (b.flowKeys.length === 1) parts.push('a guided flow of ' + pluralize(b.stepTotal, 'step'));
            if (b.flowKeys.length > 1) {
              parts.push(b.flowKeys.length + ' guided flows totalling ' + pluralize(b.stepTotal, 'step'));
            }
            if (b.plain.length) parts.push(pluralize(b.plain.length, 'standalone page'));
            return parts.join(', plus ');
          }

          if (scope.screens.length) {
            var screensBody = '<p class="lead">These are the ' + pluralize(scope.screens.length, 'screen')
              + ' ' + (isArea ? 'this area' : 'this module') + ' puts in front of a person - '
              + screenShape(all)
              + (screenGroups.length > 1 ? ', split across ' + pluralize(screenGroups.length, 'area') : '')
              + '. Open any of them to see what it is wired to.</p>';
            screenGroups.forEach(function (g) {
              var b = bucketScreens(g.screens);
              if (g.label) {
                // Plain screen counts here, so the areas visibly add up to the
                // number in the heading; the shape is described above.
                screensBody += groupHead('<span class="folder">' + esc(g.label) + '</span>',
                  pluralize(g.screens.length, 'screen'));
              }
              b.flowKeys.forEach(function (parent) {
                var parentNode = nodeById['screen:' + parent] || nodeById['route:' + parent];
                screensBody += '<div class="lead">' + (parentNode ? nodeLink(parentNode) : esc(parent))
                  + ' walks the user through these steps, in order:</div><ol class="steps">'
                  + flowOrder(b.flows[parent]).map(function (s) { return itemWithSummary(s); }).join('')
                  + '</ol>';
              });
              if (b.plain.length) {
                screensBody += '<ul class="entries">' + b.plain.map(function (s) {
                  return itemWithSummary(s, s.meta && s.meta.navigatorType);
                }).join('') + '</ul>';
              }
            });
            tabs.push({ id: 'screens', label: 'Screens', count: scope.screens.length, body: screensBody });
          }

          // ---- Docs: the agent-context map first - what an agent reads
          // before it edits anything here - then every doc, split by what it
          // is for so a stale spec and a rule file don't sit in one pile.
          if (scope.docs.length) {
            var docLabel = isArea ? scope.areaKey + '/ in ' + slug : slug;
            var docsBody = (agentContextSection(scope, docLabel) || '')
              + '<p class="lead">What is written down about ' + (isArea ? 'this area' : 'this module')
              + '. Pick a tab for what you are after - what needs fixing, the rules, the specs.</p>'
              + docGroupTabs(scope.docs);
            tabs.push({ id: 'docs', label: 'Docs', count: scope.docs.length, body: docsBody });
          }

          // ---- Shared components & hooks: what this module borrows from the
          // rest of the codebase, one file at a time - not just "10 other
          // modules", but which components and hooks specifically, since that
          // is what a reader would go and open next.
          var sharedRows = areaEdges({ files: scope.files }, 'out');
          if (sharedRows.length) {
            var sharedGroups = groupSharedFiles(sharedRows);
            var compCount = 0, hookCount = 0;
            sharedRows.forEach(function (r) {
              var k = sharedFileKind(r.node);
              if (k === 'component') compCount++; else if (k === 'hook') hookCount++;
            });
            var sharedBits = [];
            if (compCount) sharedBits.push(pluralize(compCount, 'component'));
            if (hookCount) sharedBits.push(pluralize(hookCount, 'hook'));
            var sharedLead = 'What ' + (isArea ? 'this area' : 'this module') + ' pulls in from elsewhere: '
              + pluralize(sharedRows.length, 'file') + ' across ' + pluralize(sharedGroups.length, 'other module')
              + (sharedBits.length ? ', including ' + andList(sharedBits) : '') + '.';
            var sharedBody = '<p class="lead">' + sharedLead + '</p>';
            sharedGroups.forEach(function (g) {
              sharedBody += groupHead(g.node ? nodeLink(g.node) : esc(g.mod), pluralize(g.files.length, 'file'));
              sharedBody += rowList(g.files.map(function (r) {
                var k = sharedFileKind(r.node);
                return row(nodeLink(r.node) + tag(k), pluralize(r.weight || 1, 'import'));
              }));
            });
            tabs.push({
              id: 'shared', label: 'Shared components & hooks',
              count: sharedRows.length, body: sharedBody,
            });
          }

          // ---- Files: real, but a reader opens this page to learn what a
          // module does, not to browse a folder listing. It goes dead last.
          if (scope.files.length) {
            var filesLead = 'The files that make up ' + (isArea ? 'this area' : 'this module')
              + ', grouped as the folders sit on disk.';
            if (scope.areas.length) {
              filesLead = 'The top folders here are the areas above - '
                + andList(scope.areas.map(function (a) { return a.key + '/'; }))
                + ' - each with its own layers inside.';
            } else if (tree.groups.length > 1) {
              var biggest = tree.groups[0];
              tree.groups.forEach(function (g) { if (g.total > biggest.total) biggest = g; });
              if (biggest.total >= tree.total * 0.4) {
                filesLead += ' Most of it sits in ' + esc(biggest.label) + '/ ('
                  + pluralize(biggest.total, 'file') + ').';
              }
            }
            var filesBody = '<p class="lead">' + filesLead + '</p>';
            // components/ and hooks/ are what a reader is asking for by name;
            // put them first, then the rest in the order they sit on disk.
            var pinned = ['components', 'hooks'];
            var orderedGroups = tree.groups.slice().sort(function (a, b) {
              var pa = pinned.indexOf(a.label.toLowerCase());
              var pb = pinned.indexOf(b.label.toLowerCase());
              if (pa === -1 && pb === -1) return 0;
              if (pa === -1) return 1;
              if (pb === -1) return -1;
              return pa - pb;
            });
            orderedGroups.forEach(function (g) {
              var gBase = scope.basePath + '/' + g.label;
              var inner = g.subs.map(function (s) {
                return folderDetails(s.label + '/', s.files.length, fileList(s.files, gBase + '/' + s.label));
              }).join('') + (g.files.length ? fileList(g.files, gBase) : '');
              filesBody += folderDetails(g.label + '/', g.total, inner, tree.groups.length <= 2);
            });
            if (tree.rootFiles.length) {
              filesBody += folderDetails('module root', tree.rootFiles.length, fileList(tree.rootFiles, scope.basePath));
            }
            tabs.push({ id: 'files', label: 'Files', count: scope.files.length, body: filesBody });
          }

          return html + tabsHtml(tabs);
        }

        // A guardrail is stored either as a bare quoted string (older graphs) or
        // as { quote, plain } once extract-docs has written a plain-English
        // gloss for it. Both collapse to the same shape here.
        function guardParts(g) {
          if (g && typeof g === 'object') return { quote: g.quote || '', plain: g.plain || '' };
          return { quote: String(g == null ? '' : g), plain: '' };
        }
        /** True when a doc's verbatim rule is a short condition label - a
         * gerund phrase or code-ish fragment ("Adding a new dependency",
         * "otp.length === otpLength") rather than a full prose sentence. Those
         * earn a place under the gloss because they pin down exactly what
         * trips the rule; a multi-sentence paragraph does not, and repeating
         * it at full size is the noise this check exists to avoid. */
        function terseCondition(quote) {
          if (!quote) return false;
          if (quote.length > 90) return false;
          if (/[.!?]["')]?\s/.test(quote)) return false; // an internal sentence break -> prose
          return quote.split(/\s+/).length <= 13;
        }
        /** The rule list a doc carries under a "non-negotiable / never / must
         * not" heading. Each rule leads with its plain-English meaning; the
         * doc's own words follow only when they are a terse condition worth
         * pinning down. Rules with no gloss show their wording verbatim. */
        function guardListHtml(guards) {
          var parts = guards.map(guardParts);
          var glossed = parts.some(function (p) { return p.plain; });
          var lead = glossed
            ? 'What each rule means, in plain English.'
            : 'Copied word for word from the doc - each line is a condition it says must hold for code in this module.';
          return '<p class="sub guard-lead">' + lead + '</p>'
            + '<div class="guard-list">'
            + parts.map(function (p) {
                var ico = '<span class="guard-ico" aria-hidden="true"></span>';
                if (p.plain) {
                  var cond = terseCondition(p.quote)
                    ? '<span class="guard-cond">' + guardText(p.quote) + '</span>'
                    : '';
                  return '<div class="guard">' + ico + '<div class="guard-body">'
                    + '<div class="guard-plain"' + (cond ? '' : ' title="' + esc(p.quote) + '"') + '>'
                    + guardText(p.plain) + '</div>'
                    + cond
                    + '</div></div>';
                }
                return '<div class="guard">' + ico
                  + '<div class="guard-body"><div class="guard-quote solo">' + guardText(p.quote) + '</div></div></div>';
              }).join('')
            + '</div>';
        }

        function docItem(d) {
          var guards = (d.meta && d.meta.guardrails) || [];
          // No path, no kind chip - the tab already says what kind of doc this
          // is and which module it belongs to, so both were just noise.
          var out = '<li><div class="entry-head">' + nodeLink(d) + '</div>';
          if (d.summary) out += '<div class="sub">' + mdInline(d.summary) + '</div>';
          if (guards.length) {
            out += '<details><summary class="muted">'
              + pluralize(guards.length, 'guardrail') + ' an agent must keep</summary>'
              + guardListHtml(guards)
              + '</details>';
          }
          return out + '</li>';
        }

        /** One entry in the "Needs your attention" tab. Same hierarchy as every
         * other doc row - filename first as the anchor, one-line description
         * quiet beneath it - with the count of missing files stated once on the
         * right and the list itself one click away, grouped by folder. */
        function attentionDocItem(d) {
          var gone = (d.meta && d.meta.refs && d.meta.refs.deleted) || [];
          var guards = (d.meta && d.meta.guardrails) || [];

          var folders = Object.create(null);
          gone.forEach(function (g) {
            var slash = g.path.lastIndexOf('/');
            folders[slash === -1 ? '.' : g.path.slice(0, slash)] = 1;
          });
          var nFolders = Object.keys(folders).length;
          var status = pluralize(gone.length, 'missing file')
            + (nFolders > 1 ? ' in ' + nFolders + ' folders' : '');

          var out = '<li class="att"><div class="att-head">'
            + '<button class="node-link att-title" data-goto="' + esc(d.id) + '">'
            + esc(d.label) + '</button>'
            + (gone.length ? '<span class="att-status">' + status + '</span>' : '')
            + '</div>';
          if (d.summary) {
            out += '<div class="sub">' + mdInline(d.summary) + '</div>';
          }
          if (gone.length) {
            out += '<details class="att-detail"><summary>'
              + (gone.length === 1 ? 'Show the file git removed' : 'Show all ' + gone.length + ' removed files')
              + '</summary>' + deletedRefsList(gone) + '</details>';
          }
          if (guards.length) {
            out += '<details class="att-detail"><summary>' + pluralize(guards.length, 'guardrail')
              + ' in this file</summary>' + guardListHtml(guards) + '</details>';
          }
          return out + '</li>';
        }

        /** The Docs list split by why a reader opens each doc, rather than left
         * in one alphabetical pile. Health first: a doc that still names files
         * git has deleted needs a look before anything it says can be trusted.
         * Then the three things module docs are actually for - rules to obey,
         * behaviour to read up on, facts to look up. Each doc lands in exactly
         * one group; a stale rule file shows under "Needs your attention", with
         * its rules still one click away on the entry. */
        function docPurposeGroups(docs) {
          var by = { attention: [], guardrails: [], specs: [], reference: [], other: [] };
          docs.forEach(function (d) {
            if (d.meta && d.meta.stale) { by.attention.push(d); return; }
            var k = (d.meta && d.meta.docKind) || 'OTHER';
            var hasGuards = d.meta && d.meta.guardrails && d.meta.guardrails.length;
            // The Guardrails tab is for rules, not just for rule-files. A spec
            // that carries its own "non-negotiable / never / must not" bullets
            // belongs here too - the whole entry moves, disclosure and all, and
            // is not repeated back under Specs & Notes.
            if (k === 'AGENTS' || hasGuards) by.guardrails.push(d);
            else if (k === 'SPEC' || k === 'MAP') by.specs.push(d);
            else if (k === 'REFERENCE') by.reference.push(d);
            else by.other.push(d);
          });
          // Rule files shallowest-path first - the same order the context map
          // shows them in, repo-wide AGENTS above a module's own.
          by.guardrails.sort(function (a, b) {
            return a.path.split('/').length - b.path.split('/').length || (a.label < b.label ? -1 : 1);
          });
          return [
            { key: 'attention', title: 'Needs your attention', tone: 'bad',
              blurb: 'Each of these still points at files git has removed. Check what it claims before you rely on it.' },
            { key: 'guardrails', title: 'Guardrails for this module', tone: 'warn',
              blurb: 'Rules an agent has to follow when it works here.' },
            { key: 'specs', title: 'Specs & Notes', tone: '',
              blurb: 'How a feature or flow is meant to behave - read for context before editing.' },
            { key: 'reference', title: 'Reference', tone: '',
              blurb: 'Lookup material: tables, inventories, API shapes.' },
            { key: 'other', title: 'Other docs', tone: '',
              blurb: '' },
          ].map(function (g) { g.docs = by[g.key]; return g; })
            .filter(function (g) { return g.docs.length; });
        }

        /** The grouped Docs list - shared by the module Docs tab and a doc
         * cluster's own page, so the two can never drift apart. Each group is
         * its own side-by-side tab: the doc lists run long and vertical, and a
         * reader after "the specs" should not have to scroll past every rule
         * file to reach them. One group only -> a plain list, no tab bar. */
        function docGroupTabs(docs) {
          var groups = docPurposeGroups(docs);
          function list(ds, key) {
            if (key === 'attention') {
              return '<ul class="entries att-list">' + ds.map(attentionDocItem).join('') + '</ul>';
            }
            return '<ul class="entries">' + ds.map(docItem).join('') + '</ul>';
          }
          if (groups.length <= 1) {
            return groups.length ? list(groups[0].docs, groups[0].key) : list(docs, null);
          }
          return tabsHtml(groups.map(function (g) {
            return {
              id: 'docgrp-' + g.key, label: esc(g.title), count: g.docs.length,
              cls: g.tone === 'bad' ? 'tab-bad' : '',
              body: (g.blurb ? '<p class="lead">' + g.blurb + '</p>' : '') + list(g.docs, g.key),
            };
          }));
        }

        /** Rule/memory files (AGENTS docKind) for a doc's own module, other than
         * the doc itself - context worth an agent's attention even though they
         * are not the thing being read. */
        /** A module page is a generated overview - it does not read prose the
         * way a person does, so it stops well short of a full explanation.
         * This hands a reader who wants more a ready-made prompt: send an
         * agent to everything the page already found (docs, screens, source)
         * and have it come back with the deeper story. */
        function moduleAgentPrompt(label, scope) {
          var lines = [
            'I am looking at ' + label + ' in this codebase and want to understand it in more depth than a '
              + 'generated overview can give. Read through its source files, screens and documentation, and '
              + 'explain in plain English what it does, why it is structured the way it is, and how its pieces '
              + 'fit together end to end.',
            '',
            'Where to look:',
            '- Source: ' + scope.basePath,
          ];
          if (scope.docs.length) {
            lines.push('- Docs:');
            scope.docs.forEach(function (d) { lines.push('  - ' + d.path); });
          }
          if (scope.screens.length) {
            lines.push('- Screens the user sees: ' + scope.screens.map(function (s) { return s.label; }).join(', '));
          }
          lines.push('', 'Ask me for anything else you need before you start.');
          return lines.join('\n');
        }

        function moduleAiCta(label, scope) {
          var prompt = moduleAgentPrompt(label, scope);
          return '<div class="ai-cta"><h3>Want to know more?</h3>'
            + '<p class="lead">This page is generated straight from the code - a starting point, not '
            + 'the full story. Hand this prompt to an AI coding agent and it will read through the docs, '
            + 'screens and source behind these tabs and explain ' + esc(label) + ' the way a teammate would.</p>'
            + '<div class="panel-actions"><button class="ghost copy-prompt" data-copy="module-ai-prompt-box">'
            + 'Copy prompt for an AI agent</button></div>'
            + '<pre class="prompt-box" id="module-ai-prompt-box">' + esc(prompt) + '</pre>'
            + '</div>';
        }

        /** Break a label onto at most maxLines at word boundaries - SVG text
         * does not wrap on its own. Doc filenames are frequently one long
         * unbroken word, so an over-long word is split rather than allowed to
         * run out of its card. */
        function wrapLabel(text, maxChars, maxLines) {
          // Break opportunities, in order of preference: spaces, then after an
          // underscore, then a hard chop. Doc filenames are usually one long
          // SCREAMING_SNAKE token, and chopping those mid-word reads badly.
          var tokens = [];
          (text || '').split(/\s+/).filter(Boolean).forEach(function (w, wi) {
            var chunk = '', raw = [];
            for (var i = 0; i < w.length; i++) {
              chunk += w[i];
              if (w[i] === '_') { raw.push(chunk); chunk = ''; }
            }
            if (chunk) raw.push(chunk);
            raw.forEach(function (piece, pi) {
              while (piece.length > maxChars) {
                tokens.push({ text: piece.slice(0, maxChars), space: wi > 0 && pi === 0 && !tokens.length });
                piece = piece.slice(maxChars);
              }
              if (piece) tokens.push({ text: piece, space: wi > 0 && pi === 0 });
            });
          });
          var lines = [], cur = '';
          tokens.forEach(function (t) {
            var candidate = cur ? cur + (t.space ? ' ' : '') + t.text : t.text;
            if (candidate.length > maxChars && cur) { lines.push(cur); cur = t.text; } else { cur = candidate; }
          });
          if (cur) lines.push(cur);
          if (lines.length > maxLines) {
            lines = lines.slice(0, maxLines);
            var last = lines[maxLines - 1];
            lines[maxLines - 1] = last.length > maxChars - 1 ? last.slice(0, maxChars - 1) + '…' : last + '…';
          }
          return lines;
        }

        /**
         * The agent context map: what an AI agent actually has in front of it
         * the moment it is asked to work in this module. Rules that apply to
         * the whole repo, rules written for this module, the specs it should
         * read, the code it would edit, and the shared code it will follow
         * into. Every box is a node the map already resolved - nothing here is
         * inferred, and nothing is generated at open time.
         *
         * Laid out as a whiteboard rather than a graph: reading left to right
         * is reading the agent's own order of operations.
         */
        var AMAP = {
          cardW: 244, cardPadX: 16, lineH: 15, cardPadY: 20, cardMinH: 46,
          cardGap: 14, framePad: 18, frameGap: 62,
          colGap: 168, hubW: 184, hubH: 78,
          maxItems: 4, titleChars: 26, subChars: 30,
        };

        /** One card's text block: the name on top, the quiet second line under
         * it. Cytoscape paints a node label with a single font, so the two are
         * one wrapped string - the height is measured from the line count so a
         * two-line name never runs into the box edge. */
        function amapCardLabel(item) {
          var lines = wrapLabel(item.label || '', AMAP.titleChars, 2);
          if (item.sub) lines = lines.concat(wrapLabel(item.sub, AMAP.subChars, 1));
          return lines;
        }

        function amapCardNode(id, parent, item, i) {
          var lines = amapCardLabel(item);
          var h = Math.max(AMAP.cardMinH, lines.length * AMAP.lineH + AMAP.cardPadY);
          return {
            data: {
              id: id, parent: parent, kind: item.kind || 'card',
              label: lines.join('\n'), w: AMAP.cardW, h: h,
              tw: AMAP.cardW - AMAP.cardPadX * 2,
              goto: item.goto || null,
              tip: item.tip || ((item.label || '') + (item.sub ? ' - ' + item.sub : '')),
              more: item.more || null, idx: i,
            },
            grabbable: false,
          };
        }

        /** The five groups, built only from what the graph already holds. Each
         * frame keeps its *whole* item list - the canvas decides how many to
         * show, so "+N more" can actually open. */
        function agentContextFrames(scope) {
          var repoRules = GRAPH.nodes.filter(function (n) {
            return n.type === 'doc' && !n.module && n.meta && n.meta.docKind === 'AGENTS';
          }).sort(function (a, b) {
            var da = a.path.split('/').length, db = b.path.split('/').length;
            return da - db || (a.path < b.path ? -1 : 1);
          });
          var isRepoWide = Object.create(null);
          repoRules.forEach(function (d) { isRepoWide[d.id] = 1; });
          var modRules = [], modReading = [];
          scope.docs.forEach(function (d) {
            if (isRepoWide[d.id]) return;
            (d.meta && d.meta.docKind === 'AGENTS' ? modRules : modReading).push(d);
          });

          var tree = buildFolderTree(scope.basePath, scope.files);
          // Biggest folders first, but screens lead - they are the part of a
          // module a person can point at.
          var codeItems = tree.groups.slice().sort(function (a, b) { return b.total - a.total; })
            .map(function (g) { return { label: g.label + '/', sub: pluralize(g.total, 'file') }; });
          if (scope.screens.length) {
            codeItems.unshift({ label: pluralize(scope.screens.length, 'screen'), sub: 'the user can see' });
          }

          function docItems(list) {
            return list.map(function (d) {
              return { label: d.label, sub: diaDocWhere(d), goto: d.id };
            });
          }

          var left = [], right = [];
          if (repoRules.length) {
            left.push({
              key: 'repo', title: 'Rules for the whole repo', edge: 'always in context',
              items: docItems(repoRules),
            });
          }
          if (modRules.length) {
            left.push({
              key: 'modrules', title: 'Rules written for this module', edge: 'read first',
              items: docItems(modRules),
            });
          }
          if (modReading.length) {
            left.push({
              key: 'specs', title: 'Specs & Notes it reads', edge: 'read for context',
              items: modReading.map(function (d) {
                return { label: d.label, sub: (d.meta && d.meta.docKind || 'doc').toLowerCase(), goto: d.id };
              }),
            });
          }
          if (codeItems.length) {
            right.push({ key: 'edits', title: 'Code it changes', edge: 'edits', items: codeItems });
          }
          if (scope.fanOut.length) {
            right.push({
              key: 'shared', title: 'Shared code it calls into', edge: 'depends on',
              items: scope.fanOut.map(function (r) {
                return { label: r.node.label, sub: pluralize(r.weight || 1, 'import'), goto: r.node.id };
              }),
            });
          }
          return { left: left, right: right };
        }

        function diaDocWhere(d) {
          var i = d.path.lastIndexOf('/');
          return i === -1 ? 'repo root' : d.path.slice(0, i) + '/';
        }

        /** Turns the frames into cytoscape elements at fixed positions: two
         * columns of framed groups either side of the module, laid out by hand
         * because the reading order (what comes in, the module, what it
         * touches) is the whole point - no force layout would preserve it. */
        function amapElements(frames, hubLabel, hubSub, open) {
          var els = [];
          var cols = [
            { frames: frames.left, side: 'left' },
            { frames: frames.right, side: 'right' },
          ];

          function frameCards(f) {
            var shown = open[f.key] ? f.items.slice() : f.items.slice(0, AMAP.maxItems);
            var hidden = f.items.length - shown.length;
            if (hidden > 0) {
              shown.push({ label: 'Show ' + hidden + ' more', sub: 'of ' + f.items.length + ' in all',
                kind: 'more', more: f.key, tip: 'Open the rest of this group' });
            } else if (open[f.key] && f.items.length > AMAP.maxItems) {
              shown.push({ label: 'Show fewer', sub: '', kind: 'more', more: f.key,
                tip: 'Collapse back to the first ' + AMAP.maxItems });
            }
            return shown;
          }

          function frameH(cards) {
            var h = 0;
            cards.forEach(function (c) {
              var lines = amapCardLabel(c);
              h += Math.max(AMAP.cardMinH, lines.length * AMAP.lineH + AMAP.cardPadY);
            });
            return h + (cards.length - 1) * AMAP.cardGap + AMAP.framePad * 2;
          }

          var plan = cols.map(function (col) {
            var fs = col.frames.map(function (f) {
              var cards = frameCards(f);
              return { f: f, cards: cards, h: frameH(cards) };
            });
            var total = 0;
            fs.forEach(function (x, i) { total += x.h + (i ? AMAP.frameGap : 0); });
            return { side: col.side, frames: fs, total: total };
          });

          var hubCx = AMAP.cardW + AMAP.colGap + AMAP.hubW / 2;
          var colCx = { left: AMAP.cardW / 2, right: hubCx + AMAP.hubW / 2 + AMAP.colGap + AMAP.cardW / 2 };

          plan.forEach(function (col) {
            var y = -col.total / 2;
            col.frames.forEach(function (entry, fi) {
              var f = entry.f;
              var pid = 'frame:' + f.key;
              els.push({
                data: { id: pid, kind: 'frame', side: col.side,
                  label: f.title + '  (' + f.items.length + ')' },
                selectable: false, grabbable: false,
              });
              var cy0 = y + AMAP.framePad;
              entry.cards.forEach(function (item, i) {
                var lines = amapCardLabel(item);
                var h = Math.max(AMAP.cardMinH, lines.length * AMAP.lineH + AMAP.cardPadY);
                var node = amapCardNode(pid + ':' + i, pid, item, i);
                node.position = { x: colCx[col.side], y: cy0 + h / 2 };
                els.push(node);
                cy0 += h + AMAP.cardGap;
              });
              // Stagger where each connector turns so two parallel links never
              // share a pixel column on the way to the module.
              var turn = Math.round((28 + 16 * fi) % 62) + 18;
              els.push({
                data: {
                  id: 'e:' + f.key,
                  source: col.side === 'left' ? pid : 'hub',
                  target: col.side === 'left' ? 'hub' : pid,
                  label: f.edge, turn: (col.side === 'left' ? turn : 100 - turn) + '%',
                },
                selectable: false,
              });
              y += entry.h + AMAP.frameGap;
            });
          });

          var hubLines = wrapLabel(hubLabel, 18, 2).concat([hubSub]);
          els.push({
            data: { id: 'hub', kind: 'hub', label: hubLines.join('\n'),
              w: AMAP.hubW, h: AMAP.hubH, tw: AMAP.hubW - 26, tip: hubLabel + ' - ' + hubSub },
            position: { x: hubCx, y: 0 },
            selectable: false, grabbable: false,
          });
          return els;
        }

        function amapStyle() {
          function pal(k) { return function () { return PAL[k]; }; }
          return [
            {
              selector: 'node[kind="card"], node[kind="more"]',
              style: {
                shape: 'round-rectangle',
                width: 'data(w)', height: 'data(h)',
                label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 'data(tw)',
                'text-valign': 'center', 'text-halign': 'center',
                'font-size': 11.5, 'font-weight': 600, 'line-height': 1.34,
                'font-family': AMAP.font,
                'border-width': 0, 'background-color': function () { return PAL.diaCard; },
                color: function () { return PAL.diaInk; },
                'transition-property': 'background-color', 'transition-duration': '120ms',
              },
            },
            {
              selector: 'node[kind="more"]',
              style: {
                'background-color': function () { return PAL.diaSurface; },
                'border-width': 1.4, 'border-style': 'dashed',
                'border-color': function () { return PAL.lineStrong; },
                color: function () { return PAL.textDim; }, 'font-weight': 500,
              },
            },
            { selector: 'node[goto]', style: { 'z-index': 5 } },
            {
              selector: 'node.amap-hot',
              style: {
                'background-color': function () { return PAL.diaCardHi; },
                'border-width': 2, 'border-color': function () { return PAL.hl; }, 'border-style': 'solid',
              },
            },
            {
              selector: 'node[kind="hub"]',
              style: {
                shape: 'round-rectangle', width: 'data(w)', height: 'data(h)',
                'background-color': pal('hl'), 'border-width': 0,
                label: 'data(label)', 'text-wrap': 'wrap', 'text-max-width': 'data(tw)',
                'text-valign': 'center', 'text-halign': 'center',
                'font-size': 13, 'font-weight': 700, 'line-height': 1.4,
                'font-family': AMAP.font, color: pal('bg'), 'z-index': 6,
              },
            },
            {
              selector: ':parent',
              style: {
                shape: 'round-rectangle', padding: AMAP.framePad,
                'background-opacity': 0, 'background-color': pal('bg'),
                'border-width': 1.3, 'border-color': pal('lineStrong'),
                label: 'data(label)', 'text-valign': 'top', 'text-halign': 'center',
                'text-margin-y': -9, 'font-size': 10.5, 'font-weight': 700,
                'font-family': AMAP.font, 'text-transform': 'uppercase',
                color: pal('textDim'),
                'text-background-color': function () { return PAL.diaSurface; },
                'text-background-opacity': 1, 'text-background-padding': 5,
                'text-background-shape': 'roundrectangle',
              },
            },
            {
              selector: 'edge',
              style: {
                'curve-style': 'taxi', 'taxi-direction': 'horizontal',
                'taxi-turn': 'data(turn)', 'taxi-turn-min-distance': 14,
                width: 1.4, 'line-color': pal('lineStrong'),
                'target-arrow-color': pal('lineStrong'), 'target-arrow-shape': 'triangle',
                'arrow-scale': 0.85,
                label: 'data(label)', 'font-size': 10, 'font-weight': 600,
                'font-family': AMAP.font, color: pal('textDim'), 'text-rotation': 'none',
                'text-background-color': function () { return PAL.diaSurface; },
                'text-background-opacity': 1, 'text-background-padding': 4,
                'text-background-shape': 'roundrectangle',
              },
            },
          ];
        }

        AMAP.font = '"Anthropic Sans", "Outfit", -apple-system, BlinkMacSystemFont, "SF Pro Text", '
          + '"Segoe UI Variable Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, ui-sans-serif, sans-serif';

        // Cytoscape never sees CSS, so the diagram's own colours join the
        // palette the theme toggle already refreshes.
        (function extendPalette() {
          var base = refreshPalette;
          refreshPalette = function () {
            base();
            var cs = getComputedStyle(document.documentElement);
            PAL.diaCard = cs.getPropertyValue('--dia-card').trim();
            PAL.diaCardHi = cs.getPropertyValue('--dia-card-hi').trim();
            PAL.diaInk = cs.getPropertyValue('--dia-ink').trim();
            PAL.diaSurface = cs.getPropertyValue('--dia-surface').trim();
          };
          refreshPalette();
        })();

        // Every live canvas on the page, so a theme switch can repaint them
        // and a page teardown can dispose them instead of leaking.
        var amapLive = [];
        var amapSpecs = Object.create(null);
        var amapSeq = 0;

        function amapDisposeAll() {
          amapLive.forEach(function (c) { try { c.destroy(); } catch (e) {} });
          amapLive = [];
        }
        function amapRestyleAll() {
          amapLive.forEach(function (c) { c.style().update(); c.forceRender(); });
        }

        /** Mounts every agent-context canvas inside `root` that is visible and
         * not already mounted. Panes are hidden with the `hidden` attribute, so
         * a canvas in a background tab has no box to measure - it stays
         * unmounted until its tab is opened and this runs again. */
        function mountAgentMaps(root) {
          var hosts = (root || document).querySelectorAll('.amap-canvas[data-amap]');
          for (var i = 0; i < hosts.length; i++) mountAgentMap(hosts[i]);
        }

        function mountAgentMap(host) {
          if (host.getAttribute('data-mounted') === '1') return;
          if (!host.clientWidth || !host.clientHeight) return;
          var spec = amapSpecs[host.getAttribute('data-amap')];
          if (!spec) return;
          host.setAttribute('data-mounted', '1');

          var open = Object.create(null);
          var wrap = host.closest('.amap');
          var tip = wrap.querySelector('.amap-tip');

          var c = cytoscape({
            container: host,
            pixelRatio: Math.max(2, window.devicePixelRatio || 1),
            wheelSensitivity: 0.22,
            minZoom: 0.08, maxZoom: 2.4,
            boxSelectionEnabled: false,
            autoungrabify: true,
            style: amapStyle(),
            elements: amapElements(spec.frames, spec.hubLabel, spec.hubSub, open),
            layout: { name: 'preset' },
          });
          amapLive.push(c);

          // Fit, but never blow a small map up past life size - two frames
          // and a hub stretched to fill 520px reads as a mistake.
          function fit() {
            c.fit(undefined, 34);
            if (c.zoom() > 1) c.zoom(1);
            c.center();
          }
          fit();

          if (window.ResizeObserver) {
            new ResizeObserver(function () { c.resize(); }).observe(host);
          }

          function rebuild() {
            var z = c.zoom(), p = c.pan();
            c.batch(function () {
              c.elements().remove();
              c.add(amapElements(spec.frames, spec.hubLabel, spec.hubSub, open));
            });
            c.zoom(z); c.pan(p);
          }

          c.on('tap', 'node[kind="more"]', function (e) {
            var k = e.target.data('more');
            if (open[k]) delete open[k]; else open[k] = 1;
            rebuild();
          });
          c.on('tap', 'node[goto]', function (e) {
            var id = e.target.data('goto');
            if (id) select(id, true);
          });
          c.on('mouseover', 'node[kind="card"], node[kind="more"], node[kind="hub"]', function (e) {
            var n = e.target;
            n.addClass('amap-hot');
            host.style.cursor = (n.data('goto') || n.data('more')) ? 'pointer' : 'default';
            tip.textContent = n.data('tip') || '';
            tip.hidden = !tip.textContent;
          });
          c.on('mouseout', 'node', function (e) {
            e.target.removeClass('amap-hot');
            host.style.cursor = '';
            tip.hidden = true;
          });

          wrap.addEventListener('click', function (ev) {
            var b = ev.target.closest('[data-amap-act]');
            if (!b) return;
            var act = b.getAttribute('data-amap-act');
            if (act === 'in') c.zoom({ level: c.zoom() * 1.25, renderedPosition: { x: host.clientWidth / 2, y: host.clientHeight / 2 } });
            else if (act === 'out') c.zoom({ level: c.zoom() / 1.25, renderedPosition: { x: host.clientWidth / 2, y: host.clientHeight / 2 } });
            else if (act === 'fit') fit();
            else if (act === 'all') {
              var everything = spec.frames.left.concat(spec.frames.right);
              var anyClosed = everything.some(function (f) { return !open[f.key] && f.items.length > AMAP.maxItems; });
              everything.forEach(function (f) { if (anyClosed) open[f.key] = 1; else delete open[f.key]; });
              b.textContent = anyClosed ? 'Collapse all' : 'Expand all';
              rebuild();
              fit();
            }
          });
        }

        /** Fronts the Docs tab: before reading any single doc, this is the
         * shape of the context an agent works inside. */
        function agentContextSection(scope, label) {
          var frames = agentContextFrames(scope);
          if (!frames.left.length && !frames.right.length) return null;
          var id = 'am' + (++amapSeq);
          amapSpecs[id] = {
            frames: frames, hubLabel: label, hubSub: pluralize(scope.files.length, 'file'),
          };
          var expandable = frames.left.concat(frames.right).some(function (f) {
            return f.items.length > AMAP.maxItems;
          });
          return '<section class="agent-map"><h3>How an AI agent sees ' + esc(label) + '</h3>'
            + '<p class="lead">Everything an agent reads before it changes anything here: repo-wide rules, '
            + 'this module\'s own specs, and the code it would touch.</p>'
            + '<div class="amap">'
            + '<div class="amap-bar">'
            + (expandable ? '<button type="button" class="ghost" data-amap-act="all">Expand all</button>' : '')
            + '<span class="amap-spacer"></span>'
            + '<button type="button" class="ghost amap-icon" data-amap-act="out" title="Zoom out" aria-label="Zoom out">&minus;</button>'
            + '<button type="button" class="ghost amap-icon" data-amap-act="in" title="Zoom in" aria-label="Zoom in">+</button>'
            + '<button type="button" class="ghost" data-amap-act="fit">Fit</button>'
            + '</div>'
            + '<div class="amap-canvas" data-amap="' + id + '"></div>'
            + '<div class="amap-tip" hidden></div>'
            + '</div></section>';
        }

        function openFolderPanel(gid) {
          var rest = gid.slice('group:'.length);
          var slug = rest.slice(0, rest.indexOf('/'));
          var rel = rest.slice(slug.length + 1);
          var mod = nodeById['module:' + slug];
          if (!mod) return;
          var folder = mod.path + '/' + rel;
          var inside = (moduleFiles[slug] || []).filter(function (f) {
            return f.path.indexOf(folder + '/') === 0;
          });
          panel.innerHTML =
            '<button class="ghost close" data-close="1">Close</button>'
            + '<div class="kind">folder</div><h2>' + esc(rel.slice(rel.lastIndexOf('/') + 1)) + '/</h2>'
            + '<div class="path muted">' + esc(folder) + '</div>'
            + '<div class="panel-actions"><button class="ghost" data-drill="' + esc(rel) + '">Open folder</button></div>'
            + listSection('Files inside', inside.map(function (f) { return nodeLink(f); }));
          stage.classList.add('panel-open');
        }

        function closeDetailPage() {
          amapDisposeAll();
          detailPage.classList.remove('on');
        }

        /** Same full-page treatment a module gets, scoped to one area inside
         * it - a KYC box on the Routes graph should not dump the whole
         * onboarding module. */
        function openAreaPanel(slug, areaKey) {
          var mod = nodeById['module:' + slug];
          if (!mod) return;
          var areas = subAreas(slug);
          var area = null;
          for (var i = 0; i < areas.length; i++) { if (areas[i].key === areaKey) { area = areas[i]; break; } }
          if (!area) { openPanel('module:' + slug); return; }
          var areaScope = areaDetailScope(mod, area);
          // One identity line is enough: the heading names the area, the muted
          // tail says which module it lives in (and links back to it).
          var header = '<h2>' + esc(area.key) + '/ <span class="in-parent">in '
            + nodeLink(mod) + '</span></h2>';
          amapDisposeAll();
          detailPage.innerHTML = '<div class="detail-inner wide">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + header + chipsHtml(areaScope) + detailHtml(areaScope) + '</div>';
          detailPage.classList.add('on');
          mountAgentMaps(detailPage);
          stage.classList.remove('panel-open');
        }

        /** A doc's full story fills the window too - a spec with guardrails and
         * broken references does not fit in the small drawer any better than a
         * module does, and it is the doc page that carries the AI-agent CTA. */
        function openDocPage(n, headerHtml) {
          var guardrails = (n.meta && n.meta.guardrails) || [];
          var html = headerHtml;

          if (n.module && nodeById['module:' + n.module]) {
            var ownerMod = nodeById['module:' + n.module];
            var ownerArea = areaOf(n.module, n.path);
            html += '<p class="lead module-context">Lives in the ' + nodeLink(ownerMod) + ' module'
              + (ownerArea ? ', in the ' + esc(ownerArea.key) + ' area' : '') + '.'
              + (ownerMod.summary ? ' ' + esc(ownerMod.summary) : '') + '</p>';
          }

          // A doc is one card on its module's context map - offer the map as
          // the way back out to everything else an agent would read alongside
          // it, then the prompt for going deeper on this doc itself.
          var ownerModForMap = n.module ? nodeById['module:' + n.module] : null;
          if (ownerModForMap) {
            html += '<div class="ai-cta"><h3>See this doc in context</h3>'
              + '<p class="lead">This is one of the things an agent reads before it touches '
              + esc(ownerModForMap.label) + '. The module\'s Docs tab maps the rest.</p>'
              + '<div class="panel-actions"><button class="ghost" data-module-tab="'
              + esc(ownerModForMap.module) + '/docs">Open the ' + esc(ownerModForMap.label)
              + ' context map</button></div></div>';
          }

          if (guardrails.length) {
            html += '<section><h3>Guardrails</h3>' + guardListHtml(guardrails) + '</section>';
          }
          html += listSection('Describes', related(n.id, 'documents', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Links to', related(n.id, 'links', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Linked from', related(n.id, 'links', 'in').map(function (r) { return nodeLink(r.node); }));
          html += brokenRefsHtml(n);

          amapDisposeAll();
          detailPage.innerHTML = '<div class="detail-inner">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + html + '</div>';
          detailPage.classList.add('on');
          mountAgentMaps(detailPage);
          stage.classList.remove('panel-open');
        }

        /** A doc cluster box (a feature section in the Docs view, e.g. "Portfolio"
         * or "MySIP") used to do nothing when tapped - it is a compound node, so
         * the generic isParent() guard swallowed the click. This gives it the
         * same full-page treatment a module gets, fronted by the same agent
         * context map its module page shows - that is the whole point of
         * grouping docs by feature in the first place. `info` is a
         * plain {id, label, ref} object rather than a cytoscape element so this
         * can be called from a graph tap or from a plain button elsewhere. */
        function openDocClusterPage(info) {
          var key = info.id.slice('dcl:'.length);
          var label = info.label;
          var ref = info.ref;
          var mod = ref ? nodeById[ref] : null;
          var docs = GRAPH.nodes.filter(function (n) {
            return n.type === 'doc' && typeAllowed('doc') && docClusterOf(n).key === key;
          }).sort(function (a, b) { return a.label < b.label ? -1 : a.label > b.label ? 1 : (a.id < b.id ? -1 : 1); });
          if (!docs.length) return;

          var header = '<div class="kind">documentation' + (mod ? ' &middot; module' : '') + '</div>'
            + '<h2>' + esc(label) + '</h2>'
            + (mod ? '<p class="lead module-context">Docs about the ' + nodeLink(mod) + ' module'
                + (mod.summary ? '. ' + esc(mod.summary) : '.') + '</p>' : '');

          var clusterMap = mod ? agentContextSection(moduleDetailScope(mod), label) : null;
          var body = (clusterMap || '')
            + '<p class="lead">What is written down here. Pick a tab for what you are after - '
            + 'what needs fixing, the rules, the specs.</p>'
            + docGroupTabs(docs);

          amapDisposeAll();
          detailPage.innerHTML = '<div class="detail-inner wide">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + header + body + '</div>';
          detailPage.classList.add('on');
          mountAgentMaps(detailPage);
          stage.classList.remove('panel-open');
        }

        function openPanel(id) {
          closeDetailPage();
          if (id.indexOf('group:') === 0) { openFolderPanel(id); return; }
          var n = nodeById[id];
          if (!n) return;

          var href = editorHref(n.path);
          var guardrails = (n.meta && n.meta.guardrails) || [];

          // A module heading stands on its own - the reader got here from the
          // map and the name says it all. Other node types keep the kind label
          // because "documentation", "screen . flow" etc. is genuine context.
          var html = n.type === 'module' ? '' : ('<div class="kind">' + esc(n.type)
            + (n.meta && n.meta.docKind ? ' &middot; ' + esc(n.meta.docKind) : '')
            + (n.meta && n.meta.navigatorType ? ' &middot; ' + esc(n.meta.navigatorType) : '')
            + '</div>');
          html += '<h2>' + esc(n.label) + staleBadge(n) + '</h2>';
          if (n.path) {
            html += href
              ? '<a class="path" href="' + esc(href) + '">' + esc(n.path) + '</a>'
              : '<div class="path muted">' + esc(n.path) + '</div>';
          }
          if (n.meta && n.meta.routePath) html += '<div class="path muted">' + esc(n.meta.routePath) + '</div>';
          if (n.summary) html += '<p class="summary">' + mdInline(n.summary) + '</p>';

          // A module's story - screens, folders, docs, blast radius - runs
          // long. The small drawer squeezed it into one narrow column; a full
          // page gives it room, same as a doc gets.
          if (n.type === 'module') {
            var modScope = moduleDetailScope(n);
            amapDisposeAll();
