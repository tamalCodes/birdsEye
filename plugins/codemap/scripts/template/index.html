                  + pluralize(biggest.total, 'file') + ').';
              }
            }
            var filesBody = '<p class="lead">' + filesLead + '</p>';
            var folderTeaserBits = [];
            // components/ and hooks/ are what a reader is asking for by name;
            // put them first, then the rest in the order they sit on disk.
            var pinned = ['components', 'hooks'];
            var orderedGroups = tree.groups.slice().sort(function (a, b) {
              var pa = pinned.indexOf(a.label.toLowerCase());
              var pb = pinned.indexOf(b.label.toLowerCase());
              if (pa === -1 && pb === -1) return 0;
              if (pa === -1) return 1;
              if (pb === -1) return -1;
              return pa - pb;
            });
            orderedGroups.forEach(function (g) {
              var gBase = scope.basePath + '/' + g.label;
              var inner = g.subs.map(function (s) {
                return folderDetails(s.label + '/', s.files.length, fileList(s.files, gBase + '/' + s.label));
              }).join('') + (g.files.length ? fileList(g.files, gBase) : '');
              filesBody += folderDetails(g.label + '/', g.total, inner, tree.groups.length <= 2);
              folderTeaserBits.push(esc(g.label) + '/ ' + g.total);
            });
            if (tree.rootFiles.length) {
              filesBody += folderDetails('module root', tree.rootFiles.length, fileList(tree.rootFiles, scope.basePath));
              folderTeaserBits.push('module root ' + tree.rootFiles.length);
            }
            var folderTeaser = folderTeaserBits.slice(0, 4).join(' &middot; ')
              + (folderTeaserBits.length > 4 ? ' &middot; +' + (folderTeaserBits.length - 4) + ' more' : '');
            html += collapsible('Components, hooks and other files here', scope.files.length, folderTeaser, filesBody);
          }

          return html;
        }

        // Where a doc that lives outside the module actually sits. Without it
        // half the list is filenames with no address.
        function docWhere(d, modPath) {
          if (d.path.indexOf(modPath + '/') === 0) return '';
          var segs = d.path.split('/');
          if (segs.length < 2) return '';
          return segs.slice(0, Math.min(segs.length - 1, 2)).join('/') + '/';
        }
        function docItem(d, slug, modPath) {
          var guards = (d.meta && d.meta.guardrails) || [];
          var gone = (d.meta && d.meta.refs && d.meta.refs.deleted) || [];
          var dArea = areaOf(slug, d.path);
          var out = '<li><div class="entry-head">' + nodeLink(d)
            + (!dArea ? '' : tag(dArea.key + '/', 'area'))
            + (dArea ? '' : tag(docWhere(d, modPath), 'loc'))
            + tag(d.meta && d.meta.docKind)
            + staleBadge(d)
            + '</div>';
          if (d.summary) out += '<div class="sub">' + mdInline(d.summary) + '</div>';
          // The badge says "names 2 deleted files" - useless on its own unless
          // the reader can see which files, so the answer sits one click away,
          // right here, instead of only on the doc's own full page.
          if (gone.length) {
            out += '<details><summary class="muted">' + pluralize(gone.length, 'file')
              + ' this doc still names ' + (gone.length === 1 ? 'has' : 'have') + ' since been removed by git</summary>'
              + deletedRefsList(gone) + '</details>';
          }
          if (guards.length) {
            out += '<details><summary class="muted">' + pluralize(guards.length, 'guardrail') + '</summary>'
              + '<div class="guard-list">' + guards.map(function (g) { return '<div class="guard">' + mdInline(g) + '</div>'; }).join('') + '</div>'
              + '</details>';
          }
          return out + '</li>';
        }

        /** Rule/memory files (AGENTS docKind) for a doc's own module, other than
         * the doc itself - context worth an agent's attention even though they
         * are not the thing being read. */
        function memoryDocsFor(n) {
          if (!n.module || !nodeById['module:' + n.module]) return [];
          return moduleDocs(nodeById['module:' + n.module]).filter(function (d) {
            return d.meta && d.meta.docKind === 'AGENTS' && d.id !== n.id;
          });
        }

        /** The whole point of the Docs view: a copy-pasteable prompt that sends
         * an AI agent to read this documentation, gather whatever else it needs
         * from the code, and hand back an interactive flowchart. AGENTS-kind
         * docs are framed as background rules rather than reading material -
         * they tell the agent how this codebase expects work to be done. */
        function agentPrompt(label, docs) {
          var memory = [], rest = [];
          docs.forEach(function (d) { (d.meta && d.meta.docKind === 'AGENTS' ? memory : rest).push(d); });
          var lines = [
            'Read through the documentation below for ' + label + ' in this codebase, follow it into whatever '
              + 'source files it points at for extra context, and then produce an interactive flowchart (a Mermaid '
              + 'diagram works well) that walks a non-technical reader through how ' + label + ' actually works end '
              + 'to end - the steps, decisions and hand-offs, not the code.',
            '',
          ];
          if (rest.length) {
            lines.push('Docs to read:');
            rest.forEach(function (d) { lines.push('- ' + d.path); });
            lines.push('');
          }
          if (memory.length) {
            lines.push('Also check these rule files for how this codebase expects work to be done:');
            memory.forEach(function (d) { lines.push('- ' + d.path); });
            lines.push('');
          }
          lines.push('Ask me for anything else you need before you start.');
          return lines.join('\n');
        }

        function aiCta(label, docs) {
          var prompt = agentPrompt(label, docs);
          return '<div class="ai-cta"><h3>Turn this into a flowchart</h3>'
            + '<p class="lead">A wall of markdown is slow to read. Hand this prompt to an AI coding agent - it will '
            + 'work through ' + (docs.length === 1 ? 'this doc' : 'these docs') + ', gather whatever else it needs '
            + 'from the code, and hand you back an interactive flowchart of how ' + esc(label) + ' works.</p>'
            + '<div class="panel-actions"><button class="ghost copy-prompt" data-copy="ai-prompt-box">'
            + 'Copy prompt for an AI agent</button></div>'
            + '<pre class="prompt-box" id="ai-prompt-box">' + esc(prompt) + '</pre>'
            + '</div>';
        }

        /** A module page is a generated overview - it does not read prose the
         * way a person does, so it stops well short of a full explanation.
         * This hands a reader who wants more a ready-made prompt: send an
         * agent to everything the page already found (docs, screens, source)
         * and have it come back with the deeper story. */
        function moduleAgentPrompt(label, scope) {
          var lines = [
            'I am looking at ' + label + ' in this codebase and want to understand it in more depth than a '
              + 'generated overview can give. Read through its source files, screens and documentation, and '
              + 'explain in plain English what it does, why it is structured the way it is, and how its pieces '
              + 'fit together end to end.',
            '',
            'Where to look:',
            '- Source: ' + scope.basePath,
          ];
          if (scope.docs.length) {
            lines.push('- Docs:');
            scope.docs.forEach(function (d) { lines.push('  - ' + d.path); });
          }
          if (scope.screens.length) {
            lines.push('- Screens the user sees: ' + scope.screens.map(function (s) { return s.label; }).join(', '));
          }
          lines.push('', 'Ask me for anything else you need before you start.');
          return lines.join('\n');
        }

        function moduleAiCta(label, scope) {
          var prompt = moduleAgentPrompt(label, scope);
          var body = '<p class="lead">This page is generated straight from the code - a starting point, not '
            + 'the full story. Hand this prompt to an AI coding agent and it will read through the docs, '
            + 'screens and source above and explain ' + esc(label) + ' the way a teammate would.</p>'
            + '<div class="panel-actions"><button class="ghost copy-prompt" data-copy="module-ai-prompt-box">'
            + 'Copy prompt for an AI agent</button></div>'
            + '<pre class="prompt-box" id="module-ai-prompt-box">' + esc(prompt) + '</pre>';
          return collapsible('Want to know more?', null, 'Generate a deeper explanation with an AI agent', body);
        }

        /**
         * The whole point of this feature: the flowchart already exists by the
         * time anyone opens the map, built during extraction by an agent that
         * read the module's docs, not synthesised live in the browser. This is
         * just deterministic layout + SVG for whatever steps/edges it wrote.
         */
        var FLOW_NODE_W = 176, FLOW_NODE_H = 56, FLOW_GAP_X = 26, FLOW_GAP_Y = 64;

        /** Longest-path-from-source layering - a plain top-to-bottom Sugiyama
         * layer assignment. Cycle-guarded even though a well-formed flow has
         * none, since this reads untrusted-shaped JSON from a cache file. */
        function flowLayers(flow) {
          var steps = flow.steps || [];
          var byId = Object.create(null);
          steps.forEach(function (s) { byId[s.id] = s; });
          var incoming = Object.create(null);
          (flow.edges || []).forEach(function (e) {
            if (!byId[e.from] || !byId[e.to]) return;
            (incoming[e.to] || (incoming[e.to] = [])).push(e.from);
          });
          var level = Object.create(null);
          function levelOf(id, seen) {
            if (level[id] != null) return level[id];
            if (seen[id]) { level[id] = 0; return 0; }
            seen[id] = 1;
            var m = 0;
            (incoming[id] || []).forEach(function (p) { m = Math.max(m, levelOf(p, seen) + 1); });
            level[id] = m;
            seen[id] = 0;
            return m;
          }
          steps.forEach(function (s) { levelOf(s.id, Object.create(null)); });
          var rows = [];
          steps.forEach(function (s) {
            var lv = level[s.id] || 0;
            (rows[lv] || (rows[lv] = [])).push(s);
          });
          var out = [];
          rows.forEach(function (r) { if (r) out.push(r); });
          return out;
        }

        function flowPositions(rows) {
          var pos = {}, maxCols = 0;
          rows.forEach(function (row) { maxCols = Math.max(maxCols, row.length); });
          var totalW = maxCols * FLOW_NODE_W + (maxCols - 1) * FLOW_GAP_X;
          rows.forEach(function (row, rowIndex) {
            var rowW = row.length * FLOW_NODE_W + (row.length - 1) * FLOW_GAP_X;
            var startX = (totalW - rowW) / 2;
            row.forEach(function (s, i) {
              pos[s.id] = { x: startX + i * (FLOW_NODE_W + FLOW_GAP_X), y: rowIndex * (FLOW_NODE_H + FLOW_GAP_Y) };
            });
          });
          return { pos: pos, width: Math.max(totalW, FLOW_NODE_W), height: rows.length * FLOW_NODE_H + Math.max(0, rows.length - 1) * FLOW_GAP_Y };
        }

        /** Break a label onto at most two lines at word boundaries - SVG text
         * does not wrap on its own. */
        function wrapLabel(text, maxChars, maxLines) {
          var words = (text || '').split(/\s+/).filter(Boolean);
          var lines = [], cur = '';
          words.forEach(function (w) {
            var candidate = cur ? cur + ' ' + w : w;
            if (candidate.length > maxChars && cur) { lines.push(cur); cur = w; } else { cur = candidate; }
          });
          if (cur) lines.push(cur);
          if (lines.length > maxLines) {
            lines = lines.slice(0, maxLines);
            var last = lines[maxLines - 1];
            lines[maxLines - 1] = last.length > maxChars - 1 ? last.slice(0, maxChars - 1) + '…' : last + '…';
          }
          return lines;
        }

        function flowNodeShape(s, x, y) {
          var cx = x + FLOW_NODE_W / 2, cy = y + FLOW_NODE_H / 2;
          var cls = 'flow-node flow-' + (s.kind || 'step');
          var lines = wrapLabel(s.label || '', 22, 2);
          var lineH = 14;
          var startY = cy - ((lines.length - 1) * lineH) / 2;
          var tspans = lines.map(function (ln, i) {
            return '<tspan x="' + cx + '" y="' + (startY + i * lineH) + '">' + esc(ln) + '</tspan>';
          }).join('');
          var text = '<text text-anchor="middle" dominant-baseline="middle">' + tspans + '</text>';
          var shape;
          if (s.kind === 'decision') {
            var pts = [cx + ',' + y, (x + FLOW_NODE_W) + ',' + cy, cx + ',' + (y + FLOW_NODE_H), x + ',' + cy].join(' ');
            shape = '<polygon points="' + pts + '"></polygon>';
          } else {
            var rx = (s.kind === 'start' || s.kind === 'end') ? FLOW_NODE_H / 2 : 8;
            shape = '<rect x="' + x + '" y="' + y + '" width="' + FLOW_NODE_W + '" height="' + FLOW_NODE_H + '" rx="' + rx + '"></rect>';
          }
          return '<g class="' + cls + '" data-flow-node="' + esc(s.id) + '">' + shape + text + '</g>';
        }

        function flowEdgePath(a, b) {
          var x1 = a.x + FLOW_NODE_W / 2, y1 = a.y + FLOW_NODE_H;
          var x2 = b.x + FLOW_NODE_W / 2, y2 = b.y;
          if (Math.abs(y2 - y1) < 1) {
            y1 = a.y + FLOW_NODE_H / 2; y2 = b.y + FLOW_NODE_H / 2;
            x1 = a.x > b.x ? a.x : a.x + FLOW_NODE_W;
            x2 = a.x > b.x ? b.x + FLOW_NODE_W : b.x;
          }
          var midY = (y1 + y2) / 2;
          return 'M' + x1 + ' ' + y1 + ' C ' + x1 + ' ' + midY + ' ' + x2 + ' ' + midY + ' ' + x2 + ' ' + y2;
        }

        function flowchartSvg(flow) {
          var rows = flowLayers(flow);
          if (!rows.length) return '';
          var layout = flowPositions(rows);
          var pad = 20;
          var w = layout.width + pad * 2, h = layout.height + pad * 2;

          var defs = '<defs><marker id="flowArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" '
            + 'markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="flow-arrow-head">'
            + '</path></marker></defs>';

          var edgesHtml = (flow.edges || []).map(function (e) {
            var a = layout.pos[e.from], b = layout.pos[e.to];
            if (!a || !b) return '';
            var d = flowEdgePath(a, b);
            var lbl = e.label
              ? '<text class="flow-edge-label" x="' + ((a.x + b.x) / 2 + FLOW_NODE_W / 2)
                + '" y="' + ((a.y + b.y) / 2 + FLOW_NODE_H / 2) + '" text-anchor="middle">' + esc(e.label) + '</text>'
              : '';
            return '<path class="flow-edge" d="' + d + '" marker-end="url(#flowArrow)"></path>' + lbl;
          }).join('');

          var nodesHtml = (flow.steps || []).map(function (s) {
            var p = layout.pos[s.id];
            return p ? flowNodeShape(s, p.x, p.y) : '';
          }).join('');

          return '<svg class="flowchart-svg" viewBox="0 0 ' + w + ' ' + h + '" width="' + w + '" height="' + h + '">'
            + defs + '<g transform="translate(' + pad + ',' + pad + ')">' + edgesHtml + nodesHtml + '</g></svg>';
        }

        /** The diagram stays compact - full detail per step lives here, in the
         * same ol.steps list the code-derived step screens already use, so a
         * click on a diagram node has somewhere obvious to land. */
        function flowWalkthroughHtml(flow) {
          var items = (flow.steps || []).map(function (s) {
            var kindTag = s.kind && s.kind !== 'step' ? tag(s.kind) : '';
            return '<li id="flow-step-' + esc(s.id) + '"><div class="entry-head"><b>' + esc(s.label) + '</b>' + kindTag + '</div>'
              + (s.detail ? '<div class="sub">' + mdInline(s.detail) + '</div>' : '') + '</li>';
          }).join('');
          return '<ol class="steps">' + items + '</ol>';
        }

        function flowchartSection(mod) {
          var flow = mod.meta && mod.meta.flowchart;
          if (!flow || !flow.steps || !flow.steps.length) return null;
          var html = '<div class="ai-cta flowchart-card"><h3>' + esc(flow.title || ('How ' + mod.label + ' works')) + '</h3>';
          if (flow.summary) html += '<p class="lead">' + esc(flow.summary) + '</p>';
          html += '<div class="flowchart-wrap">' + flowchartSvg(flow) + '</div>';
          html += flowWalkthroughHtml(flow);
          if (flow.sources && flow.sources.length) {
            html += '<p class="sub flow-sources">Built from '
              + flow.sources.map(function (p) { return '<span class="path">' + esc(p) + '</span>'; }).join(', ') + '.</p>';
          }
          return html + '</div>';
        }

        function openFolderPanel(gid) {
          var rest = gid.slice('group:'.length);
          var slug = rest.slice(0, rest.indexOf('/'));
          var rel = rest.slice(slug.length + 1);
          var mod = nodeById['module:' + slug];
          if (!mod) return;
          var folder = mod.path + '/' + rel;
          var inside = (moduleFiles[slug] || []).filter(function (f) {
            return f.path.indexOf(folder + '/') === 0;
          });
          panel.innerHTML =
            '<button class="ghost close" data-close="1">Close</button>'
            + '<div class="kind">folder</div><h2>' + esc(rel.slice(rel.lastIndexOf('/') + 1)) + '/</h2>'
            + '<div class="path muted">' + esc(folder) + '</div>'
            + '<div class="panel-actions"><button class="ghost" data-drill="' + esc(rel) + '">Open folder</button></div>'
            + listSection('Files inside', inside.map(function (f) { return nodeLink(f); }));
          stage.classList.add('panel-open');
        }

        function closeDetailPage() { detailPage.classList.remove('on'); }

        /** Same full-page treatment a module gets, scoped to one area inside
         * it - a KYC box on the Routes graph should not dump the whole
         * onboarding module. */
        function openAreaPanel(slug, areaKey) {
          var mod = nodeById['module:' + slug];
          if (!mod) return;
          var areas = subAreas(slug);
          var area = null;
          for (var i = 0; i < areas.length; i++) { if (areas[i].key === areaKey) { area = areas[i]; break; } }
          if (!area) { openPanel('module:' + slug); return; }
          var areaScope = areaDetailScope(mod, area);
          var header = '<p class="crumb">' + nodeLink(mod) + ' / ' + esc(area.key) + '/</p>'
            + '<div class="kind">area of ' + esc(slug) + '</div>'
            + '<h2>' + esc(area.key) + '/</h2>'
            + '<div class="path muted">' + esc(area.prefix.slice(0, -1)) + '</div>';
          detailPage.innerHTML = '<div class="detail-inner wide">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + header + chipsHtml(areaScope) + detailHtml(areaScope) + '</div>';
          detailPage.classList.add('on');
          stage.classList.remove('panel-open');
        }

        /** A doc's full story fills the window too - a spec with guardrails and
         * broken references does not fit in the small drawer any better than a
         * module does, and it is the doc page that carries the AI-agent CTA. */
        function openDocPage(n, headerHtml) {
          var guardrails = (n.meta && n.meta.guardrails) || [];
          var html = headerHtml;

          if (n.module && nodeById['module:' + n.module]) {
            var ownerMod = nodeById['module:' + n.module];
            var ownerArea = areaOf(n.module, n.path);
            html += '<p class="lead module-context">Lives in the ' + nodeLink(ownerMod) + ' module'
              + (ownerArea ? ', in the ' + esc(ownerArea.key) + ' area' : '') + '.'
              + (ownerMod.summary ? ' ' + esc(ownerMod.summary) : '') + '</p>';
          }

          // If the doc's own module already has a generated flowchart, point
          // there instead of duplicating a manual CTA - the flowchart already
          // covers this doc alongside its siblings.
          var ownerModForFlow = n.module ? nodeById['module:' + n.module] : null;
          var ownerFlow = ownerModForFlow && ownerModForFlow.meta && ownerModForFlow.meta.flowchart;
          if (ownerFlow && ownerFlow.steps && ownerFlow.steps.length) {
            html += '<div class="ai-cta"><h3>There is already a flowchart for this</h3>'
              + '<p class="lead">' + esc(ownerModForFlow.label) + ' has a generated walkthrough that covers this doc '
              + 'and its siblings.</p><div class="panel-actions"><button class="ghost" data-goto-cluster="'
              + esc(ownerModForFlow.module) + '">Open the ' + esc(ownerModForFlow.label) + ' flowchart</button></div></div>';
          } else {
            html += aiCta(n.label, [n].concat(memoryDocsFor(n)));
          }

          if (guardrails.length) {
            html += '<section><h3>Guardrails</h3>'
              + '<div class="guard-list">' + guardrails.map(function (g) { return '<div class="guard">' + mdInline(g) + '</div>'; }).join('') + '</div>'
              + '</section>';
          }
          html += listSection('Describes', related(n.id, 'documents', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Links to', related(n.id, 'links', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Linked from', related(n.id, 'links', 'in').map(function (r) { return nodeLink(r.node); }));
          html += brokenRefsHtml(n);

          detailPage.innerHTML = '<div class="detail-inner">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + html + '</div>';
          detailPage.classList.add('on');
          stage.classList.remove('panel-open');
        }

        /** A doc cluster box (a feature section in the Docs view, e.g. "Portfolio"
         * or "MySIP") used to do nothing when tapped - it is a compound node, so
         * the generic isParent() guard swallowed the click. This gives it the
         * same full-page treatment a module gets, fronted by the flowchart that
         * was already generated for it during extraction - that is the whole
         * point of grouping docs by feature in the first place. `info` is a
         * plain {id, label, ref} object rather than a cytoscape element so this
         * can be called from a graph tap or from a plain button elsewhere. */
        function openDocClusterPage(info) {
          var key = info.id.slice('dcl:'.length);
          var label = info.label;
          var ref = info.ref;
          var mod = ref ? nodeById[ref] : null;
          var docs = GRAPH.nodes.filter(function (n) {
            return n.type === 'doc' && typeAllowed('doc') && docClusterOf(n).key === key;
          }).sort(function (a, b) { return a.label < b.label ? -1 : a.label > b.label ? 1 : (a.id < b.id ? -1 : 1); });
          if (!docs.length) return;

          var guardTotal = 0, staleCount = 0;
          docs.forEach(function (d) {
            guardTotal += ((d.meta && d.meta.guardrails) || []).length;
            if (d.meta && d.meta.stale) staleCount++;
          });

          var header = '<div class="kind">documentation' + (mod ? ' &middot; module' : '') + '</div>'
            + '<h2>' + esc(label) + '</h2>'
            + (mod ? '<p class="lead module-context">Docs about the ' + nodeLink(mod) + ' module'
                + (mod.summary ? '. ' + esc(mod.summary) : '.') + '</p>' : '');

          var lead = 'What is written down here.';
          if (guardTotal) {
            lead += ' ' + pluralize(guardTotal, 'rule') + ' to respect ' + (guardTotal === 1 ? 'is' : 'are')
              + ' spelled out below.';
          }
          if (staleCount) {
            lead += ' ' + pluralize(staleCount, 'doc') + ' still name' + (staleCount === 1 ? 's' : '')
              + ' files git has since removed.';
          }

          var flowHtml = mod ? flowchartSection(mod) : null;
          var body = (flowHtml || aiCta(label, docs))
            + '<section><h3>Docs in this section <span class="muted">' + docs.length + '</span></h3>'
            + '<p class="lead">' + lead + '</p>'
            + '<ul class="entries">' + docs.map(function (d) {
                return docItem(d, mod ? mod.module : null, mod ? mod.path : '');
              }).join('') + '</ul>'
            + '</section>';

          detailPage.innerHTML = '<div class="detail-inner wide">'
            + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
            + header + body + '</div>';
          detailPage.classList.add('on');
          stage.classList.remove('panel-open');
        }

        function openPanel(id) {
          closeDetailPage();
          if (id.indexOf('group:') === 0) { openFolderPanel(id); return; }
          var n = nodeById[id];
          if (!n) return;

          var href = editorHref(n.path);
          var guardrails = (n.meta && n.meta.guardrails) || [];

          var html = '<div class="kind">' + esc(n.type)
            + (n.meta && n.meta.docKind ? ' &middot; ' + esc(n.meta.docKind) : '')
            + (n.meta && n.meta.navigatorType ? ' &middot; ' + esc(n.meta.navigatorType) : '')
            + '</div>';
          html += '<h2>' + esc(n.label) + staleBadge(n) + '</h2>';
          if (n.path) {
            html += href
              ? '<a class="path" href="' + esc(href) + '">' + esc(n.path) + '</a>'
              : '<div class="path muted">' + esc(n.path) + '</div>';
          }
          if (n.meta && n.meta.routePath) html += '<div class="path muted">' + esc(n.meta.routePath) + '</div>';
          if (n.summary) html += '<p class="summary">' + mdInline(n.summary) + '</p>';

          // A module's story - screens, folders, docs, blast radius - runs
          // long. The small drawer squeezed it into one narrow column; a full
          // page gives it room, same as a doc gets.
          if (n.type === 'module') {
            var modScope = moduleDetailScope(n);
            detailPage.innerHTML = '<div class="detail-inner wide">'
              + '<button class="ghost page-back" data-close-page>&#8592; Back to map</button>'
              + html + chipsHtml(modScope) + detailHtml(modScope) + '</div>';
            detailPage.classList.add('on');
            stage.classList.remove('panel-open');
            return;
          }

          if (n.type === 'doc') {
            openDocPage(n, html);
            return;
          }

          if (n.type === 'file') {
            html += '<div class="panel-actions"><button class="ghost" data-focus="' + esc(n.id) + '">Open in Focus</button></div>';
          }

          // Say which module (and area, if any) this sits in - a lone screen or
          // file otherwise reads as if it exists with no owner.
          if (n.module && nodeById['module:' + n.module]) {
            var ownerMod = nodeById['module:' + n.module];
            var ownerArea = areaOf(n.module, n.path);
            html += '<p class="lead module-context">Part of the ' + nodeLink(ownerMod) + ' module'
              + (ownerArea ? ', in the ' + esc(ownerArea.key) + ' area' : '') + '.'
              + (ownerMod.summary ? ' ' + esc(ownerMod.summary) : '') + '</p>';
          }

          // Most files and screens have no doc naming them directly - specs
          // usually cover a module or area, not every file in it. Falling back
          // to those keeps the section from just being empty, but the lead
          // sentence must say so plainly: it never claims these name the file.
          var directDocs = related(n.id, 'documents', 'in');
          if (directDocs.length) {
            html += listSection('Specs documenting this', directDocs.map(function (r) {
              return nodeLink(r.node, r.node.meta && r.node.meta.docKind);
            }));
          } else if ((n.type === 'file' || n.type === 'screen') && n.module && nodeById['module:' + n.module]) {
            var ownerMod2 = nodeById['module:' + n.module];
            var ownerArea2 = areaOf(n.module, n.path);
            var pool = moduleDocs(ownerMod2);
            var scoped = ownerArea2 ? pool.filter(function (d) { return areaOf(n.module, d.path) === ownerArea2; }) : [];
            var fallback = scoped.length ? scoped : pool;
            if (fallback.length) {
              html += '<section><h3>Specs documenting this</h3>'
                + '<p class="lead">No doc names this file directly. These describe the wider '
                + (scoped.length ? 'area' : 'module') + ':</p><ul>'
                + fallback.map(function (d) { return '<li>' + nodeLink(d, d.meta && d.meta.docKind) + '</li>'; }).join('')
                + '</ul></section>';
            }
          }
          if (guardrails.length) {
            html += '<section><h3>Guardrails</h3>'
              + '<div class="guard-list">' + guardrails.map(function (g) { return '<div class="guard">' + mdInline(g) + '</div>'; }).join('') + '</div>'
              + '</section>';
          }
          html += listSection('Describes', related(n.id, 'documents', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Links to', related(n.id, 'links', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Linked from', related(n.id, 'links', 'in').map(function (r) { return nodeLink(r.node); }));
          // Last, and only for docs: everything above is a path that resolves
          // today and can be clicked. What follows is the part that does not.
          html += brokenRefsHtml(n);
          html += listSection('Navigates to', related(n.id, 'navigates', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Reached from', related(n.id, 'navigates', 'in').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Rendered by', related(n.id, 'renders', 'out').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Renders', related(n.id, 'renders', 'in').map(function (r) { return nodeLink(r.node); }));
          html += listSection('Depends on', related(n.id, 'imports', 'out').slice(0, 60).map(function (r) {
            return nodeLink(r.node, r.weight > 1 ? r.weight + ' imports' : '');
          }));
          html += listSection('Depended on by', related(n.id, 'imports', 'in').slice(0, 60).map(function (r) {
            return nodeLink(r.node, r.weight > 1 ? r.weight + ' imports' : '');
          }));

          panel.innerHTML = '<button class="ghost close" data-close="1">Close</button>' + html;
          stage.classList.add('panel-open');
        }

        /** Copies via the Clipboard API where it works; index.html is opened
         * straight from disk, and file:// is not always a secure context, so a
         * hidden-textarea + execCommand fallback covers the browsers that
         * refuse the modern API there. */
        function legacyCopy(text, mark) {
          var ta = document.createElement('textarea');
          ta.value = text;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          var ok = false;
          try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
          document.body.removeChild(ta);
          mark(ok);
        }
        function copyPrompt(btn) {
          var box = document.getElementById(btn.getAttribute('data-copy'));
          if (!box) return;
          var text = box.textContent;
          var mark = function (ok) {
            btn.textContent = ok ? 'Copied' : 'Press ⌘/Ctrl+C to copy';
            btn.classList.toggle('copied', ok);
            setTimeout(function () {
              btn.textContent = 'Copy prompt for an AI agent';
              btn.classList.remove('copied');
            }, 1600);
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(function () { mark(true); }, function () { legacyCopy(text, mark); });
          } else {
            legacyCopy(text, mark);
          }
        }

        // ---------------------------------------------------------- risk modal
        /** The key never goes anywhere but here and Anthropic - no server of
         * ours sits in between, so localStorage on this page is the only
         * place it lives. */
        var AI_KEY_STORAGE = 'codemap-anthropic-key';
        function getApiKey() {
          try { return localStorage.getItem(AI_KEY_STORAGE) || ''; } catch (e) { return ''; }
        }
        function setApiKey(key) {
          try {
            if (key) localStorage.setItem(AI_KEY_STORAGE, key);
            else localStorage.removeItem(AI_KEY_STORAGE);
          } catch (e) { /* storage disabled (private mode, etc.) - key just won't persist */ }
        }
        function openModal(html) {
          aiModalBox.innerHTML = '<button type="button" class="modal-close" data-close-modal aria-label="Close">&times;</button>' + html;
          aiModal.classList.add('on');
        }
        function closeModal() { aiModal.classList.remove('on'); }

        var currentRiskKey = null;
        function openRiskModal(key) {
          var ctx = riskContexts[key];
          if (!ctx) return;
          currentRiskKey = key;
          openModal(riskModalBody(ctx));
        }
        function riskModalBody(ctx) {
          var body = '<h3>Risk: ' + esc(ctx.tier.label) + '</h3>'
            + '<p class="lead">' + riskTierMeaning(ctx.fanInCount) + '</p>';
          if (ctx.fanInNames.length) {
            body += '<p class="lead">Depended on by: '
              + andList(ctx.fanInNames.map(function (n) { return esc(n); })) + '.</p>';
          }
          return body + '<div id="ai-generate-area">' + aiGenerateSection() + '</div>';
        }
        /** A key-entry form the first time, a plain Generate button once one
         * is saved - the same markup either state hands back to swap itself
         * back in after a call succeeds, fails, or the user changes keys. */
        function aiGenerateSection() {
          if (!getApiKey()) {
            return '<p class="lead">Want a deeper, plain-English write-up? Paste your own Anthropic API key below - '
              + 'it is saved only in this browser’s local storage for this page. The request below goes '
              + 'straight from your browser to Anthropic’s API - we never see it.</p>'
              + '<input type="password" class="key-input" id="ai-key-input" placeholder="sk-ant-..." autocomplete="off" />'
              + '<div class="panel-actions"><button class="ghost" data-ai-generate="1">Save key &amp; generate</button></div>';
          }
          return '<div class="panel-actions"><button class="ghost" data-ai-generate="1">Generate a deeper explanation</button></div>'
            + '<a href="#" class="change-key" data-ai-change-key="1">Use a different API key</a>';
        }
        function changeAiKey() {
          setApiKey('');
          var area = document.getElementById('ai-generate-area');
          if (area) area.innerHTML = aiGenerateSection();
        }
        function runAiGenerate() {
          var ctx = riskContexts[currentRiskKey];
          var area = document.getElementById('ai-generate-area');
          if (!ctx || !area) return;
          var keyInput = document.getElementById('ai-key-input');
          var apiKey = (keyInput ? keyInput.value.trim() : '') || getApiKey();
          if (!apiKey) return;
          setApiKey(apiKey);
          area.innerHTML = '<p class="lead"><span class="spinner"></span> Generating - this goes straight from '
            + 'your browser to Anthropic using the key above, and back. Nothing passes through us.</p>';
          var prompt = 'You are explaining a risk indicator on a generated code map to a non-technical reader.\n\n'
            + 'Scope: ' + ctx.label + '\n'
            + 'Risk tier: ' + ctx.tier.label + ' (' + pluralize(ctx.fanInCount, 'other module') + ' import from it)\n'
            + (ctx.fanInNames.length ? 'Those modules: ' + ctx.fanInNames.join(', ') + '\n' : '')
            + 'Size: ' + pluralize(ctx.fileCount, 'file') + '\n\n'
            + 'In 2-4 short sentences with no jargon, explain what this risk level means in practice and what '
            + 'someone should watch for before changing files here. Do not just restate the numbers back.';
          callClaude(apiKey, prompt, function (err, text) {
            // Bail if the modal moved on (closed, or a different chip opened)
            // while this request was in flight - #ai-generate-area now points
            // at a fresh element, not the one this callback captured.
            if (document.getElementById('ai-generate-area') !== area) return;
            if (err) {
              if (err.status === 401) setApiKey('');
              area.innerHTML = '<div class="ai-error">' + esc(err.message || 'Could not reach Anthropic.') + '</div>'
                + aiGenerateSection();
              return;
            }
            area.innerHTML = '<div class="ai-output">' + esc(text) + '</div>'
              + '<a href="#" class="change-key" data-ai-change-key="1">Use a different API key</a>';
          });
        }
        /** Direct browser-to-Anthropic call - this file has no server of its
         * own, so the header below is what Anthropic requires to allow a
         * request like this straight from a page instead of a backend. */
        function callClaude(apiKey, prompt, cb) {
          fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'content-type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5-20251001',
              max_tokens: 220,
              messages: [{ role: 'user', content: prompt }],
            }),
          }).then(function (res) {
            return res.json().then(function (json) {
              if (!res.ok) {
                var err = new Error((json.error && json.error.message) || ('Anthropic API error (' + res.status + ')'));
                err.status = res.status;
                throw err;
              }
              return json;
            });
          }).then(function (json) {
            var text = (json.content || []).map(function (b) { return b.text || ''; }).join('').trim();
            cb(null, text || 'Claude returned an empty response.');
          }).catch(function (err) {
            cb(err.status ? err : { message: 'Could not reach Anthropic from this browser - this can happen if the '
              + 'request was blocked (e.g. by an extension) or you are offline.' });
          });
        }

        stage.addEventListener('click', function (ev) {
          if (ev.target.closest('[data-close-modal]')) { closeModal(); return; }
          var explainBtn = ev.target.closest('[data-explain-risk]');
          if (explainBtn) { openRiskModal(explainBtn.getAttribute('data-explain-risk')); return; }
          if (ev.target.closest('[data-ai-generate]')) { runAiGenerate(); return; }
          var changeKeyLink = ev.target.closest('[data-ai-change-key]');
          if (changeKeyLink) { ev.preventDefault(); changeAiKey(); return; }
          if (ev.target.closest('[data-close]')) { stage.classList.remove('panel-open'); return; }
          if (ev.target.closest('[data-close-page]')) { closeDetailPage(); return; }
          var copyBtn = ev.target.closest('[data-copy]');
          if (copyBtn) { copyPrompt(copyBtn); return; }
          var clusterBtn = ev.target.closest('[data-goto-cluster]');
          if (clusterBtn) {
            var slug = clusterBtn.getAttribute('data-goto-cluster');
            var m = nodeById['module:' + slug];
            if (m) openDocClusterPage({ id: 'dcl:module:' + slug, label: m.label, ref: 'module:' + slug });
            return;
          }
          var flowNode = ev.target.closest('[data-flow-node]');
          if (flowNode) {
            var li = document.getElementById('flow-step-' + flowNode.getAttribute('data-flow-node'));
            if (li) {
              li.scrollIntoView({ behavior: 'smooth', block: 'center' });
              li.classList.add('flash');
              setTimeout(function () { li.classList.remove('flash'); }, 900);
            }
            return;
          }
          var focusBtn = ev.target.closest('[data-focus]');
          if (focusBtn) { enterFocus(focusBtn.getAttribute('data-focus')); return; }
          var drillBtn = ev.target.closest('[data-drill]');
          if (drillBtn) { drillTo(drillBtn.getAttribute('data-drill')); return; }
          var areaBtn = ev.target.closest('[data-area]');
          if (areaBtn) {
            var val = areaBtn.getAttribute('data-area');
            var slash = val.indexOf('/');
            openAreaPanel(val.slice(0, slash), val.slice(slash + 1));
            return;
          }
          var link = ev.target.closest('[data-goto]');
          if (link) select(link.getAttribute('data-goto'), true);
        });

        document.addEventListener('keydown', function (ev) {
          if (ev.key !== 'Escape') return;
          if (aiModal.classList.contains('on')) { closeModal(); return; }
          if (detailPage.classList.contains('on')) { closeDetailPage(); return; }
          if (stage.classList.contains('panel-open')) {
            stage.classList.remove('panel-open');
            state.selected = null;
            applyDim();
          }
        });

        stage.addEventListener('keydown', function (ev) {
          if (ev.key === 'Enter' && ev.target && ev.target.id === 'ai-key-input') {
            ev.preventDefault();
            runAiGenerate();
          }
        });

        // -------------------------------------------------------------- events
        function resetFocusCaches() {
          computed.focus = Object.create(null);
          userMoved.focus = Object.create(null);
        }
        function saveFocusState() {
          save('focus', state.focus || '');
          save('focusPath', JSON.stringify(state.focusPath));
        }

        function focusPathForFile(n) {
          var m = nodeById['module:' + n.module];
          if (!m) return [];
          var parts = n.path.slice(m.path.length + 1).split('/');
          parts.pop();
          return parts;
        }

        function enterFocus(id) {
          var n = nodeById[id];
          if (!n) return;
          state.focus = id;
          state.focusPath = n.type === 'file' ? focusPathForFile(n) : [];
          resetFocusCaches();
          saveFocusState();
          document.querySelector('[data-view="focus"]').disabled = false;
          setView('focus');
          select(id, false);
        }

        function drillTo(rel) {
          state.focusPath = rel.split('/');
          resetFocusCaches();
          saveFocusState();
          if (state.view !== 'focus') setView('focus'); else render();
        }
        function drillUp() {
          if (!state.focusPath.length) return;
          state.focusPath.pop();
          resetFocusCaches();
          saveFocusState();
          render();
        }

        /**
         * Put a node and everything it touches on screen. Dimming the rest only
         * works if what survives is actually visible: centring on a doc whose
         * only neighbours sit in a different cluster left a black canvas with
         * two long edges crossing it, which reads as a broken render.
         */
        function frame(el) {
          var nb = el.closedNeighborhood();
          cy.animate({ fit: { eles: nb, padding: 70 } }, {
            duration: 220,
            complete: function () {
              // A node with no neighbours in this view fits to a single dot.
              if (cy.zoom() > 1.2) { cy.zoom(1.2); cy.center(nb); }
            },
          });
        }

        /** Highlight and describe a node. Never moves anything. */
        function select(id, jump) {
          state.selected = id;
          openPanel(id);
          var el = cy.getElementById(id);
          if (el.nonempty()) {
            applyDim();
            if (jump || cy.zoom() < (state.view === 'docs' ? 0.45 : 0.7)) frame(el);
            return;
          }
          if (!jump) return;
          // The node lives in another view - go there, then highlight it.
          var n = nodeById[id];
          if (!n) return;
          if (n.type === 'file') { enterFocus(id); return; }
          // A doc's or module's full page (just opened above by openPanel)
          // replaces the whole screen, so there is nothing left to frame there.
          if (n.type === 'doc' || n.type === 'module') return;
          var target = n.type === 'route' || n.type === 'screen' ? 'routes' : 'overview';
          setView(target);
          var el2 = cy.getElementById(id);
          if (el2.nonempty()) { applyDim(); frame(el2); }
        }

        /** Sections and clusters stand in for their feature's module node. */
        function compoundRef(el) {
          var ref = el.data('ref');
          return ref && nodeById[ref] ? ref : null;
        }

        /**
         * A section box opens its module or area's drawer in place, without
         * leaving the view it was tapped in - unlike a plain node, a module has
         * no element of its own here to jump to, so the old path bounced the
         * user out to Overview just to show something.
         */
        function selectSection(el) {
          var ref = compoundRef(el);
          if (!ref) return;
          var area = el.data('area') || null;
          state.selected = el.id();
          applyDim();
          frame(el);
          if (area) openAreaPanel(ref.slice('module:'.length), area);
          else openPanel(ref);
        }

        cy.on('tap', 'node', function (ev) {
          var id = ev.target.id();
          if (id.indexOf('up:') === 0) { drillUp(); return; }
          if (id.indexOf('group:') === 0) {
            var rest = id.slice('group:'.length);
            drillTo(rest.slice(rest.indexOf('/') + 1));
            return;
          }
          if (ev.target.data('section')) { selectSection(ev.target); return; }
          if (ev.target.data('cluster')) {
            openDocClusterPage({ id: ev.target.data('id'), label: ev.target.data('label'), ref: ev.target.data('ref') });
            return;
          }
          if (ev.target.isParent()) return;
          select(id, false);
        });
        cy.on('dbltap', 'node', function (ev) {
          var n = nodeById[ev.target.id()];
          if (n && (n.type === 'module' || n.type === 'file')) enterFocus(n.id);
        });
        cy.on('tap', function (ev) {
          if (ev.target !== cy) return;
          state.selected = null;
          stage.classList.remove('panel-open');
          applyDim();
          applySearch();
        });
        cy.on('mouseover', 'node', function (ev) { ev.target.addClass('hover'); });
        cy.on('mouseout', 'node', function (ev) { ev.target.removeClass('hover'); });
        // Remember where you put things. Dragging a section moves its members,
        // so store every descendant, not the compound itself.
        cy.on('dragfree', 'node', function (ev) {
          var store = userMoved[state.view] || (userMoved[state.view] = Object.create(null));
          ev.target.union(ev.target.descendants()).forEach(function (n) {
            if (n.isParent()) return;
            store[n.id()] = { x: n.position('x'), y: n.position('y') };
          });
        });

        function setView(view) {
          closeDetailPage();
          state.view = view;
          save('view', view);
          document.querySelectorAll('.views button').forEach(function (b) {
            b.setAttribute('aria-selected', String(b.dataset.view === view));
          });
          document.getElementById('granularity').hidden = view !== 'focus';
          document.getElementById('orientation').hidden = view !== 'routes';
          document.getElementById('crosslinks').hidden = view !== 'routes';
          render();
        }

        document.querySelectorAll('.views button').forEach(function (b) {
          b.addEventListener('click', function () { if (!b.disabled) setView(b.dataset.view); });
        });
        document.querySelector('[data-view="routes"]').disabled = !hasRoutes;
        document.querySelector('[data-view="docs"]').disabled = !hasDocs;
        if (!hasRoutes) document.querySelector('[data-view="routes"]').title = 'No routes detected in this repo';
        if (!hasDocs) document.querySelector('[data-view="docs"]').title = 'No docs matched in this repo';

        document.getElementById('fit').addEventListener('click', function () { cy.fit(undefined, 50); });

        var viewMenuBtn = document.getElementById('viewMenuBtn');
        var viewMenuPanel = document.getElementById('viewMenuPanel');
        function closeViewMenu() {
          viewMenuPanel.hidden = true;
          viewMenuBtn.setAttribute('aria-expanded', 'false');
        }
        viewMenuBtn.addEventListener('click', function (ev) {
          ev.stopPropagation();
          var opening = viewMenuPanel.hidden;
          viewMenuPanel.hidden = !opening;
          viewMenuBtn.setAttribute('aria-expanded', String(opening));
        });
        document.addEventListener('click', function (ev) {
          if (!viewMenuPanel.hidden && !ev.target.closest('#viewMenu')) closeViewMenu();
        });
        document.addEventListener('keydown', function (ev) {
          if (ev.key === 'Escape' && !viewMenuPanel.hidden) closeViewMenu();
        });

        var themeBtn = document.getElementById('theme-toggle');
        function themeLabel() {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          themeBtn.innerHTML = light ? '&#9788; Dark' : '&#9788; Light';
        }
        themeLabel();
        themeBtn.addEventListener('click', function () {
          var light = document.documentElement.getAttribute('data-theme') === 'light';
          if (light) document.documentElement.removeAttribute('data-theme');
          else document.documentElement.setAttribute('data-theme', 'light');
          save('theme', light ? 'dark' : 'light');
          themeLabel();
          refreshPalette();
          cy.style().update();
        });
        document.getElementById('relayout').addEventListener('click', function () {
          userMoved[state.view] = Object.create(null);
          computed[state.view] = Object.create(null);
          render();
        });
        document.getElementById('up').addEventListener('click', drillUp);

        var orientBtn = document.getElementById('orientation');
        function orientLabel() {
          var dir = state.treeDir === 'auto' ? (lastRoutesDir || currentRouteDir()) : state.treeDir;
          orientBtn.textContent = dir === 'LR' ? 'Left to right' : 'Top down';
        }
        orientBtn.addEventListener('click', function () {
          var dir = state.treeDir === 'auto' ? (lastRoutesDir || currentRouteDir()) : state.treeDir;
          state.treeDir = dir === 'LR' ? 'TB' : 'LR';
          save('treeDir', state.treeDir);
          orientLabel();
          userMoved.routes = Object.create(null);
          render();
        });

        var crossBtn = document.getElementById('crosslinks');
        function crossLabel() {
          crossBtn.classList.toggle('on', state.crossLinks);
          crossBtn.textContent = state.crossLinks ? 'Hide jumps' : 'Show jumps';
          crossBtn.title = 'Jumps between screens that are not part of the navigation tree';
        }
        crossBtn.addEventListener('click', function () {
          state.crossLinks = !state.crossLinks;
          save('crossLinks', state.crossLinks ? 'on' : 'off');
          crossLabel();
          render();
        });

        var granBtn = document.getElementById('granularity');
        function granLabel() {
          granBtn.textContent = state.granularity === 'files' ? 'All files' : 'By folder';
        }
        granBtn.addEventListener('click', function () {
          state.granularity = state.granularity === 'files' ? 'folders' : 'files';
          granLabel();
          resetFocusCaches();
          render();
        });

        var searchEl = document.getElementById('search');
        var searchTimer;
        searchEl.addEventListener('input', function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(function () { state.query = searchEl.value; applySearch(); }, 120);
        });
        searchEl.addEventListener('keydown', function (ev) {
          if (ev.key !== 'Enter') return;
          var hit = cy.nodes('.hit').first();
          if (hit.nonempty()) select(hit.id(), true);
        });

        var filters = document.getElementById('filters');
        filters.innerHTML = TYPES.filter(function (t) { return counts[t] > 0; }).map(function (t) {
          return '<label><input type="checkbox" data-type="' + t + '" checked>'
            + '<span class="swatch" style="background:var(--c-' + t + ')"></span>' + t + '</label>';
        }).join('');
        filters.addEventListener('change', function (ev) {
          var t = ev.target.dataset.type;
          if (!t) return;
          state.hidden[t] = !ev.target.checked;
          render();
        });

        // ---------------------------------------------------------------- boot
        document.getElementById('stat-line').textContent =
          GRAPH.stats.modules + ' modules  -  ' + GRAPH.stats.files + ' files  -  '
          + GRAPH.stats.routes + ' routes  -  ' + GRAPH.stats.docs + ' docs';

        var lastFocus = load('focus');
        if (lastFocus && nodeById[lastFocus]) {
          state.focus = lastFocus;
          try { state.focusPath = JSON.parse(load('focusPath') || '[]') || []; } catch (e) { state.focusPath = []; }
          document.querySelector('[data-view="focus"]').disabled = false;
        }
        var lastView = load('view');
        var lastBtn = lastView && document.querySelector('[data-view="' + lastView + '"]');
        var startView = lastBtn && !lastBtn.disabled ? lastView : 'overview';
        if (startView === 'focus' && !state.focus) startView = 'overview';
        granLabel();
        crossLabel();
        if (hasRoutes) orientLabel();
        setView(startView);
      })();
    </script>
  </body>
</html>
